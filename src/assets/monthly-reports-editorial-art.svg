<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#3C3024" flood-opacity=".12"/></filter>
    <linearGradient id="cream" x1="50" y1="20" x2="1540" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFCF6"/><stop offset=".58" stop-color="#FFF8EE"/><stop offset="1" stop-color="#F8E7D8"/></linearGradient>
    <linearGradient id="navy" x1="1160" y1="174" x2="1500" y2="530" gradientUnits="userSpaceOnUse"><stop stop-color="#173B60"/><stop offset="1" stop-color="#082A4D"/></linearGradient>
    <pattern id="ruled" width="32" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5H32" stroke="#829AAE" stroke-opacity=".16"/></pattern>
    <pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#D99663" fill-opacity=".42"/></pattern>
  </defs>

  <rect width="1600" height="560" rx="34" fill="url(#cream)" filter="url(#paper)"/>
  <rect x="18" y="18" width="1564" height="524" rx="27" stroke="#BFAF9E" stroke-opacity=".22"/>

  <g opacity=".48" stroke="#E48B5E" stroke-width="1.3">
    <circle cx="18" cy="4" r="75"/><circle cx="18" cy="4" r="96"/><circle cx="18" cy="4" r="118"/>
    <path d="M420 -18C500 70 560 92 650 73C721 58 762 24 803 -18"/>
    <path d="M1348 572C1404 477 1480 440 1590 456"/><path d="M1390 579C1440 496 1501 468 1608 482"/>
  </g>

  <g opacity=".38" stroke="#B59A76" stroke-width="1.2">
    <path d="M55 488C83 426 113 386 160 350"/><path d="M80 444C59 421 43 412 24 409"/><path d="M105 408C129 380 150 364 180 349"/><path d="M132 377C111 357 94 347 70 345"/><path d="M158 353C181 328 204 315 233 305"/>
  </g>
  <g fill="#B69A74" fill-opacity=".13"><ellipse cx="40" cy="412" rx="38" ry="11" transform="rotate(30 40 412)"/><ellipse cx="88" cy="365" rx="38" ry="11" transform="rotate(32 88 365)"/><ellipse cx="150" cy="334" rx="39" ry="11" transform="rotate(-31 150 334)"/><ellipse cx="205" cy="306" rx="36" ry="10" transform="rotate(-27 205 306)"/></g>

  <!-- layered stationery behind the live report panel -->
  <g filter="url(#shadow)">
    <rect x="845" y="58" width="590" height="430" rx="8" fill="#E9D8C4" transform="rotate(-3 845 58)" opacity=".72"/>
    <rect x="810" y="84" width="594" height="425" rx="7" fill="#F2E6D6" transform="rotate(1.8 810 84)"/>
    <rect x="780" y="101" width="602" height="411" rx="8" fill="#FFFDF8" stroke="#CDBEAE" stroke-opacity=".46"/>
  </g>

  <!-- notebook edge -->
  <g opacity=".98">
    <rect x="1230" y="110" width="348" height="448" rx="16" fill="url(#navy)" transform="rotate(4 1230 110)"/>
    <path d="M1280 157H1517M1280 187H1517M1280 217H1517" stroke="#7290AA" stroke-opacity=".18"/>
    <rect x="1480" y="142" width="38" height="290" rx="19" fill="#214B70" opacity=".42"/>
  </g>

  <!-- ruled paper peeking out on the left of the panel -->
  <g transform="translate(694 70) rotate(-5 180 205)" opacity=".84">
    <rect width="360" height="410" rx="4" fill="#FFFDF8" stroke="#C9B8A5" stroke-opacity=".42"/>
    <rect x="50" y="58" width="276" height="302" fill="url(#ruled)"/>
    <path d="M50 58V360" stroke="#E2A38C" stroke-opacity=".44"/>
    <g fill="#D2C0AA"><circle cx="20" cy="54" r="6"/><circle cx="20" cy="100" r="6"/><circle cx="20" cy="146" r="6"/><circle cx="20" cy="192" r="6"/><circle cx="20" cy="238" r="6"/><circle cx="20" cy="284" r="6"/><circle cx="20" cy="330" r="6"/></g>
  </g>

  <!-- torn sheet behind metric strip -->
  <path d="M75 398L745 392L762 418L751 501L702 508L646 502L588 509L531 503L474 509L417 502L356 510L297 503L242 509L181 502L120 510L72 502L63 430Z" fill="#FFF9EF" fill-opacity=".72" stroke="#D8C7B2" stroke-opacity=".28"/>

  <!-- decorative desk items -->
  <rect x="1210" y="69" width="105" height="27" rx="3" fill="#E9B891" fill-opacity=".68" transform="rotate(7 1210 69)"/>
  <g transform="translate(1498 250) rotate(18)"><rect width="24" height="228" rx="12" fill="#151E26"/><rect x="4" y="9" width="16" height="150" rx="8" fill="#283C50"/><path d="M12 228L1 178H23L12 228Z" fill="#C59A5D"/><path d="M12 228L8 211H16L12 228Z" fill="#24201C"/><rect x="6" y="20" width="3" height="104" rx="1.5" fill="#8393A2" fill-opacity=".55"/></g>
  <rect x="1433" y="74" width="96" height="84" fill="url(#dots)" opacity=".65"/>

  <!-- embossed seal -->
  <g opacity=".2" stroke="#7C644C"><circle cx="1370" cy="490" r="44"/><circle cx="1370" cy="490" r="36"/><path d="M1348 474C1357 463 1386 463 1395 476C1403 489 1396 509 1383 515C1370 522 1354 516 1347 505"/><path d="M1360 468V513M1360 469H1376C1387 469 1392 476 1392 484C1392 492 1386 498 1375 498H1360"/></g>
</svg>