<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Subtle Halloween night, moonlight and fine copper cobwebs">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2=".84">
      <stop offset="0" stop-color="#18152d"/>
      <stop offset=".46" stop-color="#241934"/>
      <stop offset="1" stop-color="#13172d"/>
    </linearGradient>
    <radialGradient id="amber"><stop stop-color="#c86d42" stop-opacity=".15"/><stop offset="1" stop-color="#c86d42" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#a889e1" stop-opacity=".13"/><stop offset="1" stop-color="#a889e1" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon"><stop stop-color="#fff4e4"/><stop offset=".8" stop-color="#eddfef"/><stop offset="1" stop-color="#c2bad7"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#f3cfb4" stop-opacity=".11"/><stop offset="1" stop-color="#e4c6b9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="440" fill="url(#night)"/>
  <ellipse cx="120" cy="355" rx="390" ry="270" fill="url(#amber)"/>
  <ellipse cx="1490" cy="60" rx="420" ry="280" fill="url(#violet)"/>
  <ellipse cx="1484" cy="98" rx="180" ry="150" fill="url(#halo)"/>
  <circle cx="1484" cy="99" r="38" fill="url(#moon)" opacity=".64"/>
  <circle cx="1475" cy="91" r="9" fill="#aa9eae" opacity=".16"/>
  <circle cx="1498" cy="112" r="5" fill="#aa9eae" opacity=".12"/>
  <!-- Fine, low-opacity corner webs. All decorations stay behind footer cards. -->
  <g fill="none" stroke="#c8a18d" stroke-opacity=".22" stroke-width=".9" stroke-linecap="round">
    <path d="M0 0H128M0 0V128M0 0L115 115M0 0L124 62M0 0L62 124"/>
    <path d="M23 0Q23 23 0 23M49 0Q49 49 0 49M79 0Q79 79 0 79M111 0Q111 111 0 111"/>
    <path d="M1600 0h-105M1600 0v105M1600 0l-92 92M1600 0l-99 46M1600 0l-46 99"/>
    <path d="M1575 0q0 25 25 25M1548 0q0 52 52 52M1520 0q0 80 80 80"/>
  </g>
  <!-- The star points are barely perceptible, keeping the cards as the focus. -->
  <g fill="#ffead7" opacity=".27">
    <circle cx="220" cy="48" r="1.15"/><circle cx="380" cy="105" r="1.1"/>
    <circle cx="593" cy="47" r=".9"/><circle cx="840" cy="98" r="1.2"/>
    <circle cx="1045" cy="44" r=".8"/><circle cx="1270" cy="118" r="1.1"/>
    <circle cx="1451" cy="210" r=".9"/><circle cx="135" cy="190" r=".9"/>
    <circle cx="755" cy="205" r=".9"/><circle cx="1580" cy="290" r="1"/>
  </g>
  <!-- Discreet Halloween silhouette at the far lower edge. -->
  <g fill="#060b1d" opacity=".27">
    <path d="M1320 440v-55l21-19 20 19v55h25v-75l24-22 25 22v75h22v-51l17-16 18 16v51h20Z"/>
    <path d="M1331 384l10-28 10 28m47-19 12-43 13 43m55 24 7-26 9 26"/>
    <path d="M0 426q180-25 352 3t362 0 412-4 474 0v15H0Z"/>
  </g>
