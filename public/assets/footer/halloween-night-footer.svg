  <g fill="#0b0e21" opacity=".43">
    <path d="M1393 75q-12-7-23 0l2 6q9-4 14 5l7-3 7 3q5-9 14-5l2-6q-11-7-23 0Z"/>
    <path d="M1548 175q-9-6-18 0l2 5q7-3 11 4l5-3 5 3q5-7 12-4l2-5q-9-6-19 0Z"/>
  </g>
  <path d="M0 1H1600" stroke="#eaa672" stroke-width="1.8" stroke-opacity=".54"/>
