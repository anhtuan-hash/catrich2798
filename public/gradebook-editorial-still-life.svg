<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Editorial still life with books, pencil cup, glasses and gradebook">
  <defs>
    <linearGradient id="bookBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fc0ff"/><stop offset="1" stop-color="#2f78d7"/></linearGradient>
    <linearGradient id="bookNavy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6fb8"/><stop offset="1" stop-color="#174c8f"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffefd"/><stop offset="1" stop-color="#f2eee7"/></linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e98f4"/><stop offset=".55" stop-color="#1f67c7"/><stop offset="1" stop-color="#0d3f87"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#dcecff" stop-opacity=".9"/><stop offset="1" stop-color="#dcecff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#315b8c" flood-opacity=".2"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <ellipse cx="400" cy="343" rx="255" ry="42" fill="url(#glow)" opacity=".95"/>

  <!-- soft editorial foliage -->
  <g opacity=".5" transform="translate(78 80) rotate(-12)">
    <path d="M120 190C92 128 72 79 36 30" fill="none" stroke="#7fa18f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="88" cy="121" rx="18" ry="40" fill="#9eb9aa" transform="rotate(-36 88 121)"/>
    <ellipse cx="58" cy="79" rx="17" ry="34" fill="#86a693" transform="rotate(-44 58 79)"/>
    <ellipse cx="112" cy="151" rx="16" ry="34" fill="#adc4b7" transform="rotate(28 112 151)"/>
    <ellipse cx="39" cy="46" rx="15" ry="30" fill="#789984" transform="rotate(-50 39 46)"/>
  </g>

  <!-- stacked books -->
  <g filter="url(#shadow)" transform="translate(176 175)">
    <path d="M0 112L330 95L354 134L24 151Z" fill="#dfd6c8"/>
    <path d="M20 92L340 76L349 108L28 124Z" fill="url(#paper)" stroke="#d8d1c7"/>
    <path d="M30 58L322 44L344 78L50 93Z" fill="url(#bookNavy)"/>
    <path d="M43 50L316 36L322 48L48 63Z" fill="#cfe3fb"/>
    <path d="M68 20L292 8L322 40L86 54Z" fill="url(#bookBlue)"/>
    <text x="125" y="39" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#ffffff">English</text>
    <text x="95" y="83" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fbff">Learning for a better future</text>
  </g>

  <!-- gradebook open sheet behind books -->
  <g transform="translate(300 115) rotate(-7 160 90)" opacity=".98" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="188" rx="14" fill="url(#paper)" stroke="#d4dfec"/>
    <rect x="18" y="20" width="294" height="22" rx="6" fill="#e9f2ff"/>
    <g stroke="#c8d7ea" stroke-width="1">
      <path d="M18 55H312M18 81H312M18 107H312M18 133H312M18 159H312"/>
      <path d="M72 42V172M126 42V172M180 42V172M234 42V172M288 42V172"/>
    </g>
    <g fill="#7d9bc1" font-family="Arial, sans-serif" font-size="9">
      <text x="31" y="71">HS</text><text x="84" y="71">TX1</text><text x="139" y="71">TX2</text><text x="193" y="71">GK</text><text x="247" y="71">CK</text>
      <text x="31" y="97">01</text><text x="88" y="97">8.5</text><text x="141" y="97">9.0</text><text x="197" y="97">8.8</text><text x="250" y="97">9.2</text>
      <text x="31" y="123">02</text><text x="88" y="123">7.8</text><text x="141" y="123">8.6</text><text x="197" y="123">9.1</text><text x="250" y="123">8.9</text>
      <text x="31" y="149">03</text><text x="88" y="149">9.3</text><text x="141" y="149">9.4</text><text x="197" y="149">9.0</text><text x="250" y="149">9.6</text>
    </g>
  </g>

  <!-- pencil cup -->
  <g transform="translate(531 88)" filter="url(#shadow)">
    <path d="M26 69H111L101 194H39Z" fill="#f1ede6" stroke="#d9d2c7"/>
    <ellipse cx="68" cy="69" rx="43" ry="12" fill="#faf8f4" stroke="#d9d2c7"/>
    <g stroke-linecap="round" stroke-width="9">
      <path d="M46 66L28 8" stroke="#143f75"/><path d="M68 63L69 0" stroke="#c28a33"/><path d="M88 65L101 8" stroke="#1f5da8"/>
    </g>
    <g stroke="#f0c58e" stroke-width="2"><path d="M27 7l4-7 3 7"/><path d="M68 0l3-8 3 8"/><path d="M100 8l4-7 3 7"/></g>
  </g>

  <!-- diagonal blue pen -->
  <g transform="translate(485 185) rotate(24 20 110)" filter="url(#shadow)">
    <rect x="9" y="0" width="18" height="190" rx="9" fill="url(#pen)"/>
    <rect x="11" y="18" width="14" height="45" rx="7" fill="#78b4ff" opacity=".8"/>
    <path d="M9 190L18 212L27 190Z" fill="#d9dee6"/><path d="M15 206L18 216L21 206Z" fill="#173f6e"/>
    <rect x="8" y="0" width="20" height="16" rx="7" fill="#0d4a98"/>
  </g>

  <!-- glasses -->
  <g transform="translate(440 322) rotate(-3)" fill="none" stroke="#332a24" stroke-width="7" stroke-linecap="round" filter="url(#shadow)">
    <ellipse cx="42" cy="15" rx="37" ry="20"/><ellipse cx="126" cy="15" rx="37" ry="20"/>
    <path d="M79 13H90M5 10L-30 -2M163 10L198 -1"/>
  </g>

  <!-- tiny sparkles -->
  <g fill="#6aa5ef" opacity=".8">
    <circle cx="660" cy="81" r="4"/><circle cx="694" cy="107" r="2.5"/><circle cx="624" cy="55" r="2"/>
    <path d="M151 101l5 10 10 5-10 5-5 10-5-10-10-5 10-5z" opacity=".5"/>
  </g>
</svg>