name: Lesson Check Approved Mockup 1 Safety
on:
  pull_request:
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/pages/LessonCheckApprovedMockupOne.css'
      - 'public/lesson-check-approved-mascot.svg'
      - 'tests/lesson-check-approved-mockup-1.test.mjs'
      - '.github/workflows/lesson-check-approved-mockup-1.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/pages/LessonCheckApprovedMockupOne.css'
      - 'public/lesson-check-approved-mascot.svg'
      - 'tests/lesson-check-approved-mockup-1.test.mjs'
jobs:
  ui-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Approved layout and action contract
        run: node --test tests/lesson-check-approved-mockup-1.test.mjs tests/lesson-check-preview-integrity.test.mjs
      - name: Build production
        run: npm run build
