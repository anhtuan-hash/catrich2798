name: Lesson Check Approved Mockup 1 Safety
on:
  pull_request:
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/pages/LessonCheckApprovedMockupOne.css'
      - 'public/lesson-check-approved-mascot.svg'
      - 'tests/lesson-check-approved-mockup-1.test.mjs'
      - 'tests/e2e/lesson-check-search-visible.spec.js'
      - 'tests/e2e/lesson-check-search-results.spec.js'
      - '.github/workflows/lesson-check-approved-mockup-1.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/pages/LessonCheckApprovedMockupOne.css'
      - 'public/lesson-check-approved-mascot.svg'
      - 'tests/lesson-check-approved-mockup-1.test.mjs'
      - 'tests/e2e/lesson-check-search-visible.spec.js'
      - 'tests/e2e/lesson-check-search-results.spec.js'
jobs:
  ui-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Approved layout and action contract
        run: node --test tests/lesson-check-approved-mockup-1.test.mjs
      - name: Build production
        run: npm run build
      - name: Install Chromium for visible-UI regression
        run: npx playwright install --with-deps chromium
      - name: Verify search visibility at desktop, tablet and mobile
        run: npx playwright test tests/e2e/lesson-check-search-visible.spec.js --project=chromium-desktop
      - name: Build test-only Supabase fixture client
        env:
          VITE_SUPABASE_URL: https://search-fixture.invalid
          VITE_SUPABASE_ANON_KEY: public-test-only-anon-not-a-secret
        run: npm run build
      - name: Verify search actually filters the game library
        run: npx playwright test tests/e2e/lesson-check-search-results.spec.js --project=chromium-desktop
