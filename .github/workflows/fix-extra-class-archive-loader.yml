name: Fix Extra Class Archive Loader

on:
  push:
    branches:
      - 'feat/extra-class-archive-governance'
    paths:
      - 'scripts/fix-extra-class-archive-loader.mjs'
      - '.github/workflows/fix-extra-class-archive-loader.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/extra-class-archive-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply archive loader fix
        run: node scripts/fix-extra-class-archive-loader.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: load class archive for attendance managers"
          git push origin HEAD:feat/extra-class-archive-governance
