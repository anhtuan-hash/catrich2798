name: Upgrade TTCM file experience once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-ttcm-file-experience-once.py'
      - '.github/workflows/upgrade-ttcm-file-experience-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make migration idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/upgrade-ttcm-file-experience-once.py')
          text = p.read_text(encoding='utf-8')
          old = """def patch(path, old, new, count=1):\n    p = ROOT / path\n    text = p.read_text(encoding='utf-8')\n    if old not in text:\n        raise SystemExit(f'Marker not found in {path}: {old[:120]!r}')\n    text = text.replace(old, new, count)\n    p.write_text(text, encoding='utf-8')\n"""
          new = """def patch(path, old, new, count=1):\n    p = ROOT / path\n    text = p.read_text(encoding='utf-8')\n    if new in text:\n        print(f'Already applied: {path}')\n        return\n    if old not in text:\n        raise SystemExit(f'Marker not found in {path}: {old[:120]!r}')\n    text = text.replace(old, new, count)\n    p.write_text(text, encoding='utf-8')\n"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Could not locate patch helper')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Apply TTCM file upgrade
        run: python scripts/upgrade-ttcm-file-experience-once.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add api/_work-hub-file-access.js src/utils/workHubDelivery.js src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmNavigationTab.css
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat(ttcm): preview edit and download attachments"
            git push origin HEAD:main
          fi
