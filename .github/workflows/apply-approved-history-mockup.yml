name: Apply approved history mockup

on:
  push:
    branches:
      - fix/attendance-history-mockup-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-history-mockup-final
          fetch-depth: 0
      - name: Apply final approved History mockup CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/attendance/AttendanceHistoryV2.css')
          text = path.read_text()
          marker = '/* Approved history mockup final */'
          if marker in text:
              text = text.split(marker)[0].rstrip() + '\n\n'
          override = r'''/* Approved history mockup final */
          .ahv3__shell {
            grid-template-columns: minmax(320px, 360px) minmax(0, 1fr);
            gap: 16px;
          }

          .ahv3__shell .ahv3__list,
          .ahv3__shell .ahv3__detail {
            border-color: #dce6f3 !important;
            border-radius: 22px !important;
            box-shadow: 0 10px 30px rgba(38, 69, 116, 0.075) !important;
          }

          .ahv3__shell .ahv3__list-head {
            padding: 16px 14px 13px;
          }

          .ahv3__shell .ahv3__list-title strong {
            font-size: 16px;
            letter-spacing: -0.025em;
          }

          .ahv3__shell .ahv3__list-actions button {
            min-height: 36px;
            padding: 0 12px;
            border-color: #cdddf6 !important;
            background: #f5f9ff !important;
            color: #2459a9;
            font-size: 10.5px;
          }

          .ahv3__shell .ahv3__list-actions button:hover,
          .ahv3__shell .ahv3__list-actions button.is-active {
            background: #2f6fed !important;
            border-color: #2f6fed !important;
            color: #fff;
          }

          .ahv3__shell .ahv3__list-head > .ahv3__search {
            min-height: 42px;
            margin-top: 11px !important;
            border-color: #d8e4f4;
            border-radius: 12px;
            background: #f8fbff;
          }

          .ahv3__shell .ahv3__filters select,
          .ahv3__shell .ahv3__date-filters input {
            min-height: 42px;
            border-radius: 12px !important;
            font-size: 10.5px;
          }

          .ahv3__shell .ahv3__items {
            gap: 9px;
            padding: 11px 9px 15px;
            scrollbar-gutter: stable;
          }

          .ahv3__shell .ahv3__items > button {
            grid-template-columns: 32px minmax(0, 1fr) auto;
            gap: 10px;
            min-height: 88px;
            padding: 10px 10px 10px 9px;
            border-radius: 15px !important;
            box-shadow: 0 4px 12px rgba(57, 82, 124, 0.045);
          }

          .ahv3__shell .ahv3__items > button.is-selected,
          .ahv3__shell .ahv3__items > button.is-bulk-selected {
            border-color: #5f91f1 !important;
            background: linear-gradient(115deg, #edf4ff 0%, #ffffff 78%) !important;
            box-shadow: 0 8px 18px rgba(47, 111, 237, 0.13), inset 4px 0 0 #2f6fed;
          }

          .ahv3__shell .ahv3__card-title b {
            font-size: 12.5px;
          }

          .ahv3__shell .ahv3__count b {
            font-size: 13px;
          }

          .ahv3__shell .ahv3__detail {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
            align-content: start;
            align-items: start;
            gap: 10px 12px;
            padding: 11px 12px 12px !important;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            background: #fdfefe !important;
          }

          .ahv3__shell .ahv3__detail > .ahv3__hero {
            grid-column: 1 / -1;
            order: 1;
          }

          .ahv3__shell .ahv3__detail > .ahv3__section-title.is-info {
            grid-column: 1 / -1;
            order: 2;
          }

          .ahv3__shell .ahv3__detail > .ahv3__info-grid {
            grid-column: 1 / -1;
            order: 3;
          }

          .ahv3__shell .ahv3__detail > .ahv3__summary-title {
            grid-column: 1 / -1;
            order: 4;
          }

          .ahv3__shell .ahv3__detail > .ahv3__stat-grid {
            grid-column: 1 / -1;
            order: 5;
          }

          .ahv3__shell .ahv3__detail > .ahv3__audit-actor-panel {
            grid-column: 1 / -1;
            order: 6;
          }

          .ahv3__shell .ahv3__detail > .ahv3__late-section {
            grid-column: 1 / -1;
            order: 7;
          }

          .ahv3__shell .ahv3__detail > .att-m3-cancel-reason {
            grid-column: 1 / -1;
            order: 7;
          }

          .ahv3__shell .ahv3__detail > .ahv3__proof {
            grid-column: 1 / 2;
            order: 8;
          }

          .ahv3__shell .ahv3__detail > .ahv3__absent-section {
            grid-column: 2 / 3;
            order: 8;
          }

          .ahv3__shell .ahv3__detail:not(:has(> .ahv3__proof)) > .ahv3__absent-section {
            grid-column: 1 / -1;
          }

          .ahv3__shell .ahv3__detail:not(:has(> .ahv3__absent-section)) > .ahv3__proof {
            grid-column: 1 / -1;
          }

          .ahv3__shell .ahv3__detail > .ahv3__footer-grid {
            grid-column: 1 / -1;
            order: 9;
          }

          .ahv3__shell .ahv3__bulk-detail,
          .ahv3__shell .attendance-empty.is-large {
            grid-column: 1 / -1;
          }

          .ahv3__shell .ahv3__hero {
            position: relative;
            min-height: 124px;
            padding: 15px 17px;
            overflow: hidden;
            border: 1px solid #d8e6fa !important;
            border-radius: 19px !important;
            background:
              radial-gradient(circle at 80% 10%, rgba(116, 148, 255, .14), transparent 28%),
              linear-gradient(112deg, #edf5ff 0%, #f8fbff 58%, #ffffff 100%) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
          }

          .ahv3__shell .ahv3__hero::before {
            content: '';
            position: absolute;
            inset: 0 0 0 auto;
            width: 42%;
            background: linear-gradient(135deg, transparent 8%, rgba(47, 111, 237, .025) 55%, rgba(123, 87, 220, .07));
            clip-path: polygon(28% 0, 100% 0, 100% 100%, 0 100%);
            pointer-events: none;
          }

          .ahv3__shell .ahv3__hero-copy {
            position: relative;
            z-index: 3;
            max-width: 62%;
          }

          .ahv3__shell .ahv3__hero-copy h2 {
            margin: 7px 0 7px !important;
            color: #10233f;
            font-size: clamp(20px, 2vw, 25px) !important;
            line-height: 1.12;
            letter-spacing: -0.035em;
          }

          .ahv3__shell .ahv3__hero-chips {
            gap: 6px;
          }

          .ahv3__shell .ahv3__hero-chips > span {
            min-height: 25px;
            display: inline-flex;
            align-items: center;
            padding: 0 8px;
            border: 1px solid rgba(211, 223, 241, .78);
            border-radius: 999px;
            background: rgba(255, 255, 255, .88);
            color: #4b607c;
            font-size: 8.5px;
            font-weight: 800;
          }

          .ahv3__shell .ahv3__actions {
            position: absolute;
            z-index: 5;
            top: 13px;
            right: 13px;
            display: flex;
            gap: 7px;
          }

          .ahv3__shell .ahv3__actions button {
            min-height: 34px;
            border-radius: 10px !important;
            font-size: 10px;
            box-shadow: 0 4px 12px rgba(47, 84, 136, .06);
          }

          .ahv3__shell .ahv3__hero-art {
            position: absolute;
            z-index: 2;
            right: 35px;
            bottom: 2px;
            width: 270px;
            height: 82px;
            opacity: .92;
            pointer-events: none;
          }

          .ahv3__shell .ahv3__hero-art::before {
            content: '';
            position: absolute;
            right: 78px;
            bottom: 46px;
            width: 54px;
            height: 20px;
            background: #577de7;
            clip-path: polygon(50% 0, 100% 45%, 50% 90%, 0 45%);
            filter: drop-shadow(0 4px 5px rgba(48, 79, 166, .16));
          }

          .ahv3__shell .ahv3__hero-art::after {
            content: 'Tri thức\A kiến tạo\A tương lai';
            position: absolute;
            right: 0;
            bottom: 13px;
            color: #45619a;
            font-size: 10px;
            font-style: italic;
            font-weight: 700;
            line-height: 1.25;
            text-align: right;
            white-space: pre;
            transform: rotate(-3deg);
            opacity: .8;
          }

          .ahv3__shell .ahv3__hero-art .is-book {
            right: 100px;
            width: 72px;
            height: 12px;
            border: 4px solid #82a0ee;
            border-radius: 8px;
            background: rgba(255, 255, 255, .74);
            box-shadow: 0 3px 8px rgba(71, 102, 180, .08);
          }

          .ahv3__shell .ahv3__hero-art .is-book-1 { bottom: 7px; }
          .ahv3__shell .ahv3__hero-art .is-book-2 { bottom: 22px; transform: translateX(5px); }
          .ahv3__shell .ahv3__hero-art .is-book-3 { bottom: 37px; transform: translateX(-2px); }

          .ahv3__shell .ahv3__hero-art .is-leaf {
            bottom: 5px;
            width: 46px;
            height: 17px;
            border-radius: 100% 0 100% 0;
            background: #75d4ac;
            opacity: .75;
          }
          .ahv3__shell .ahv3__hero-art .is-leaf-1 { right: 157px; transform: rotate(18deg); }
          .ahv3__shell .ahv3__hero-art .is-leaf-2 { right: 72px; transform: scaleX(-1) rotate(15deg); }

          .ahv3__shell .ahv3__section-title {
            margin: 0 !important;
            min-height: 25px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #243955;
            font-size: 11.5px !important;
          }

          .ahv3__shell .ahv3__section-title > span {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: #edf4ff;
            color: #2f6fed;
          }

          .ahv3__shell .ahv3__info-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
          }

          .ahv3__shell .ahv3__info-grid article {
            min-height: 57px;
            padding: 8px 10px;
            border: 1px solid #e0e9f5;
            border-radius: 13px;
            background: #fbfdff;
            box-shadow: 0 3px 10px rgba(44, 73, 114, .035);
          }

          .ahv3__shell .ahv3__info-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
          }

          .ahv3__shell .ahv3__info-grid article div > span {
            font-size: 8px;
          }

          .ahv3__shell .ahv3__info-grid article div > b {
            margin-top: 2px;
            font-size: 10.5px;
          }

          .ahv3__shell .ahv3__stat-grid {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
          }

          .ahv3__shell .ahv3__stat-grid article,
          .ahv3__shell .ahv3__rate-card {
            min-height: 70px;
            padding: 9px 10px;
            border: 1px solid transparent;
            border-radius: 14px;
            box-shadow: 0 3px 11px rgba(42, 69, 108, .035);
          }

          .ahv3__shell .ahv3__stat-grid article.is-total {
            border-color: #d6e4ff;
            background: #edf4ff;
          }
          .ahv3__shell .ahv3__stat-grid article.is-present {
            border-color: #d3efdf;
            background: #edf9f2;
          }
          .ahv3__shell .ahv3__stat-grid article.is-late {
            border-color: #f4e1bd;
            background: #fff7e8;
          }
          .ahv3__shell .ahv3__stat-grid article.is-absent {
            border-color: #f3d8dd;
            background: #fff1f3;
          }
          .ahv3__shell .ahv3__rate-card {
            border-color: #d7eee4;
            background: #eef8f3;
          }

          .ahv3__shell .ahv3__summary-icon {
            width: 33px;
            height: 33px;
            border-radius: 10px;
          }

          .ahv3__shell .ahv3__stat-grid article b,
          .ahv3__shell .ahv3__rate-card > b {
            font-size: 18px;
          }

          .ahv3__shell .ahv3__rate-ring {
            width: 39px;
            height: 39px;
          }

          .ahv3__shell .ahv3__audit-actor-panel {
            padding: 9px 11px;
            border: 1px solid #e4ebf5;
            border-radius: 13px;
            background: #fbfcfe;
          }

          .ahv3__shell .ahv3__audit-actor-panel__head {
            margin-bottom: 7px;
          }

          .ahv3__shell .ahv3__audit-actor-panel__grid {
            grid-template-columns: 1fr 1fr;
            gap: 8px;
          }

          .ahv3__shell .ahv3__audit-actor-panel__grid > div {
            min-height: 40px;
            padding: 7px 9px;
            border-radius: 10px;
            background: #f5f8fc;
          }

          .ahv3__shell .ahv3__proof,
          .ahv3__shell .ahv3__absent-section {
            align-self: stretch;
            min-height: 222px;
            margin: 0 !important;
            padding: 10px !important;
            border: 1px solid #e0e8f3 !important;
            border-radius: 15px !important;
            background: #fff !important;
            box-shadow: 0 4px 14px rgba(42, 68, 105, .04);
            overflow: hidden;
          }

          .ahv3__shell .ahv3__proof header,
          .ahv3__shell .ahv3__absent-section > header {
            min-height: 34px;
            margin-bottom: 7px;
          }

          .ahv3__shell .ahv3__proof header strong,
          .ahv3__shell .ahv3__absent-section > header strong {
            font-size: 11.5px;
          }

          .ahv3__shell .ahv3__proof-image {
            display: block;
            overflow: hidden;
            border-radius: 12px;
          }

          .ahv3__shell .ahv3__proof-image img {
            display: block;
            width: 100%;
            height: 165px;
            max-height: 165px;
            object-fit: cover;
            border-radius: 12px;
          }

          .ahv3__shell .ahv3__proof header a {
            min-height: 29px;
            display: inline-flex;
            align-items: center;
            padding: 0 9px;
            border-radius: 8px;
            background: #2f6fed;
            color: #fff;
            font-size: 8.5px;
            font-weight: 800;
            text-decoration: none;
          }

          .ahv3__shell .ahv3__absent-section {
            background: #fffdfd !important;
            border-color: #f0e0e4 !important;
          }

          .ahv3__shell .attendance-absent-list {
            display: block;
            max-height: 165px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-gutter: stable;
            border: 1px solid #edf0f5;
            border-radius: 10px;
            background: #fff;
          }

          .ahv3__shell .attendance-absent-list > div {
            display: grid;
            grid-template-columns: 25px minmax(0, 1fr) 42px;
            gap: 7px;
            align-items: center;
            min-height: 48px;
            padding: 6px 8px;
            border-bottom: 1px solid #eef1f5;
          }

          .ahv3__shell .attendance-absent-list > div:last-child {
            border-bottom: 0;
          }

          .ahv3__shell .attendance-absent-list > div > span {
            color: #8291a6;
            font-size: 8.5px;
            text-align: center;
          }

          .ahv3__shell .attendance-absent-list b {
            font-size: 9.5px;
          }

          .ahv3__shell .attendance-absent-list small {
            margin-top: 2px;
            display: -webkit-box;
            overflow: hidden;
            color: #77879a;
            font-size: 7.7px;
            line-height: 1.3;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }

          .ahv3__shell .attendance-absent-list em {
            color: #6a7e98;
            font-size: 8px;
            font-style: normal;
            text-align: right;
          }

          .ahv3__shell .ahv3__late-section {
            margin: 0 !important;
            padding: 9px 10px !important;
            border-radius: 13px !important;
          }

          .ahv3__shell .attendance-late-list {
            max-height: 110px;
            overflow-y: auto;
            scrollbar-width: thin;
          }

          .ahv3__shell .ahv3__footer-grid {
            grid-template-columns: minmax(0, 1.65fr) minmax(250px, .65fr);
            gap: 10px;
            margin: 0 !important;
          }

          .ahv3__shell .ahv3__note,
          .ahv3__shell .ahv3__lock {
            min-height: 62px;
            padding: 9px 11px !important;
            border: 1px solid #e2e9f3 !important;
            border-radius: 13px !important;
            background: #fbfcfe !important;
          }

          .ahv3__shell .ahv3__note strong,
          .ahv3__shell .ahv3__lock strong {
            font-size: 10px;
          }

          .ahv3__shell .ahv3__note p,
          .ahv3__shell .ahv3__lock div {
            margin-top: 5px;
            font-size: 8.5px;
          }

          @media (max-width: 1180px) {
            .ahv3__shell {
              grid-template-columns: minmax(300px, 325px) minmax(0, 1fr);
              gap: 12px;
            }
            .ahv3__shell .ahv3__detail {
              grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            }
            .ahv3__shell .ahv3__hero-art {
              opacity: .62;
              right: 15px;
            }
            .ahv3__shell .ahv3__hero-copy {
              max-width: 66%;
            }
          }

          @media (max-width: 900px) {
            .ahv3__shell {
              grid-template-columns: 1fr;
              overflow-y: auto;
            }
            .ahv3__shell .ahv3__list {
              min-height: 420px;
              max-height: 52vh;
            }
            .ahv3__shell .ahv3__detail {
              display: grid;
              grid-template-columns: 1fr;
              overflow: visible;
            }
            .ahv3__shell .ahv3__detail > .ahv3__proof,
            .ahv3__shell .ahv3__detail > .ahv3__absent-section,
            .ahv3__shell .ahv3__detail:not(:has(> .ahv3__proof)) > .ahv3__absent-section {
              grid-column: 1 / -1;
            }
            .ahv3__shell .ahv3__proof { order: 8; }
            .ahv3__shell .ahv3__absent-section { order: 9; }
            .ahv3__shell .ahv3__detail > .ahv3__footer-grid { order: 10; }
            .ahv3__shell .ahv3__hero-art::after { display: none; }
            .ahv3__shell .ahv3__hero-copy { max-width: 72%; }
          }

          @media (max-width: 650px) {
            .ahv3__shell .ahv3__detail {
              padding: 8px !important;
            }
            .ahv3__shell .ahv3__hero {
              min-height: 148px;
              padding: 12px;
            }
            .ahv3__shell .ahv3__hero-copy {
              max-width: 100%;
              padding-top: 42px;
            }
            .ahv3__shell .ahv3__actions {
              left: 10px;
              right: 10px;
              top: 9px;
              justify-content: space-between;
            }
            .ahv3__shell .ahv3__hero-art {
              display: none;
            }
            .ahv3__shell .ahv3__info-grid {
              grid-template-columns: 1fr 1fr;
            }
            .ahv3__shell .ahv3__stat-grid {
              grid-template-columns: 1fr 1fr;
            }
            .ahv3__shell .ahv3__rate-card {
              grid-column: 1 / -1;
            }
            .ahv3__shell .ahv3__footer-grid {
              grid-template-columns: 1fr;
            }
          }
          '''
          path.write_text(text + override + '\n')
          PY
      - name: Commit scoped source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/attendance/AttendanceHistoryV2.css
          git diff --cached --quiet && exit 0
          git commit -m "style(attendance): match approved history mockup"
          git push origin HEAD:fix/attendance-history-mockup-final
