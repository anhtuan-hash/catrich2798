name: Apply attendance class edit layout test

on:
  push:
    branches:
      - fix/attendance-class-edit-layout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-class-edit-layout
          fetch-depth: 0
      - name: Add edit layout regression before production fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-attendance-class-edit-sync.mjs')
          text = path.read_text()
          if "AttendanceClassManagementRosterScroll.css" not in text:
              text = text.replace(
                  "const cssUrl = new URL('../src/components/attendance/AttendanceClassEditor.css', import.meta.url);\n",
                  "const cssUrl = new URL('../src/components/attendance/AttendanceClassEditor.css', import.meta.url);\nconst rosterCssUrl = new URL('../src/components/attendance/AttendanceClassManagementRosterScroll.css', import.meta.url);\n",
              )
              text = text.replace(
                  "const css = fs.readFileSync(cssUrl, 'utf8');\n",
                  "const css = fs.readFileSync(cssUrl, 'utf8');\nconst rosterCss = fs.readFileSync(rosterCssUrl, 'utf8');\n",
              )
              anchor = "assert.match(css, /\\.attendance-member-edit-row/,\n  'Member editing row must have dedicated styling');\n"
              addition = anchor + "assert.match(\n  workspace,\n  /className=\\{`attendance-manage-detail-body\\$\\{editingClass \\? ' is-editing-class' : ''\\}`\\}/,\n  'Class edit mode must mark the detail body so the editor can reserve real layout space',\n);\nassert.match(\n  rosterCss,\n  /\\.attendance-manage-detail-body\\.is-editing-class\\s*\\{[^}]*grid-template-rows:\\s*max-content\\s+max-content[^}]*align-content:\\s*start/s,\n  'Class edit mode must stack the editor and roster as natural-height grid rows',\n);\nassert.match(\n  rosterCss,\n  /\\.attendance-manage-detail-body\\.is-editing-class\\s*>\\s*\\.attendance-member-table\\.is-mockup\\s*\\{[^}]*min-height:\\s*auto/s,\n  'Roster must release its 100% minimum height while the class editor is open',\n);\nassert.match(\n  rosterCss,\n  /\\.attendance-manage-detail-body\\s*>\\s*\\.attendance-member-table\\.is-mockup\\s*\\{[^}]*min-height:\\s*100%/s,\n  'Normal class detail mode must retain the full-height roster behavior',\n);\n"
              if anchor not in text:
                  raise SystemExit('Regression insertion anchor not found')
              text = text.replace(anchor, addition)
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-attendance-class-edit-sync.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(attendance): reproduce class edit layout overlap"
          git push origin HEAD:fix/attendance-class-edit-layout
