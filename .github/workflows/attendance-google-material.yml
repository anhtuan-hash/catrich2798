name: Attendance Google Material Redesign
on:
  pull_request:
    paths:
      - 'src/components/attendance/AttendanceClassManagementWorkspace.jsx'
      - 'src/pages/AttendanceWorkspaceRebuilt.css'
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'scripts/test-attendance-google-material.mjs'
      - 'scripts/test-attendance-visual-polish.mjs'
      - 'scripts/test-attendance-rebuilt-ui.mjs'
      - 'tests/e2e/attendance-visual-polish.spec.js'
      - '.github/workflows/attendance-google-material.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-attendance-google-material.mjs
      - run: node scripts/test-attendance-visual-polish.mjs
      - run: node scripts/test-attendance-rebuilt-ui.mjs
      - run: node scripts/test-attendance-manage-two-step-tiles.mjs
      - run: node scripts/test-attendance-standalone-route.mjs
      - run: node scripts/test-attendance-report-export.mjs
      - run: node scripts/test-student-attendance-report.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/attendance-visual-polish.spec.js tests/e2e/attendance-rebuilt-ui.spec.js --project=chromium-desktop --project=webkit-desktop
