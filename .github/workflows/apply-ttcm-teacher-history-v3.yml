name: Apply TTCM Teacher History Integration v3

on:
  push:
    branches:
      - feat/ttcm-teacher-history
    paths:
      - '.github/workflows/apply-ttcm-teacher-history-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ttcm-teacher-history
      - name: Apply integration patch
        run: python3 scripts/apply-ttcm-teacher-history.py
      - name: Commit integration
        run: |
          rm -f .github/workflows/apply-ttcm-teacher-history.yml
          rm -f .github/workflows/apply-ttcm-teacher-history-v2.yml
          rm -f .github/workflows/apply-ttcm-teacher-history-v3.yml
          rm -f scripts/apply-ttcm-teacher-history.py
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat(ttcm): add teacher activity and file history"
          git push origin HEAD:feat/ttcm-teacher-history
