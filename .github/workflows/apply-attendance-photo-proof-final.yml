name: Apply Attendance Photo Proof Final

on:
  push:
    branches:
      - feat/attendance-photo-proof-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-photo-proof-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply latest-main compatible implementation
        run: python3 scripts/apply-attendance-photo-proof-final.py
      - name: Photo proof contract
        run: node scripts/test-attendance-photo-proof.mjs
      - name: Existing attendance contract
        run: node scripts/test-attendance-hub-absence-ui.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/components/attendance/AttendanceMaterial3.css
          git diff --cached --check
          git commit -m "feat: add optional attendance photo evidence"
          git push origin HEAD:feat/attendance-photo-proof-final
