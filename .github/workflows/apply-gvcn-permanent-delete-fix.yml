name: Apply GVCN Permanent Delete Fix

on:
  push:
    branches:
      - fix/gvcn-permanent-student-delete
    paths:
      - 'scripts/apply-gvcn-permanent-delete-fix.mjs'
      - '.github/workflows/apply-gvcn-permanent-delete-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gvcn-permanent-student-delete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-gvcn-permanent-delete-fix.mjs
      - name: Run regression test
        run: node scripts/test-student-permanent-deletion.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check src/studentPermanentDeleteRuntime.js
          node --check src/assignedSchoolClassBootstrap.js
          node --check src/utils/permanentStudentDeletion.js
      - name: Commit patched production files
        run: |
          if git diff --quiet -- src/studentPermanentDeleteRuntime.js src/assignedSchoolClassBootstrap.js; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/studentPermanentDeleteRuntime.js src/assignedSchoolClassBootstrap.js
          git commit -m 'fix: persist GVCN permanent student deletions across sync'
          git push origin HEAD:fix/gvcn-permanent-student-delete
