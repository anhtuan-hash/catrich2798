name: Apply TTCM Schedule Timeline Mockup

on:
  push:
    branches:
      - style/ttcm-schedule-timeline-mockup

permissions:
  contents: write

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'apply(ttcm): render schedule timeline mockup') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: style/ttcm-schedule-timeline-mockup
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved mockup
        run: node scripts/apply-ttcm-schedule-timeline-mockup.mjs
      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/ttcm-schedule-timeline.yml
          git add src/components/GlobalWorkScheduleCenter.jsx \
                  src/components/GlobalWorkScheduleCompatibleCenter.jsx \
                  src/components/GlobalWorkScheduleTimelineV2.css
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "apply(ttcm): render schedule timeline mockup"
          git push origin HEAD:style/ttcm-schedule-timeline-mockup
