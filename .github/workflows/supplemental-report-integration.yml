name: Supplemental report integration

on:
  pull_request:
    paths:
      - 'src/components/attendance/AttendanceMonthlyReport.jsx'
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/utils/attendanceReport.js'
      - 'src/supplementalAttendanceReportingBootstrap.js'
      - 'scripts/apply-attendance-report-supplemental-integration.mjs'
      - 'scripts/test-attendance-report-supplemental-integration.mjs'
      - '.github/workflows/supplemental-report-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout supplemental report head
        uses: actions/checkout@v4
        with:
          ref: fix/unify-supplemental-report-20260911
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply unified supplemental report
        run: node scripts/apply-attendance-report-supplemental-integration.mjs
      - name: Verify unified supplemental attendance report
        run: node scripts/test-attendance-report-supplemental-integration.mjs
      - name: Verify existing report aggregation
        run: node scripts/test-attendance-report-aggregation.mjs
      - name: Verify report export
        run: node scripts/test-attendance-report-export.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit verified report source
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- src/utils/attendanceReport.js src/components/attendance/AttendanceMonthlyReport.jsx src/components/GlobalAttendanceNavigationTab.jsx src/supplementalAttendanceReportingBootstrap.js; then
            echo "No report source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/attendanceReport.js src/components/attendance/AttendanceMonthlyReport.jsx src/components/GlobalAttendanceNavigationTab.jsx src/supplementalAttendanceReportingBootstrap.js
          git commit -m "Unify supplemental classes into attendance report"
          git push origin HEAD:fix/unify-supplemental-report-20260911
