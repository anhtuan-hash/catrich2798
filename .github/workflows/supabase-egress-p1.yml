name: Supabase Egress P1 Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress-p1-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Supabase egress P1 contracts
        run: node scripts/test-supabase-egress-p1.mjs
