name: Assessment Studio (No AI)
on:
  pull_request:
    paths:
      - 'src/pages/AssessmentStudio.*'
      - 'src/features/assessmentStudio/**'
      - 'src/main.jsx'
      - 'src/utils/permissions.js'
      - 'supabase/brian_assessment_studio_mvp.sql'
      - 'tests/assessment-studio.test.mjs'
      - '.github/workflows/assessment-studio-no-ai.yml'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify deterministic assessment engine
        run: node --test tests/assessment-studio.test.mjs
      - name: Verify React/Vite compilation
        run: npx vite build
