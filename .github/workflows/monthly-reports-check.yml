name: Monthly reports check

on:
  pull_request:
    paths:
      - 'src/pages/BrianTeamPortal.*'
      - 'src/pages/MonthlyReportsWorkspace.*'
      - 'src/pages/ToolPage.jsx'
      - 'src/utils/monthlyReports.js'
      - 'src/utils/teacherAssignments.js'
      - 'supabase/brian-monthly-reports.sql'
      - 'supabase/brian-teacher-assignment-sync.sql'
      - 'scripts/test-monthly-reports-contract.mjs'
      - 'scripts/test-teacher-assignment-sync-contract.mjs'
      - '.github/workflows/monthly-reports-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Monthly report contract
        run: node scripts/test-monthly-reports-contract.mjs
      - name: Teacher assignment synchronization contract
        run: node scripts/test-teacher-assignment-sync-contract.mjs
      - name: Production build
        run: npm run build
