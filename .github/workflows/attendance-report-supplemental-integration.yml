name: Attendance Report Supplemental Integration

on:
  push:
    branches:
      - feat/unify-supplemental-attendance-report-20260911
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify supplemental report integration
        run: node scripts/test-attendance-report-supplemental-integration.mjs
