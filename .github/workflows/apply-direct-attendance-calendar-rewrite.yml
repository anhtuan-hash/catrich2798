name: Apply direct attendance calendar rewrite

on:
  push:
    branches:
      - fix/attendance-direct-calendar-rewrite
    paths:
      - scripts/apply-direct-attendance-calendar-rewrite.mjs
      - .github/workflows/apply-direct-attendance-calendar-rewrite.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout rewrite branch
        uses: actions/checkout@v4
        with:
          ref: fix/attendance-direct-calendar-rewrite
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply strict source rewrite
        run: node scripts/apply-direct-attendance-calendar-rewrite.mjs

      - name: Commit rewritten React calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes produced"; exit 1; }
          git commit -m "refactor: rewrite attendance calendar directly in React"
          git push origin HEAD:fix/attendance-direct-calendar-rewrite
