name: BRIAN Home Published Slideshow QA
on:
  pull_request:
    paths:
      - 'src/components/HomePublishedSlideshow*'
      - 'public/assets/slideshow/halloween-*'
      - 'docs/brian-photo-story-halloween-skin-spec.md'
      - 'scripts/test-home-slideshow-halloween.mjs'
      - 'src/components/SlideshowLinkedText*'
      - 'src/utils/linkifyPublicText.js'
      - 'scripts/test-slideshow-external-links.mjs'
      - 'tests/fixtures/photo-motion-test.jsx'
      - 'scripts/test-photo-transition-browser.mjs'
      - 'src/pages/HomeApproved.jsx'
      - 'src/components/mobile/MobileHomeView.jsx'
      - 'src/pages/PhotoSlideshow.jsx'
      - 'scripts/test-home-published-slideshow.mjs'
      - '.github/workflows/home-published-slideshow-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-slideshow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Slideshow hyperlink safety and guest URL regression
        run: node scripts/test-slideshow-external-links.mjs
      - name: Slideshow publication regression
        run: node scripts/test-home-published-slideshow.mjs
      - name: Verify Halloween-only slideshow theme scope and original artwork
        run: node scripts/test-home-slideshow-halloween.mjs
      - name: Build with actual Vercel production release gates
        run: node scripts/build-brian-vercel-release.mjs
