name: Event Popup Admin Motion
on:
  pull_request:
    paths:
      - 'src/features/events/**'
      - 'src/components/admin/EventPopupMotionAdmin*'
      - 'src/components/admin/GlobalMotionAdminPanel.jsx'
      - 'src/utils/globalMotionSystem.js'
      - 'scripts/test-event-popup-motion.mjs'
      - 'tests/e2e/event-popup-motion.spec.js'
      - 'tests/e2e/event-popup-motion-react-preview.spec.js'
      - 'tests/fixtures/eventPopupMotionHarness.jsx'
      - '.github/workflows/event-popup-admin-motion.yml'
  push:
    branches: [main]
    paths:
      - 'src/features/events/**'
      - 'src/components/admin/EventPopupMotionAdmin*'
      - 'src/components/admin/GlobalMotionAdminPanel.jsx'
      - 'src/utils/globalMotionSystem.js'
      - 'scripts/test-event-popup-motion.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Admin motion persistence and event exit contracts
        run: node scripts/test-event-popup-motion.mjs && node scripts/test-event-login-session.mjs && node scripts/test-event-eligibility.mjs
      - name: Build production UI
        run: npx vite build
      - name: Install isolated React preview test bundler
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
      - name: Verify two-way animation in Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit && npx playwright test tests/e2e/event-popup-motion.spec.js tests/e2e/event-popup-motion-react-preview.spec.js --project=chromium-desktop --project=webkit-desktop
      - name: Full site build
        run: node scripts/test-editorial-app-heroes.mjs && npm run build
