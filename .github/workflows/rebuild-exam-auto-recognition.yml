name: Rebuild Exam Studio recognition

on:
  push:
    paths:
      - '.github/workflows/rebuild-exam-auto-recognition.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Exam Studio
        run: python .github/scripts/rebuild_exam_recognition.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit rebuild
        run: |
          rm -f .github/workflows/rebuild-exam-auto-recognition.yml .github/scripts/rebuild_exam_recognition.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SpecializedAppPage.jsx src/utils/specializedAppEngines.js src/utils/examAutoRecognition.js src/styles/ExamAutoRecognition.css .github/workflows/rebuild-exam-auto-recognition.yml .github/scripts/rebuild_exam_recognition.py
          git commit -m "Rebuild Exam Studio with automatic source recognition"
          git push origin HEAD:main
