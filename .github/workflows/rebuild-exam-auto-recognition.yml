name: Rebuild Exam Studio recognition

on:
  push:
    paths:
      - '.github/workflows/rebuild-exam-auto-recognition.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep upload branch and install automatic recognition
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('src/pages/SpecializedAppPage.jsx')
          text = page.read_text(encoding='utf-8')

          parser_import = "import { recognizeExamSourceAutomatically } from '../utils/examAutoRecognition.js';\nimport '../styles/ExamAutoRecognition.css';\n"
          anchor = "import { readDocxTextFromBuffer, readPdfTextFromBuffer } from '../utils/documentParsers.js';\n"
          if parser_import not in text:
              if anchor not in text:
                  raise SystemExit('document parser import anchor not found')
              text = text.replace(anchor, anchor + parser_import, 1)

          text = text.replace(
              "{ icon: '▤', label: 'Nguồn tạo đề', desc: 'Chọn hoặc nhập nội dung' },",
              "{ icon: '▤', label: 'Upload & nhận dạng', desc: 'Tự động đọc và chuẩn hoá nguồn' },",
              1,
          )
          text = text.replace(
              "if (!output) return <p className=\"muted-line\">Chưa có đề. Hãy nhận dạng nội dung hoặc tạo bằng AI ở bước 2.</p>;",
              "if (!output) return <p className=\"muted-line\">Chưa có đề. Hãy upload file hoặc dán nội dung ở bước 2.</p>;",
              1,
          )

          step_source = r'''function StepSource({ project, setProject, onRecognize, onOpenPreview, recognition, language, recognizing = false }) {
            const [fileState, setFileState] = useState('');
            const handleFile = async (event) => {
              const file = event.target.files?.[0];
              if (!file) return;
              setFileState(language === 'vi' ? 'Đang đọc và phân tích file...' : 'Reading and analysing file...');
              try {
                const buffer = await file.arrayBuffer();
                let sourceText = '';
                if (/\.pdf$/i.test(file.name)) sourceText = await readPdfTextFromBuffer(buffer, { maxPages: 40, maxChars: 140000 });
                else if (/\.docx$/i.test(file.name)) sourceText = await readDocxTextFromBuffer(buffer);
                else sourceText = new TextDecoder('utf-8').decode(buffer);
                setProject((prev) => ({ ...prev, sourceText, sourceMode: 'paste', sourceFileName: file.name }));
                setFileState(`${language === 'vi' ? 'Đã nhập và gửi nhận dạng tự động:' : 'Imported for automatic recognition:'} ${file.name}`);
              } catch (error) {
                setFileState(`${language === 'vi' ? 'Không đọc được file:' : 'Cannot read file:'} ${error.message || error}`);
              }
            };
            const stats = recognition?.stats;
            return (
              <section className="panel exam-work-panel exam-v946-panel">
                <span className="eyebrow">Bước 2</span>
                <h2>Upload hoặc dán nội dung đề</h2>
                <div className="exam-auto-source-note">
                  <p className="muted-line">Hệ thống tự nhận dạng sau khi file được đọc hoặc sau khi bạn ngừng nhập trong giây lát.</p>
                  <span className="exam-auto-recognition-badge">Nhận dạng cục bộ · Không dùng AI</span>
                </div>
                <div className="exam-source-grid auto-source-grid">
                  <div>
                    <div className="upload-zone exam-v946-upload">
                      <input type="file" accept=".txt,.md,.pdf,.docx" onChange={handleFile} />
                      <strong>Upload PDF / DOCX / TXT / Markdown</strong>
                      <small>{fileState || 'Hỗ trợ đề có section, bài đọc, câu hỏi, phương án, đáp án và giải thích.'}</small>
                    </div>
                    <Field label="Dán đề thô, bài đọc hoặc danh sách câu hỏi">
                      <textarea rows={16} value={project.sourceText} onChange={(event) => setProject((prev) => ({ ...prev, sourceText: event.target.value, sourceMode: 'paste', sourceFileName: '' }))} placeholder={'Ví dụ:\nPART I. Choose the best answer.\n1. The students _____ the task yesterday.\nA. complete\nB. completed\nC. have completed\nD. completing\nAnswer: B'} />
                    </Field>
                  </div>
                  <div className="panel inner-panel recognition-panel auto-recognition-panel">
                    <span className="eyebrow">Automatic Recognition Engine</span>
                    <h3>Nhận dạng và kiểm tra cấu trúc</h3>
                    <p className="muted-line">Tự tách section, bài đọc, câu hỏi, phương án, đáp án, giải thích và loại câu hỏi; không gọi API.</p>
                    {!project.sourceText.trim() ? <div className="auto-recognition-state">Đang chờ file hoặc nội dung được dán.</div> : recognizing ? <div className="auto-recognition-state">Đang phân tích cấu trúc đề...</div> : recognition?.detectedCount ? <div className="auto-recognition-state is-ready">Đã nhận dạng xong. Có thể kiểm tra cảnh báo hoặc mở Preview để hiệu chỉnh từng câu.</div> : <div className="auto-recognition-state">Chưa nhận dạng được câu rõ ràng. Hãy giữ số câu và ký hiệu phương án trong nguồn.</div>}
                    {stats ? <div className="auto-recognition-metrics">
                      <div className="auto-recognition-metric"><span>Tổng câu</span><strong>{stats.total}</strong></div>
                      <div className="auto-recognition-metric"><span>Trắc nghiệm</span><strong>{stats.mcq}</strong></div>
                      <div className="auto-recognition-metric"><span>Tự luận / điền</span><strong>{stats.open}</strong></div>
                      <div className="auto-recognition-metric"><span>Có đáp án</span><strong>{stats.answered}</strong></div>
                      <div className="auto-recognition-metric"><span>Bài đọc</span><strong>{stats.passages}</strong></div>
                      <div className="auto-recognition-metric"><span>Tin cậy</span><strong>{recognition.confidence}%</strong></div>
                    </div> : null}
                    {recognition?.diagnostics?.length ? <ul className="recognition-list auto-diagnostics">{recognition.diagnostics.map((item) => <li key={item}>{item}</li>)}</ul> : null}
                    {recognition?.warnings?.length ? <ul className="recognition-list auto-warnings">{recognition.warnings.map((item) => <li key={item}>{item}</li>)}</ul> : null}
                    <div className="auto-recognition-actions">
                      <button onClick={onRecognize} disabled={!project.sourceText.trim() || recognizing}>{recognizing ? 'Đang nhận dạng...' : 'Nhận dạng lại'}</button>
                      <button className="primary" onClick={onOpenPreview} disabled={!recognition?.detectedCount}>Mở Preview</button>
                    </div>
                  </div>
                </div>
              </section>
            );
          }

          function OptionEditor'''
          text, count = re.subn(r"function StepSource\([\s\S]*?\n}\n\nfunction OptionEditor", step_source, text, count=1)
          if count != 1:
              raise SystemExit(f'StepSource replacement count: {count}')

          state_anchor = "  const [recognition, setRecognition] = useState(null);\n"
          if "const [recognizing, setRecognizing]" not in text:
              if state_anchor not in text:
                  raise SystemExit('recognition state anchor not found')
              text = text.replace(state_anchor, state_anchor + "  const [recognizing, setRecognizing] = useState(false);\n", 1)

          reset_anchor = "    setRecognition(null);\n"
          if "    setRecognizing(false);\n" not in text:
              text = text.replace(reset_anchor, reset_anchor + "    setRecognizing(false);\n", 1)

          start = text.find("  const handleRecognize = () => {")
          end = text.find("\n  const handleQuestionUpdate", start)
          if start < 0 or end < 0:
              raise SystemExit('handleRecognize block not found')
          recognition_logic = r'''  const runRecognition = (sourceText = project.sourceText, { navigate = false } = {}) => {
            const source = String(sourceText || '').trim();
            if (!source) {
              setRecognition(null);
              setOutput(null);
              setStatus('Waiting for source');
              return null;
            }
            setRecognizing(true);
            try {
              const recognized = recognizeExamSourceAutomatically(source, project);
              const nextProject = {
                ...project,
                sourceText,
                sourceMode: 'paste',
                passages: recognized.passages,
                sections: recognized.sections,
                recognizedQuestions: recognized.questions,
                questionCount: recognized.questions.length || project.questionCount,
                selectedFormats: recognized.inferredFormats.length ? recognized.inferredFormats : project.selectedFormats,
              };
              setRecognition(recognized);
              setProject(nextProject);
              if (recognized.questions.length) {
                rebuildOutput(nextProject, recognized.questions);
                setStatus(`Auto recognized · ${recognized.questions.length} questions`);
                if (navigate) setStep(2);
              } else {
                setOutput(null);
                setStatus('Needs clearer source');
              }
              return recognized;
            } finally {
              setRecognizing(false);
            }
          };

          const handleRecognize = () => runRecognition(project.sourceText, { navigate: true });

          useEffect(() => {
            if (step !== 1) return undefined;
            const source = String(project.sourceText || '').trim();
            if (!source) {
              setRecognition(null);
              setOutput(null);
              setStatus('Waiting for source');
              return undefined;
            }
            const timer = window.setTimeout(() => runRecognition(project.sourceText, { navigate: false }), 650);
            return () => window.clearTimeout(timer);
          }, [project.sourceText, step]);
'''
          text = text[:start] + recognition_logic + text[end:]

          old_next = """  const nextStep = () => {
            if (step === 1 && !output) {
              if (project.sourceMode === 'paste') handleRecognize();
              else handleGenerate();
              return;
            }
            setStep((prev) => Math.min(3, prev + 1));
          };"""
          new_next = """  const nextStep = () => {
            if (step === 1) {
              if (!output) handleRecognize();
              else setStep(2);
              return;
            }
            setStep((prev) => Math.min(3, prev + 1));
          };"""
          if old_next not in text:
              raise SystemExit('nextStep block not found')
          text = text.replace(old_next, new_next, 1)

          old_panel = "<StepSource key=\"source\" project={project} setProject={setProject} onRecognize={handleRecognize} onAnalyze={handleAnalyze} onGenerate={handleGenerate} recognition={recognition} language={language} aiLoading={aiLoading} aiError={aiError} aiNotice={aiNotice} hasApiKey={hasApiKey} />"
          new_panel = "<StepSource key=\"source\" project={project} setProject={setProject} onRecognize={handleRecognize} onOpenPreview={() => output && setStep(2)} recognition={recognition} language={language} recognizing={recognizing} />"
          if old_panel not in text:
              raise SystemExit('StepSource panel call not found')
          text = text.replace(old_panel, new_panel, 1)

          text = text.replace(
              "const sourceModeLabel = project.sourceMode === 'ai-topic' ? (language === 'vi' ? 'AI keyword' : 'AI keyword') : (language === 'vi' ? 'Upload / paste' : 'Upload / paste');",
              "const sourceModeLabel = language === 'vi' ? 'Upload / paste · Tự động nhận dạng' : 'Upload / paste · Automatic recognition';",
              1,
          )

          hero_pattern = re.compile(r'''          <button type="button" className="exam-v96-stat-card exam-v35-action-card" onClick=\{\(\) => setStatus\(hasApiKey \? 'AI ready' : 'Optional AI'\)\}>[\s\S]*?          </button>''')
          hero_replacement = '''          <button type="button" className="exam-v96-stat-card exam-v35-action-card" onClick={() => setStep(1)}>
            <span className="exam-v35-action-icon is-auto">✓</span>
            <span className="exam-v35-action-copy"><strong>{language === 'vi' ? 'Nhận dạng tự động' : 'Automatic recognition'}</strong><small>{language === 'vi' ? 'Cục bộ · Không dùng AI' : 'Local · No AI'}</small></span>
            <em className="exam-v35-ready-pill is-local">Sẵn sàng</em>
            <i className="exam-v35-action-arrow">›</i>
          </button>'''
          text, count = hero_pattern.subn(hero_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'hero recognition card replacement count: {count}')

          text = text.replace(
              "'Tạo đề kiểm tra có cấu trúc, tối ưu cho tạo đề, preview, chỉnh sửa và xuất file.'",
              "'Nhập đề từ PDF, DOCX hoặc văn bản; hệ thống tự nhận dạng, chuẩn hoá, preview, chỉnh sửa và xuất file.'",
              1,
          )
          text = text.replace("<span><i>✓</i>Quy trình rõ ràng</span>", "<span><i>✓</i>Nhận dạng tự động</span>", 1)

          old_footer = """            {step === 1 && project.sourceMode === 'paste' && <button className="primary" onClick={handleRecognize}>Nhận dạng nội dung</button>}
            {step === 1 && project.sourceMode === 'ai-topic' && <button className="primary" onClick={handleAnalyze} disabled={aiLoading}>{aiLoading ? 'AI đang xử lý...' : 'AI tạo brief'}</button>}
            {step === 1 && project.sourceMode === 'ai-topic' && <button className="primary" onClick={handleGenerate} disabled={aiLoading}>{aiLoading ? 'AI đang tạo câu hỏi...' : 'AI tạo câu hỏi'}</button>}"""
          new_footer = """            {step === 1 && <button onClick={handleRecognize} disabled={!project.sourceText.trim() || recognizing}>{recognizing ? 'Đang nhận dạng...' : 'Nhận dạng lại'}</button>}
            {step === 1 && <button className="primary" onClick={() => output && setStep(2)} disabled={!output}>Mở Preview</button>}"""
          if old_footer not in text:
              raise SystemExit('footer AI controls not found')
          text = text.replace(old_footer, new_footer, 1)

          page.write_text(text, encoding='utf-8')

          engine = Path('src/utils/specializedAppEngines.js')
          text = engine.read_text(encoding='utf-8')
          text = re.sub(
              r"export const SOURCE_MODE_OPTIONS = \[[\s\S]*?\n\];",
              "export const SOURCE_MODE_OPTIONS = [\n  { id: 'paste', label: 'Upload / Paste text · Automatic recognition' },\n];",
              text,
              count=1,
          )
          text = text.replace(
              "headline: 'Tạo đề từ file, text hoặc AI. Hỗ trợ trắc nghiệm, tự luận, preview sạch và xuất HTML tương tác.',",
              "headline: 'Tạo đề từ PDF, DOCX hoặc văn bản bằng cơ chế nhận dạng tự động; hỗ trợ preview, chỉnh sửa và xuất HTML tương tác.',",
              1,
          )
          text = text.replace(
              "workflow: ['Chọn loại bài kiểm tra và dạng câu hỏi', 'Upload/dán text hoặc nhập yêu cầu cho AI', 'Preview sạch và chỉnh từng câu', 'Xuất DOC/PDF/Google Form/HTML tương tác'],",
              "workflow: ['Chọn loại bài kiểm tra và dạng câu hỏi', 'Upload/dán nội dung để tự động nhận dạng', 'Preview sạch và chỉnh từng câu', 'Xuất DOC/PDF/Google Form/HTML tương tác'],",
              1,
          )
          engine.write_text(text, encoding='utf-8')

          Path('.github/workflows/rebuild-exam-auto-recognition.yml').unlink()

      - name: Build
        run: npm ci && npm run build

      - name: Commit rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SpecializedAppPage.jsx src/utils/specializedAppEngines.js src/utils/examAutoRecognition.js src/styles/ExamAutoRecognition.css .github/workflows/rebuild-exam-auto-recognition.yml
          git commit -m "Rebuild Exam Studio with automatic source recognition"
          git push origin HEAD:main
