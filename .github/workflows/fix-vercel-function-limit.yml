name: Temporary Vercel Function Limit Fix

on:
  push:
    branches:
      - fix/teacher-dashboard-shared-schedule-20260727

permissions:
  contents: write

jobs:
  consolidate-functions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/teacher-dashboard-shared-schedule-20260727
          fetch-depth: 0

      - name: Consolidate Vercel functions without changing public API URLs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p server/api

          git mv api/_googleDrive.js server/api/_googleDrive.js
          git mv api/_resourceCategoryFolders.js server/api/_resourceCategoryFolders.js
          git mv api/_resourcePreviewToken.js server/api/_resourcePreviewToken.js
          git mv api/_security.js server/api/_security.js
          git mv api/news-article.js server/api/news-article.js
          git mv api/google-drive-callback.js server/api/google-drive-callback.js
          git mv api/google-drive-move.js server/api/google-drive-move.js

          python <<'PY'
          from pathlib import Path
          import json

          api_dir = Path('api')
          replacements = {
              "from './_googleDrive.js'": "from '../server/api/_googleDrive.js'",
              "from './_resourceCategoryFolders.js'": "from '../server/api/_resourceCategoryFolders.js'",
              "from './_resourcePreviewToken.js'": "from '../server/api/_resourcePreviewToken.js'",
              "from './_security.js'": "from '../server/api/_security.js'",
          }
          for path in api_dir.glob('*.js'):
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path('api/news-feed.js')
          text = path.read_text()
          import_line = "import newsArticleHandler from '../server/api/news-article.js';\n"
          if import_line not in text:
              text = import_line + text
          marker = 'export default async function handler(req, res) {'
          dispatch = "export default async function handler(req, res) {\n  if (String(req.query?.scope || '') === 'article') return newsArticleHandler(req, res);"
          if "scope || '') === 'article'" not in text:
              text = text.replace(marker, dispatch, 1)
          path.write_text(text)

          path = Path('api/google-drive-connect.js')
          text = path.read_text()
          import_line = "import googleDriveCallbackHandler from '../server/api/google-drive-callback.js';\n"
          if import_line not in text:
              text = import_line + text
          marker = 'export default async function handler(req, res) {'
          dispatch = "export default async function handler(req, res) {\n  if (String(req.query?.scope || '') === 'callback') return googleDriveCallbackHandler(req, res);"
          if "scope || '') === 'callback'" not in text:
              text = text.replace(marker, dispatch, 1)
          path.write_text(text)

          path = Path('api/google-drive-delete.js')
          text = path.read_text()
          import_line = "import googleDriveMoveHandler from '../server/api/google-drive-move.js';\n"
          if import_line not in text:
              text = import_line + text
          marker = 'export default async function handler(req, res) {'
          dispatch = "export default async function handler(req, res) {\n  if (String(req.query?.scope || '') === 'move') return googleDriveMoveHandler(req, res);"
          if "scope || '') === 'move'" not in text:
              text = text.replace(marker, dispatch, 1)
          path.write_text(text)

          vercel_path = Path('vercel.json')
          config = json.loads(vercel_path.read_text())
          exact = [
              {'source': '/api/external-app-requests', 'destination': '/api/resource-sync?scope=external-app-requests'},
              {'source': '/api/news-article', 'destination': '/api/news-feed?scope=article'},
              {'source': '/api/google-drive-callback', 'destination': '/api/google-drive-connect?scope=callback'},
              {'source': '/api/google-drive-move', 'destination': '/api/google-drive-delete?scope=move'},
          ]
          exact_sources = {item['source'] for item in exact}
          config['rewrites'] = exact + [
              item for item in config.get('rewrites', [])
              if item.get('source') not in exact_sources
          ]
          vercel_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          PY

          function_count="$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          echo "Vercel function count: ${function_count}"
          test "${function_count}" -le 12

          for file in api/*.js server/api/*.js server/externalAppRequestsHandler.js; do
            node --check "${file}"
          done
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"

          rm -f .github/workflows/fix-vercel-function-limit.yml

      - name: Commit consolidated API layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Vercel functions to Hobby 12-function limit"
          git push origin HEAD:fix/teacher-dashboard-shared-schedule-20260727
