name: Attendance Approved Top Navigation
on:
  pull_request:
    paths:
      - 'src/pages/AttendanceWorkspace.css'
      - 'src/pages/AttendanceWorkspaceRebuilt.css'
      - 'src/supplementalAttendanceReportingBootstrap.js'
      - 'scripts/test-attendance-approved-mockup.mjs'
      - 'scripts/test-attendance-standalone-route.mjs'
      - 'scripts/test-attendance-rebuilt-ui.mjs'
      - 'tests/e2e/attendance-standalone-workspace.spec.js'
      - '.github/workflows/attendance-approved-topnav.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-mockup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-attendance-approved-mockup.mjs
      - run: node scripts/test-attendance-standalone-route.mjs
      - run: node scripts/test-attendance-rebuilt-ui.mjs
      - run: node scripts/test-supplemental-learning-reporting-contract.mjs
      - run: node scripts/test-student-attendance-report.mjs
      - run: node scripts/test-attendance-report-export.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/attendance-standalone-workspace.spec.js tests/e2e/attendance-rebuilt-ui.spec.js --project=chromium-desktop --project=webkit-desktop
