name: BRIAN Home Hero Clear Photo Regression
on:
  pull_request:
    paths:
      - 'public/hero/hero-current.json'
      - 'src/components/HomeHeroExperience2026.jsx'
      - 'scripts/test-home-hero-no-glass.mjs'
      - '.github/workflows/home-hero-clear-photo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-hero-clear:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify published photo clarity and admin controls
        run: node scripts/test-home-hero-no-glass.mjs
      - name: Build the actual Vercel production release
        run: node scripts/build-brian-vercel-release.mjs
