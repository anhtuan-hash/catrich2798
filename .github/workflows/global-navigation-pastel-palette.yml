name: Global Navigation Pastel Palette

on:
  pull_request:
    paths:
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/GlobalCompactNavigation.css'
      - 'src/components/GlobalNavigationPastelPalette.css'
      - 'src/components/GlobalEditorialAuthorityRuntime.jsx'
      - 'scripts/test-global-navigation-pastel-palette.mjs'
      - '.github/workflows/global-navigation-pastel-palette.yml'
  push:
    branches:
      - main
    paths:
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/GlobalCompactNavigation.css'
      - 'src/components/GlobalNavigationPastelPalette.css'
      - 'src/components/GlobalEditorialAuthorityRuntime.jsx'
      - 'scripts/test-global-navigation-pastel-palette.mjs'
      - '.github/workflows/global-navigation-pastel-palette.yml'

permissions:
  contents: read

jobs:
  palette-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify navigation pastel palette contract
        run: node scripts/test-global-navigation-pastel-palette.mjs
