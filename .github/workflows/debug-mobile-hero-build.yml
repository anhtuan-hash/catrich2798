name: Debug Mobile Hero Build

on:
  push:
    paths:
      - '.github/workflows/debug-mobile-hero-build.yml'
      - 'src/components/mobile/MobileHomeView.jsx'
      - 'src/components/MobileHeroAdminField.jsx'
      - 'api/homepage-mobile-hero-publish.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
