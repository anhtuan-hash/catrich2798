name: Halloween Awards Vite build check
on:
  push:
    branches: [main]
    paths:
      - 'src/components/PhotoAwards.jsx'
      - 'src/components/PhotoAwards.css'
      - 'src/pages/PhotoSlideshow.jsx'
      - '.github/workflows/halloween-awards-vite-check.yml'
  workflow_dispatch:
jobs:
  vite-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Verify Vite production bundling
        run: npx vite build
