name: Apply Attendance Archive UI

on:
  push:
    branches:
      - 'feature/attendance-archive'
    paths:
      - 'scripts/apply-attendance-archive-ui.mjs'
      - '.github/workflows/attendance-archive-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attendance-archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic UI patch
        run: node scripts/apply-attendance-archive-ui.mjs
      - name: Commit patched attendance UI
        run: |
          if git diff --quiet -- src/components/GlobalAttendanceNavigationTab.jsx; then
            echo "No UI patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx
          git commit -m "feat: integrate attendance archive UI"
          git push origin HEAD:feature/attendance-archive
