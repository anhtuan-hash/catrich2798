name: Gradebook Command Deck V3 Safety
on:
  push:
    branches: [main, 'feat/gradebook-command-deck-v3-20261012']
    paths:
      - 'src/components/gradebook/**'
      - 'src/pages/GradebookStudio.jsx'
      - 'src/utils/gradebookProgressDeck.js'
      - 'src/utils/gradebookMockExams.js'
      - 'scripts/test-gradebook-command-deck-v3.mjs'
      - '.github/workflows/gradebook-command-deck-v3.yml'
  pull_request:
    paths:
      - 'src/components/gradebook/**'
      - 'src/pages/GradebookStudio.jsx'
      - 'src/utils/gradebookProgressDeck.js'
      - 'src/utils/gradebookMockExams.js'
      - 'scripts/test-gradebook-command-deck-v3.mjs'
jobs:
  regression-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-gradebook-command-deck-v3.mjs
      - run: node scripts/test-gradebook-mock-exams.mjs
      - run: node scripts/test-gradebook-mock-exams-v2.mjs
      - run: node --test tests/gradebook-permanent-palette.test.mjs tests/gradebook-workbench-two.test.mjs tests/gradebook-usability-material3.test.mjs
      - run: npm run build
