name: Museum Offline Archive Acceptance
on:
  pull_request:
    paths:
      - 'src/features/immersive-gallery/**'
      - 'scripts/build-museum-offline.mjs'
      - 'tests/museum-offline/**'
      - 'vite.config.js'
      - '.github/workflows/museum-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/museum-offline/offline.test.mjs
      - run: node scripts/build-museum-offline.mjs dist
      - run: node tests/museum-offline/prepare.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/museum-offline/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum-offline-acceptance
          path: |
            artifacts/museum-offline/report
            artifacts/museum-offline/results
          retention-days: 7
