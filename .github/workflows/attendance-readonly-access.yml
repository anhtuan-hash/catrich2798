name: Attendance Read-only Access

on:
  pull_request:
    paths:
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalAttendanceReadOnlyNavigationTab.jsx'
      - 'src/utils/attendanceReadonlyAccess.js'
      - 'supabase/migrations/20260914_attendance_readonly_for_all_authenticated.sql'
      - 'scripts/test-attendance-readonly-access.mjs'
      - '.github/workflows/attendance-readonly-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify read-only Attendance access contract
        run: node scripts/test-attendance-readonly-access.mjs
