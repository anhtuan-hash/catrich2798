name: Gradebook Student Workbench Safety
on:
  pull_request:
    paths:
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/utils/gradebookStudentView.js'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'tests/gradebook-student-workbench.test.mjs'
      - 'tests/e2e/gradebook-student-workbench.spec.js'
      - '.github/workflows/gradebook-student-workbench.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/utils/gradebookStudentView.js'
      - 'src/styles/GradebookAcademicWorkspace.css'
jobs:
  gradebook-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Workbench behavior, score integrity and existing Gradebook checks
        run: |
          node --test tests/gradebook-student-workbench.test.mjs tests/gradebook-studio-edition.test.mjs tests/gradebook-colorful-mockup.test.mjs tests/gradebook-material3-finish.test.mjs tests/gradebook-usability-material3.test.mjs tests/gradebook-academic-workspace.test.mjs tests/gradebook-permanent-palette.test.mjs tests/gradebook-visual-defects.test.mjs tests/gradebook-productivity.test.mjs tests/gradebook-phase2.test.mjs tests/gradebook-phase3.test.mjs
      - name: Build production
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser geometry, accessibility and responsive workbench
        run: npx playwright test tests/e2e/gradebook-student-workbench.spec.js tests/e2e/gradebook-academic-geometry.spec.js tests/e2e/gradebook-permanent-palette.spec.js tests/e2e/gradebook-usability-material3.spec.js --project=chromium-desktop
