name: Critical E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run critical browser smoke
        run: npx playwright test tests/e2e/critical-smoke.spec.js --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-report
          path: reports/playwright
          if-no-files-found: ignore
          retention-days: 7
