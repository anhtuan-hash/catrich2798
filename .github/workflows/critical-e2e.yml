name: Critical E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install critical browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build production bundle
        run: npm run build

      - name: Verify attendance teacher-time access contract
        run: node scripts/test-attendance-time-access-control.mjs

      - name: Verify global attendance operator permission contract
        run: node scripts/test-global-attendance-operator-permission.mjs

      - name: Verify supplemental learning database contract
        run: node scripts/test-supplemental-learning-database-contract.mjs

      - name: Verify supplemental activity adapter contract
        run: node scripts/test-supplemental-learning-activity-contract.mjs

      - name: Verify supplemental Admin UI contract
        run: node scripts/test-supplemental-learning-admin-ui-contract.mjs

      - name: Verify supplemental quick-attendance contract
        run: node scripts/test-supplemental-learning-quick-attendance-contract.mjs

      - name: Verify supplemental history/report contract
        run: node scripts/test-supplemental-learning-reporting-contract.mjs

      - name: Verify supplemental route bootstrap contract
        run: node scripts/test-supplemental-learning-route-bootstrap-contract.mjs

      - name: Run Chromium critical browser smoke
        run: npx playwright test tests/e2e/critical-smoke.spec.js --project=chromium-desktop

      - name: Run WebKit critical browser smoke
        run: npx playwright test tests/e2e/critical-smoke.spec.js --project=webkit-desktop

      - name: Verify supplemental attendance in Chromium
        run: npx playwright test tests/e2e/supplemental-learning-attendance.spec.js --project=chromium-desktop

      - name: Verify supplemental attendance in WebKit
        run: npx playwright test tests/e2e/supplemental-learning-attendance.spec.js --project=webkit-desktop

      - name: Verify Attendance History V3 production cascade in Chromium
        run: npx playwright test tests/e2e/attendance-history-production-layout.spec.js --project=chromium-desktop

      - name: Verify Attendance History V3 production cascade in WebKit
        run: npx playwright test tests/e2e/attendance-history-production-layout.spec.js --project=webkit-desktop

      - name: Verify Giờ GV tab parity in Chromium
        run: npx playwright test tests/e2e/attendance-teacher-time-tab-parity.spec.js --project=chromium-desktop

      - name: Verify Giờ GV tab parity in WebKit
        run: npx playwright test tests/e2e/attendance-teacher-time-tab-parity.spec.js --project=webkit-desktop

      - name: Verify iPhone layout in Chromium
        run: npx playwright test tests/e2e/iphone-dashboard-attendance-layout.spec.js --project=chromium-desktop

      - name: Verify iPhone layout in WebKit
        run: npx playwright test tests/e2e/iphone-dashboard-attendance-layout.spec.js --project=webkit-desktop

      - name: Verify attendance management scroll independence in Chromium
        run: npx playwright test tests/e2e/attendance-manage-independent-scroll.spec.js --project=chromium-desktop

      - name: Verify attendance management scroll independence in WebKit
        run: npx playwright test tests/e2e/attendance-manage-independent-scroll.spec.js --project=webkit-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-report
          path: reports/playwright
          if-no-files-found: ignore
          retention-days: 7