name: Diagnose Attendance Search Production

on:
  push:
    branches:
      - diag/attendance-search-production

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production bundle for attendance search UI
        shell: bash
        run: |
          set -euo pipefail
          base='https://esl-brian.vercel.app'
          curl -fsSIL "$base/" | sed -n '1,40p'
          curl -fsSL "$base/" -o /tmp/index.html
          python - <<'PY'
          import re, sys, urllib.request
          from urllib.parse import urljoin, urlparse

          BASE = 'https://esl-brian.vercel.app/'
          html = open('/tmp/index.html', encoding='utf-8', errors='ignore').read()
          queue = [urljoin(BASE, value) for value in re.findall(r'src="([^"]+\.js)', html)]
          seen = set()
          found_in = []
          needles = ['Tìm nhanh lớp','Phân loại lớp theo bộ môn','Không có lớp phù hợp bộ lọc']

          while queue and len(seen) < 180:
              url = queue.pop(0)
              if url in seen or urlparse(url).netloc != urlparse(BASE).netloc:
                  continue
              seen.add(url)
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      text = response.read().decode('utf-8', errors='ignore')
              except Exception as exc:
                  print('FETCH_FAIL', url, repr(exc))
                  continue
              hits = [needle for needle in needles if needle in text]
              print('ASSET', url, 'bytes', len(text), 'hits', hits)
              if hits:
                  found_in.append((url, hits))
              refs = set()
              refs.update(re.findall(r'["\']([^"\']+\.js)["\']', text))
              refs.update(re.findall(r'assets/[A-Za-z0-9._-]+\.js', text))
              for ref in refs:
                  child = urljoin(url, ref)
                  if child not in seen and urlparse(child).netloc == urlparse(BASE).netloc:
                      queue.append(child)

          print('CRAWLED_JS_COUNT', len(seen))
          print('FOUND_IN', found_in)
          if not any('Tìm nhanh lớp' in hits and 'Phân loại lớp theo bộ môn' in hits for _, hits in found_in):
              print('PRODUCTION_CHUNKS_MISSING_ATTENDANCE_SEARCH')
              sys.exit(3)
          print('PRODUCTION_CHUNKS_HAVE_ATTENDANCE_SEARCH')
          PY
