name: Brian Metro Next Shadow CI

on:
  push:
    branches:
      - ui-v2-shadow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-v2-shadow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Shadow UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Verify Shadow preview entry
        run: |
          test -f preview-ui-v2.html
          test -f src/ui/v2/preview-main.jsx
          test -f src/ui/v2/pages/B2ReleaseGate.jsx
          test -f api/v2-build-meta.js
          echo "Shadow UI source contract present"
