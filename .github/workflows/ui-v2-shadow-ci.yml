name: Brian Metro Next Shadow CI

on:
  push:
    branches:
      - ui-v2-shadow
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ui-v2-shadow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Shadow UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - id: release_engineering
        name: Execute V2 release engineering contracts
        continue-on-error: true
        run: node scripts/verify-v2-release-engineering.mjs

      - id: build
        name: Build production bundle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/brian-v2-build.log

      - id: shadow_entries
        name: Build deployable Shadow preview entries
        if: steps.build.outcome == 'success' && steps.release_engineering.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vite build --config vite.v2-shadow.config.js 2>&1 | tee /tmp/brian-v2-shadow-build.log

      - id: verify
        name: Verify deployable preview, rehearsal, behavior QA, Level 2 and gateway contracts
        if: steps.build.outcome == 'success' && steps.release_engineering.outcome == 'success' && steps.shadow_entries.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          test -f preview-ui-v2.html
          test -f preview-ui-v2-rehearsal.html
          test -f preview-ui-v2-behavior.html
          test -f vite.v2-shadow.config.js
          test -f dist/preview-ui-v2.html
          test -f dist/preview-ui-v2-rehearsal.html
          test -f dist/preview-ui-v2-behavior.html
          test -f src/ui/v2/preview-main.jsx
          test -f src/ui/v2/pages/B2ReleaseGate.jsx
          test -f src/ui/v2/rehearsal-main.jsx
          test -f src/ui/v2/pages/B2ReleaseRehearsal.jsx
          test -f src/ui/v2/behavior-main.jsx
          test -f src/ui/v2/pages/B2BehaviorQA.jsx
          test -f src/ui/v2/toolBehaviorEvidence.js
          test -f src/ui/v2/bootstrapDecision.js
          test -f src/ui/v2/bootstrapRehearsal.js
          test -f src/ui/v2/releaseEvidenceIntegrity.js
          test -f scripts/verify-v2-release-engineering.mjs
          test -f src/ui/v2/toolChromeAdaptersPhase3.js
          ! grep -q 'level: 1' src/ui/v2/toolBridgeRegistry.js
          grep -q "'top-five-arena'" src/ui/v2/toolBehaviorManifest.js
          grep -q "'word2graph'" src/ui/v2/toolBehaviorManifest.js
          grep -q "'vietnam-tax'" src/ui/v2/toolBehaviorManifest.js
          grep -q "'textcare'" src/ui/v2/toolBehaviorManifest.js
          grep -q 'b2ToolAdapterPhase3' src/ui/v2/toolBehaviorContract.js
          grep -q 'b2-v2-tool-chrome-adapter-phase3' src/ui/v2/toolBehaviorContract.js
          grep -q 'toolBehaviorDetail' src/ui/v2/releaseEvidencePack.js
          grep -q 'vite.v2-shadow.config.js' vercel.json
          test -f api/_v2-build-meta.js
          grep -q "v2-build-meta" api/gateway.js
          grep -q '"source": "/api/v2-build-meta"' vercel.json
          test ! -f api/v2-build-meta.js
          echo "Shadow UI build artifact contains preview + rehearsal + behavior QA entries"

      - name: Publish shadow CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.release_engineering.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SHADOW_OUTCOME: ${{ steps.shadow_entries.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          STATE=success
          DESCRIPTION="Production build + deployable Shadow entries + release contracts passed"
          if [ "$RELEASE_OUTCOME" != "success" ]; then
            STATE=failure
            DESCRIPTION="V2 release decision/integrity/behavior contract failed"
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            STATE=failure
            ERROR_LINE=$(grep -E "(error|ERROR|failed|Failed|Cannot|Could not|not found|Unexpected|SyntaxError)" /tmp/brian-v2-build.log 2>/dev/null | tail -n 1 | tr '\n' ' ' | cut -c1-110)
            DESCRIPTION="Production build failed${ERROR_LINE:+: $ERROR_LINE}"
          elif [ "$SHADOW_OUTCOME" != "success" ]; then
            STATE=failure
            ERROR_LINE=$(grep -E "(error|ERROR|failed|Failed|Cannot|Could not|not found|Unexpected|SyntaxError)" /tmp/brian-v2-shadow-build.log 2>/dev/null | tail -n 1 | tr '\n' ' ' | cut -c1-100)
            DESCRIPTION="Shadow entry build failed${ERROR_LINE:+: $ERROR_LINE}"
          elif [ "$VERIFY_OUTCOME" != "success" ]; then
            STATE=failure
            DESCRIPTION="Builds passed; deployable Shadow artifact/source verification failed"
          fi
          export STATE DESCRIPTION
          PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({
            "state": os.environ["STATE"],
            "context": "brian-v2-shadow-ci",
            "description": os.environ["DESCRIPTION"][:140],
            "target_url": os.environ["RUN_URL"],
          }))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$PAYLOAD"

      - name: Fail job when verification failed
        if: steps.release_engineering.outcome != 'success' || steps.build.outcome != 'success' || steps.shadow_entries.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
