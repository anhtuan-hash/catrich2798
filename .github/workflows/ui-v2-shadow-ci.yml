name: Brian Metro Next Shadow CI

on:
  push:
    branches:
      - ui-v2-shadow
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ui-v2-shadow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Shadow UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - id: build
        name: Build production bundle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/brian-v2-build.log

      - id: verify
        name: Verify Shadow preview entry
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          test -f preview-ui-v2.html
          test -f src/ui/v2/preview-main.jsx
          test -f src/ui/v2/pages/B2ReleaseGate.jsx
          test -f api/v2-build-meta.js
          echo "Shadow UI source contract present"

      - name: Publish shadow CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          STATE=success
          DESCRIPTION="Shadow npm build + source contract passed"
          if [ "$BUILD_OUTCOME" != "success" ]; then
            STATE=failure
            ERROR_LINE=$(grep -E "(error|ERROR|failed|Failed|Cannot|Could not|not found|Unexpected|SyntaxError)" /tmp/brian-v2-build.log 2>/dev/null | tail -n 1 | tr '\n' ' ' | cut -c1-110)
            DESCRIPTION="Build failed${ERROR_LINE:+: $ERROR_LINE}"
          elif [ "$VERIFY_OUTCOME" != "success" ]; then
            STATE=failure
            DESCRIPTION="Build passed; Shadow source-contract verification failed"
          fi
          export STATE DESCRIPTION
          PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({
            "state": os.environ["STATE"],
            "context": "brian-v2-shadow-ci",
            "description": os.environ["DESCRIPTION"][:140],
            "target_url": os.environ["RUN_URL"],
          }))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$PAYLOAD"

      - name: Fail job when verification failed
        if: steps.build.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
