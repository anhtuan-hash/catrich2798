name: Gradebook V6 Layout Regression Gate
on:
  push:
    branches: [main, 'feat/gradebook-layout-hardening-v6-20261012']
    paths:
      - 'src/components/gradebook/**'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'src/styles/GradebookSpectrumV4.css'
      - 'src/styles/GradebookRosterLayoutHotfix.css'
      - 'src/styles/GradebookFocusV5.css'
      - 'src/pages/GradebookStudio.jsx'
      - 'tests/gradebook-v6-layout-contract.test.mjs'
      - 'tests/e2e/gradebook-v5-geometry-repair.spec.js'
      - '.github/workflows/gradebook-v6-layout-gate.yml'
  pull_request:
    paths:
      - 'src/components/gradebook/**'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'src/styles/GradebookSpectrumV4.css'
      - 'src/styles/GradebookRosterLayoutHotfix.css'
      - 'src/styles/GradebookFocusV5.css'
      - 'src/pages/GradebookStudio.jsx'
      - 'tests/gradebook-v6-layout-contract.test.mjs'
      - 'tests/e2e/gradebook-v5-geometry-repair.spec.js'
      - '.github/workflows/gradebook-v6-layout-gate.yml'
jobs:
  data-and-css-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/gradebook-v6-layout-contract.test.mjs
      - run: node tests/gradebook-v5-geometry-repair.test.mjs
      - run: node tests/gradebook-focus-v5.test.mjs
      - run: node tests/gradebook-roster-layout-hotfix.test.mjs
      - run: node scripts/test-gradebook-mock-exams-v2.mjs
      - run: npm run build
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/gradebook-v5-geometry-repair.spec.js tests/e2e/gradebook-focus-v5-layout.spec.js tests/e2e/gradebook-roster-toolbar-layout.spec.js --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradebook-v6-failing-layout
          path: |
            test-results/
            reports/playwright/
