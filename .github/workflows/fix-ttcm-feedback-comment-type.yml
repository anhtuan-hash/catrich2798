name: Fix TTCM feedback comment type

on:
  push:
    paths:
      - '.github/workflows/fix-ttcm-feedback-comment-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TTCM response payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/GlobalTtcmNavigationTab.jsx')
          source = path.read_text(encoding='utf-8')

          response_old = """        body: responseText.trim() || 'Đã hoàn thành yêu cầu.',\n        comment_type: `ttcm_${responseType}`,\n        attachments,"""
          response_new = """        body: responseText.trim() || 'Đã hoàn thành yêu cầu.',\n        type: responseType === 'submission' ? 'submission' : 'comment',\n        comment_type: `ttcm_${responseType}`,\n        attachments,"""

          ack_old = """        body: 'Đã xác nhận đã nhận thông tin.',\n        comment_type: 'acknowledgement',\n        attachments: [],"""
          ack_new = """        body: 'Đã xác nhận đã nhận thông tin.',\n        type: 'comment',\n        comment_type: 'acknowledgement',\n        attachments: [],"""

          if response_old not in source:
              raise SystemExit('Teacher response insert marker not found; aborting safely.')
          if ack_old not in source:
              raise SystemExit('Acknowledgement insert marker not found; aborting safely.')

          source = source.replace(response_old, response_new, 1)
          source = source.replace(ack_old, ack_new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "Brian CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/GlobalTtcmNavigationTab.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix TTCM teacher feedback submission type"
          git push origin HEAD:main
