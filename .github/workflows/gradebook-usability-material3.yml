name: Gradebook Usability Material 3 Guard
on:
  pull_request:
    paths:
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookProductivityPanel.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'src/components/gradebook/GradebookProductivityPanel.css'
      - 'tests/gradebook-usability-material3.test.mjs'
      - 'tests/e2e/gradebook-usability-material3.spec.js'
      - '.github/workflows/gradebook-usability-material3.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookProductivityPanel.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'src/components/gradebook/GradebookProductivityPanel.css'
jobs:
  safe-ui-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Feature integrity and layout contracts
        run: |
          node --test tests/gradebook-usability-material3.test.mjs tests/gradebook-material3-colorful.test.mjs tests/gradebook-academic-workspace.test.mjs tests/gradebook-permanent-palette.test.mjs tests/gradebook-visual-defects.test.mjs tests/gradebook-productivity.test.mjs tests/gradebook-phase2.test.mjs tests/gradebook-phase3.test.mjs
      - name: Build production
        run: npm run build
      - name: Browser setup
        run: npx playwright install --with-deps chromium
      - name: Browser table and navigation regression on four widths
        run: npx playwright test tests/e2e/gradebook-usability-material3.spec.js tests/e2e/gradebook-academic-geometry.spec.js tests/e2e/gradebook-permanent-palette.spec.js tests/e2e/gradebook-visual-defects.spec.js --project=chromium-desktop
