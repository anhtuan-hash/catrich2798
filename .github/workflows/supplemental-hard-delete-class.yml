name: Supplemental permanent class deletion

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/attendance/supplementalLearningApi.js'
      - 'src/supplementalLearningBootstrap.js'
      - 'supabase/migrations/20260912_supplemental_hard_delete_class.sql'
      - 'scripts/test-supplemental-hard-delete-class.mjs'
      - '.github/workflows/supplemental-hard-delete-class.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-supplemental-hard-delete-class.mjs
