name: Apply TTCM Reader Polish

on:
  push:
    branches:
      - style/ttcm-reader-polish
    paths:
      - 'scripts/apply-ttcm-reader-polish.mjs'
      - '.github/workflows/apply-ttcm-reader-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: style/ttcm-reader-polish
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply approved polish
        run: node scripts/apply-ttcm-reader-polish.mjs
      - name: Verify TTCM reader contract
        run: node scripts/test-ttcm-reader-two-column-ui.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit polished implementation and remove applicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-ttcm-reader-polish.mjs .github/workflows/apply-ttcm-reader-polish.yml
          git add src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmTeacherReaderV2.css scripts/test-ttcm-reader-two-column-ui.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "style(ttcm): polish reader hierarchy and controls"
          git push origin HEAD:style/ttcm-reader-polish
