name: Install global font and move personnel once

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/install-global-font-and-move-personnel-once.py'
      - '.github/workflows/install-global-font-and-move-personnel-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply global font and TTCM personnel migration
        run: python scripts/install-global-font-and-move-personnel-once.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit verified changes
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add src/main.jsx src/pages/AdminPage.jsx src/pages/WorkDashboard.jsx src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmPersonnel.css src/components/admin/GlobalFontAdminPanel.jsx src/components/admin/GlobalFontAdminPanel.css src/styles/GlobalFontSystem.css src/utils/globalFontSystem.js supabase/brian_global_font_settings.sql
          git diff --cached --quiet && exit 0
          git commit -m "feat(ui): add global font control and move personnel into TTCM"
          git push origin HEAD:main
