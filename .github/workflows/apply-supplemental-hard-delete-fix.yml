name: Apply supplemental hard-delete fix

on:
  push:
    branches: [fix/supplemental-hard-delete-20260912]
    paths:
      - '.github/workflows/apply-supplemental-hard-delete-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplemental-hard-delete-20260912
      - name: Patch API and UI
        shell: python
        run: |
          from pathlib import Path

          api_path = Path('src/attendance/supplementalLearningApi.js')
          api = api_path.read_text()
          needle = "export async function archiveSupplementalClass(client, groupId, reason = '') {\n  return rpc(client, 'bes_archive_supplemental_class', { p_group_id: groupId, p_reason: reason || 'Lớp đã được lưu trữ' });\n}\n"
          replacement = needle + "export async function deleteSupplementalClass(client, groupId) {\n  return rpc(client, 'bes_delete_supplemental_class', { p_group_id: groupId });\n}\n"
          if needle not in api:
              raise SystemExit('API anchor not found')
          api = api.replace(needle, replacement, 1)
          api_path.write_text(api)

          ui_path = Path('src/supplementalLearningBootstrap.js')
          ui = ui_path.read_text()
          replacements = [
              ("  archiveSupplementalClass,\n", "  deleteSupplementalClass,\n"),
              ('data-action="archive-class" data-id="${esc(item.id)}">Xóa lớp</button>', 'data-action="delete-class" data-id="${esc(item.id)}">Xóa lớp</button>'),
              ('<button type="button" data-action="history" data-id="${esc(item.id)}">Xem lịch sử</button></article>', '<button type="button" data-action="history" data-id="${esc(item.id)}">Xem lịch sử</button><button type="button" class="is-danger-quiet" data-action="delete-class" data-id="${esc(item.id)}">Xóa vĩnh viễn</button></article>'),
              ("async function archiveClass(classId) {\n  const item = classes.find((row) => row.id === classId);\n  if (!item || !window.confirm(`Xóa lớp “${item.className || item.groupName}” khỏi danh sách hoạt động? Lịch sử điểm danh sẽ được giữ nguyên.`)) return;\n  await runMutation(async () => { await archiveSupplementalClass(client, classId, 'Lớp đã được lưu trữ'); selectedClassId = ''; }, 'Đã lưu trữ lớp và giữ nguyên toàn bộ lịch sử.', { keepSelection: false });\n}\n", "async function deleteClass(classId) {\n  const item = classes.find((row) => row.id === classId);\n  if (!item || !window.confirm(`Xóa vĩnh viễn lớp “${item.className || item.groupName}”? Toàn bộ lịch học, dữ liệu điểm danh và lịch sử của lớp sẽ bị xóa hoàn toàn. Không thể hoàn tác.`)) return;\n  await runMutation(async () => { await deleteSupplementalClass(client, classId); selectedClassId = ''; }, 'Đã xóa vĩnh viễn lớp Học bổ sung.', { keepSelection: false });\n}\n"),
              ('host.querySelectorAll(\'[data-action="archive-class"]\').forEach((button) => button.addEventListener(\'click\', () => void archiveClass(button.dataset.id)));', 'host.querySelectorAll(\'[data-action="delete-class"]\').forEach((button) => button.addEventListener(\'click\', () => void deleteClass(button.dataset.id)));'),
          ]
          for old, new in replacements:
              if old not in ui:
                  raise SystemExit(f'UI anchor not found: {old[:100]}')
              ui = ui.replace(old, new, 1)
          ui_path.write_text(ui)
      - name: Commit implementation
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add src/attendance/supplementalLearningApi.js src/supplementalLearningBootstrap.js
          git commit -m "fix: hard delete supplemental classes"
          git push origin HEAD:fix/supplemental-hard-delete-20260912
