name: Login Reference Scrapbook
on:
  pull_request:
    paths:
      - 'src/features/login-scrapbook/**'
      - 'public/assets/login-scrapbook/**'
      - 'src/pages/AuthPage*'
      - 'src/components/UsernameLoginBridge*'
      - 'src/utils/usernameAccounts.js'
      - 'src/utils/auth.js'
      - 'src/main.jsx'
      - 'src/components/Footer.jsx'
      - 'src/pages/Settings.jsx'
      - 'supabase/migrations/*login_scrapbook*'
      - 'scripts/test-login-scrapbook-browser.mjs'
      - '.github/workflows/login-scrapbook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production release gates
        run: node scripts/build-brian-vercel-release.mjs
      - run: npx playwright install --with-deps chromium
      - name: Real entry point, mocked authentication and reference screenshots
        run: node scripts/test-login-scrapbook-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-scrapbook-screens
          path: test-results/login-scrapbook/
