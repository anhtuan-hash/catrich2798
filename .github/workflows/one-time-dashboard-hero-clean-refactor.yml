name: One-time dashboard hero clean refactor

on:
  push:
    paths:
      - '.github/workflows/one-time-dashboard-hero-clean-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refactor Dashboard hero into isolated namespace
        shell: python
        run: |
          from pathlib import Path

          jsx_path = Path('src/pages/WorkDashboard.jsx')
          jsx = jsx_path.read_text(encoding='utf-8')

          start = jsx.find('        <header className="gd-hero">')
          if start < 0:
            raise SystemExit('Current hero start not found')
          end = jsx.find('        </header>', start)
          if end < 0:
            raise SystemExit('Current hero end not found')
          end += len('        </header>')

          hero = '''        <header className="dash-hero">
          <div className="dash-hero-left">
            <div className="dash-hero-copy">
              <span className="dash-hero-kicker">{t.eyebrow}</span>
              <h1>
                <span className="dash-hello">{t.hello},</span>
                <span className="dash-name-row"><strong className="dash-name">{name}</strong><span className="dash-wave" aria-hidden="true">👋</span></span>
              </h1>
              <p>{t.lead}</p>
            </div>

            <div className="dash-main-actions">
              <button type="button" className="dash-btn dash-btn-primary" onClick={scrollToCalendar}><Icon name="calendar" size={20} />{t.calendar}<Icon name="arrow" size={18} /></button>
              <button type="button" className="dash-btn dash-btn-secondary" onClick={() => refresh()} disabled={loading}><Icon name="refresh" size={20} />{loading ? t.refreshing : t.refresh}</button>
            </div>

            <div className="dash-sub-actions">
              <button type="button" className="dash-link" onClick={focusNearestEvent}><Icon name="event" size={18} />{t.nearest}<Icon name="arrow" size={16} /></button>
              <button type="button" className="dash-link" onClick={() => openTtcm('schedule')}><Icon name="calendar" size={18} />{t.openCalendar}<Icon name="arrow" size={16} /></button>
            </div>
          </div>

          <div className="dash-hero-right">
            <div className="dash-utility-bar" aria-label={language === 'vi' ? 'Tiện ích nhanh' : 'Quick utilities'}>
              <button type="button" className="dash-utility" onClick={() => setNow(new Date())} title={t.currentTime}>
                <span className="dash-utility-icon"><Icon name="clock" size={18} /></span><span className="dash-utility-copy"><strong>{heroTime}</strong><small>{t.currentTime}</small></span>
              </button>
              <button type="button" className="dash-utility dash-utility-weather" onClick={refreshWeather} title={t.weather}>
                <span className="dash-utility-icon" aria-hidden="true">☀️</span><span className="dash-utility-copy"><strong>TP.HCM · {weatherTemperature}</strong><small>{weather.loading ? t.weatherLoading : weatherDescription}</small></span>
              </button>
              <button type="button" className="dash-utility" onClick={focusToday} title={t.dateToday}>
                <span className="dash-utility-icon"><Icon name="calendar" size={18} /></span><span className="dash-utility-copy"><strong>{heroDate}</strong><small>{t.dateToday}</small></span>
              </button>
            </div>
            <div className="dash-hero-visual"><DashboardHeroIllustration /></div>
          </div>
        </header>'''

          jsx = jsx[:start] + hero + jsx[end:]
          jsx = jsx.replace('className="gd-hero-illustration"', 'className="dash-hero-art"')
          jsx_path.write_text(jsx, encoding='utf-8')

          css_path = Path('src/styles/teacher-dashboard-hero-interactive-2026.css')
          css = r'''/* Dashboard hero — isolated namespace, Aug 2026.
   Only dash-* selectors are used here so legacy gd-hero rules cannot affect this composition. */

.app-shell[data-route="dashboard"] .gd-top-grid {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
}

.app-shell[data-route="dashboard"] .dash-hero,
.app-shell[data-route="dashboard"] .dash-hero * {
  box-sizing: border-box;
}

.app-shell[data-route="dashboard"] .dash-hero {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-width: 0;
  min-height: 408px;
  margin: 0 0 24px;
  padding: 32px 34px 28px;
  display: grid;
  grid-template-columns: minmax(0, 48%) minmax(0, 52%);
  align-items: stretch;
  gap: clamp(28px, 3vw, 48px);
  overflow: hidden;
  border: 1px solid #c8d8ec;
  border-radius: 30px;
  background:
    radial-gradient(circle at 92% 12%, rgba(255,255,255,.98) 0 12%, transparent 34%),
    radial-gradient(circle at 84% 90%, rgba(180,216,255,.18) 0 13%, transparent 37%),
    linear-gradient(120deg, #fff 0%, #fcfdff 43%, #f6f9ff 69%, #eaf3ff 100%);
  box-shadow: 0 2px 4px rgba(36,62,92,.035), 0 18px 48px rgba(45,75,112,.075);
}

.app-shell[data-route="dashboard"] .dash-hero::before {
  content: '';
  position: absolute;
  z-index: -1;
  width: 430px;
  height: 250px;
  right: -80px;
  bottom: -160px;
  border-radius: 50%;
  background: rgba(56,132,233,.055);
  pointer-events: none;
}

.app-shell[data-route="dashboard"] .dash-hero-left {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 2px 0 0 2px;
}

.app-shell[data-route="dashboard"] .dash-hero-copy {
  width: 100%;
  max-width: 650px;
}

.app-shell[data-route="dashboard"] .dash-hero-kicker {
  display: inline-flex;
  align-items: center;
  min-height: 29px;
  margin: 0 0 13px;
  padding: 0 12px;
  border: 1px solid #b8d2f7;
  border-radius: 999px;
  background: linear-gradient(180deg, #f7faff, #e8f2ff);
  color: #1559b7;
  font: 800 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: .025em;
}

.app-shell[data-route="dashboard"] .dash-hero-copy h1 {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0;
  line-height: 1;
}

.app-shell[data-route="dashboard"] .dash-hello {
  display: block;
  width: fit-content;
  margin: 0 0 3px;
  color: #18283b;
  font-family: Baskerville, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(42px, 3.25vw, 54px);
  font-style: normal;
  font-weight: 500;
  line-height: .98;
  letter-spacing: -.047em;
  white-space: nowrap;
}

.app-shell[data-route="dashboard"] .dash-name-row {
  display: flex;
  align-items: flex-end;
  gap: 11px;
  width: 100%;
  min-width: 0;
}

.app-shell[data-route="dashboard"] .dash-name {
  position: relative;
  display: inline-block;
  max-width: calc(100% - 48px);
  color: #1261d4;
  font-family: Baskerville, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(60px, 4.55vw, 74px);
  font-style: italic;
  font-weight: 500;
  line-height: .93;
  letter-spacing: -.052em;
  white-space: nowrap;
  text-shadow: 0 8px 22px rgba(28,101,207,.06);
}

.app-shell[data-route="dashboard"] .dash-name::after {
  content: '';
  position: absolute;
  z-index: -1;
  left: 10%;
  right: 1%;
  bottom: -7px;
  height: 9px;
  border-top: 2px solid rgba(25,105,225,.46);
  border-radius: 50%;
  transform: rotate(-1deg);
}

.app-shell[data-route="dashboard"] .dash-wave {
  flex: 0 0 auto;
  margin: 0 0 7px;
  font: 400 30px/1 system-ui, sans-serif;
}

.app-shell[data-route="dashboard"] .dash-hero-copy > p {
  max-width: 560px;
  margin: 20px 0 0;
  color: #425873;
  font-size: 15px;
  font-weight: 610;
  line-height: 1.5;
}

.app-shell[data-route="dashboard"] .dash-main-actions,
.app-shell[data-route="dashboard"] .dash-sub-actions {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: wrap;
}

.app-shell[data-route="dashboard"] .dash-main-actions {
  gap: 11px;
  margin-top: 23px;
}

.app-shell[data-route="dashboard"] .dash-sub-actions {
  gap: 9px;
  margin-top: 10px;
}

.app-shell[data-route="dashboard"] .dash-btn,
.app-shell[data-route="dashboard"] .dash-link,
.app-shell[data-route="dashboard"] .dash-utility {
  font-family: "Google Sans", "Google Sans Text", Roboto, Arial, sans-serif;
  cursor: pointer;
}

.app-shell[data-route="dashboard"] .dash-btn {
  min-height: 50px;
  padding: 0 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -.01em;
}

.app-shell[data-route="dashboard"] .dash-btn-primary {
  min-width: 246px;
  border: 1px solid #0f66df;
  background: linear-gradient(135deg, #0d63dd, #3488f4);
  color: #fff;
  box-shadow: 0 10px 24px rgba(16,103,224,.20);
}

.app-shell[data-route="dashboard"] .dash-btn-secondary {
  min-width: 132px;
  border: 1px solid #cfdeec;
  background: rgba(255,255,255,.96);
  color: #244866;
  box-shadow: 0 5px 15px rgba(45,74,109,.055);
}

.app-shell[data-route="dashboard"] .dash-link {
  min-height: 41px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid #d1dfed;
  border-radius: 13px;
  background: rgba(255,255,255,.9);
  color: #174f91;
  font-size: 12px;
  font-weight: 800;
}

.app-shell[data-route="dashboard"] .dash-btn-secondary:hover,
.app-shell[data-route="dashboard"] .dash-link:hover,
.app-shell[data-route="dashboard"] .dash-utility:hover {
  border-color: #9ebfe8;
  background: #f5f9ff;
}

.app-shell[data-route="dashboard"] .dash-hero-right {
  min-width: 0;
  display: grid;
  grid-template-rows: auto minmax(0,1fr);
  gap: 14px;
}

.app-shell[data-route="dashboard"] .dash-utility-bar {
  display: grid;
  grid-template-columns: .88fr 1.08fr 1.28fr;
  gap: 9px;
  width: 100%;
  min-width: 0;
}

.app-shell[data-route="dashboard"] .dash-utility {
  min-width: 0;
  min-height: 64px;
  padding: 9px 11px;
  display: grid;
  grid-template-columns: 36px minmax(0,1fr);
  align-items: center;
  gap: 9px;
  border: 1px solid #c7d8eb;
  border-radius: 17px;
  background: rgba(255,255,255,.95);
  color: #163f73;
  box-shadow: 0 7px 18px rgba(41,78,125,.065);
}

.app-shell[data-route="dashboard"] .dash-utility-icon {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, #eef6ff, #dcecff);
  color: #1768d5;
}

.app-shell[data-route="dashboard"] .dash-utility-weather .dash-utility-icon {
  background: linear-gradient(145deg, #fff9e9, #ffefb9);
  color: #d49300;
  font-size: 19px;
}

.app-shell[data-route="dashboard"] .dash-utility-copy {
  min-width: 0;
  display: grid;
  gap: 2px;
}

.app-shell[data-route="dashboard"] .dash-utility-copy strong {
  color: #154986;
  font-size: 12.5px;
  font-weight: 800;
  line-height: 1.15;
  white-space: normal;
}

.app-shell[data-route="dashboard"] .dash-utility-copy small {
  color: #74859b;
  font-size: 10px;
  font-weight: 650;
  line-height: 1.15;
}

.app-shell[data-route="dashboard"] .dash-hero-visual {
  min-height: 260px;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  overflow: hidden;
}

.app-shell[data-route="dashboard"] .dash-hero-art {
  display: block;
  width: min(100%, 540px);
  max-width: 540px;
  height: auto;
  max-height: 290px;
  margin: 0 0 -4px auto;
  filter: drop-shadow(0 18px 23px rgba(34,73,119,.12));
}

@media (max-width: 1200px) {
  .app-shell[data-route="dashboard"] .dash-hero {
    grid-template-columns: minmax(0, 50%) minmax(0, 50%);
    gap: 26px;
    padding: 28px;
  }
  .app-shell[data-route="dashboard"] .dash-name { font-size: clamp(54px, 4.4vw, 68px); }
  .app-shell[data-route="dashboard"] .dash-utility-bar { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .app-shell[data-route="dashboard"] .dash-utility { padding-inline: 9px; }
}

@media (max-width: 980px) {
  .app-shell[data-route="dashboard"] .dash-hero {
    min-height: 0;
    grid-template-columns: 1fr;
    padding: 26px 24px 22px;
  }
  .app-shell[data-route="dashboard"] .dash-hero-left { justify-content: flex-start; }
  .app-shell[data-route="dashboard"] .dash-hero-right { margin-top: 8px; }
  .app-shell[data-route="dashboard"] .dash-hero-visual { min-height: 245px; justify-content: center; }
  .app-shell[data-route="dashboard"] .dash-hero-art { width: min(600px,100%); max-width: 600px; margin-inline: auto; }
}

@media (max-width: 640px) {
  .app-shell[data-route="dashboard"] .dash-hero { padding: 22px 18px 20px; border-radius: 24px; }
  .app-shell[data-route="dashboard"] .dash-hello { font-size: 36px; }
  .app-shell[data-route="dashboard"] .dash-name { max-width: calc(100% - 38px); font-size: clamp(48px, 13vw, 61px); white-space: normal; }
  .app-shell[data-route="dashboard"] .dash-wave { margin-bottom: 5px; font-size: 25px; }
  .app-shell[data-route="dashboard"] .dash-main-actions { width: 100%; display: grid; grid-template-columns: 1fr; }
  .app-shell[data-route="dashboard"] .dash-btn { width: 100%; }
  .app-shell[data-route="dashboard"] .dash-sub-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .app-shell[data-route="dashboard"] .dash-link { min-width: 0; padding-inline: 9px; }
  .app-shell[data-route="dashboard"] .dash-utility-bar { grid-template-columns: 1fr; }
  .app-shell[data-route="dashboard"] .dash-utility { min-height: 58px; }
  .app-shell[data-route="dashboard"] .dash-hero-visual { min-height: 210px; }
  .app-shell[data-route="dashboard"] .dash-hero-art { max-height: 235px; }
}
'''
          css_path.write_text(css, encoding='utf-8')

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time workflow and commit source
        shell: bash
        run: |
          rm -f .github/workflows/one-time-dashboard-hero-clean-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WorkDashboard.jsx src/styles/teacher-dashboard-hero-interactive-2026.css .github/workflows/one-time-dashboard-hero-clean-refactor.yml
          git commit -m 'refactor: isolate and stabilize dashboard hero composition'
          git push origin main
