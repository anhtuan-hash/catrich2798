name: One-time dashboard hero clean refactor

on:
  push:
    paths:
      - '.github/workflows/one-time-dashboard-hero-clean-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply isolated hero refactor
        run: python scripts/one_time_dashboard_hero_refactor.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source and remove one-time files
        run: |
          rm -f scripts/one_time_dashboard_hero_refactor.py
          rm -f .github/workflows/one-time-dashboard-hero-clean-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WorkDashboard.jsx src/styles/teacher-dashboard-hero-interactive-2026.css scripts/one_time_dashboard_hero_refactor.py .github/workflows/one-time-dashboard-hero-clean-refactor.yml
          git commit -m 'refactor: isolate and stabilize dashboard hero composition'
          git push origin main
