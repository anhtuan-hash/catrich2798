name: Brian Board — PPTX Import and Editor UAT
on:
  pull_request:
    paths:
      - 'src/components/BrianBoard/**'
      - 'scripts/test-brian-board-pptx.mjs'
      - 'tests/fixtures/brian-board-pptx-qa.*'
      - 'tests/e2e/brian-board-pptx.spec.js'
      - 'playwright.brian-board-pptx.config.js'
      - '.github/workflows/brian-board-pptx-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power-point-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies already locked
        run: npm ci --no-audit --no-fund
      - name: Board PPTX and existing foundation contracts
        run: |
          node scripts/test-brian-board-foundation.mjs
          node scripts/test-brian-board-pptx.mjs
      - name: Build actual web assets
        run: npx vite build
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify PPTX import/edit/present UI
        run: npx playwright test --config=playwright.brian-board-pptx.config.js
