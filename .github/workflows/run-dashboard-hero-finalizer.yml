name: Run dashboard hero finalizer

on:
  push:
    paths:
      - '.github/workflows/run-dashboard-hero-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply structural hero refactor
        run: python3 scripts/finalize_dashboard_hero.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WorkDashboard.jsx src/styles/teacher-dashboard-hero-interactive-2026.css
          git commit -m 'refactor: finalize dashboard hero structure and layout'
          git push origin main
