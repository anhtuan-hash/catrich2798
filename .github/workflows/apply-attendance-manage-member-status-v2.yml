name: Apply attendance manage member status v2

on:
  push:
    branches:
      - feat/attendance-manage-member-status

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci reapply manage member edit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-manage-member-status
      - name: Apply source changes
        run: python scripts/apply-attendance-member-manage-edit.py
      - name: Verify feature contract
        run: node scripts/test-attendance-member-manage-edit.mjs
      - name: Commit implementation
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add src/components/GlobalAttendanceNavigationTab.jsx \
                  src/components/attendance/AttendanceClassEditor.jsx \
                  src/components/attendance/AttendanceClassEditor.css \
                  supabase/migrations/20260909072000_attendance_manage_member_status.sql
          git commit -m "feat: let Manage-tab users edit student status"
          git push origin HEAD:feat/attendance-manage-member-status
