name: Brian Design-to-Code Visual QA
on:
  pull_request:
    paths:
      - 'src/pages/Settings.jsx'
      - 'src/components/settings/SettingsLauncherHome.jsx'
      - 'src/features/design-to-code/**'
      - 'public/assets/design-to-code/**'
      - 'tools/design-to-code/**'
      - '.github/workflows/brian-design-to-code-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate Paper visual lab and interactions
        run: npx playwright test -c tools/design-to-code/playwright.config.mjs
      - name: Compile production React app
        run: npx vite build
      - name: Upload layout screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brian-design-to-code-visual-qa
          path: |
            artifacts/design-to-code/
          retention-days: 14
          if-no-files-found: warn
