name: Fix History Attendance Rate

on:
  push:
    branches:
      - feat/attendance-history-detail-redesign

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/attendance-history-detail-redesign
          fetch-depth: 0

      - name: Add attendance-rate calculation and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/GlobalAttendanceNavigationTab.jsx')
          text = path.read_text()
          marker = "  const selectedAbsentRecords = records.filter((record) => record.status === 'absent');\n"
          addition = """  const selectedAbsentRecords = records.filter((record) => record.status === 'absent');
          const selectedSessionAttendanceRate = selectedSession?.session_status === 'completed' && Number(selectedSession.total_students) > 0
            ? Math.round((Number(selectedSession.present_count || 0) / Number(selectedSession.total_students)) * 100)
            : 0;
          """
          if 'const selectedSessionAttendanceRate =' not in text:
              if marker not in text:
                  raise SystemExit('Attendance-rate insertion marker not found')
              text = text.replace(marker, addition, 1)
              path.write_text(text)
          PY

          rm -f .github/workflows/fix-history-rate.yml

          node scripts/test-attendance-material3-ui.mjs
          node scripts/test-attendance-granular-permissions.mjs
          npm ci --ignore-scripts
          npm run build

          git add src/components/GlobalAttendanceNavigationTab.jsx .github/workflows/fix-history-rate.yml
          git commit -m "fix: calculate attendance rate in history detail"
          git push origin HEAD:feat/attendance-history-detail-redesign
