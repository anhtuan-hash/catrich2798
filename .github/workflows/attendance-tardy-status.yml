name: Attendance Tardy Status

on:
  push:
    branches:
      - feat/attendance-tardy-status
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tardy attendance contract
        run: node scripts/test-attendance-tardy-status.mjs

      - name: Build production bundle
        run: npm run build
