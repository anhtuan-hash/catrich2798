name: QuestAtlas Foundation Quality Gate
on:
  pull_request:
    paths:
      - 'src/features/questatlas/**'
      - 'src/pages/ToolPage.jsx'
      - 'src/data/apps.js'
      - 'scripts/test-questatlas-foundation.mjs'
      - 'scripts/audit-questatlas-isolation.mjs'
      - 'supabase/migrations/*questatlas*.sql'
      - '.github/workflows/questatlas-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate deterministic QuestAtlas engine
        run: node scripts/test-questatlas-foundation.mjs
      - name: Audit isolation and registry
        run: node scripts/audit-questatlas-isolation.mjs
      - name: Production build
        run: npm run build
