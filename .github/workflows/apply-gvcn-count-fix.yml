name: Apply GVCN Count Fix

on:
  push:
    branches:
      - fix/gvcn-permanent-student-delete
    paths:
      - 'scripts/apply-gvcn-count-fix.mjs'
      - '.github/workflows/apply-gvcn-count-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gvcn-permanent-student-delete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-gvcn-count-fix.mjs
      - run: node scripts/test-student-permanent-deletion.mjs
      - run: node --check src/assignedSchoolClassBootstrap.js
      - name: Commit production fix
        run: |
          if git diff --quiet -- src/assignedSchoolClassBootstrap.js; then
            echo 'No production changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assignedSchoolClassBootstrap.js
          git commit -m 'fix: preserve homeroom count when assigned roster is empty'
          git push origin HEAD:fix/gvcn-permanent-student-delete
