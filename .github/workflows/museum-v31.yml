name: Museum Lab V3.1 Teaching & Artwork Acceptance
on:
  pull_request:
    paths:
      - 'src/features/immersive-gallery/**'
      - 'serverless-handlers/museum-*.js'
      - 'serverless-handlers/_museumPng.js'
      - 'serverless-handlers/gallery-guest.js'
      - 'serverless-handlers/gallery-staff.js'
      - 'serverless-handlers/_galleryCreator.js'
      - 'supabase/migrations/*museum_admin*'
      - 'scripts/test-museum-admin-workflow-v38.mjs'
      - 'scripts/museum-admin-postgres-qa.sh'
      - 'api/gateway.js'
      - 'vercel.json'
      - 'supabase/migrations/*museum_live*'
      - 'scripts/test-museum-live-v31.mjs'
      - 'scripts/test-museum-live-paper-v41.mjs'
      - 'scripts/test-museum-competition-v42.mjs'
      - 'scripts/test-museum-live-fullscreen-v43.mjs'
      - 'serverless-handlers/_museumLiveMedia.js'
      - 'serverless-handlers/_museumLivePeer.js'
      - 'scripts/test-museum-live-peer-v51.mjs'
      - 'supabase/migrations/*museum_live_peer*'
      - 'supabase/migrations/*museum_live_competition*'
      - 'scripts/museum-v31-postgres-qa.sh'
      - 'scripts/test-pek-museum-v33.mjs'
      - 'scripts/test-museum-artwork-360-v34.mjs'
      - 'scripts/test-museum-prepared-portfolio-v35.mjs'
      - 'supabase/migrations/*museum_approved_artwork*'
      - 'supabase/migrations/*museum_learning_evidence*'
      - 'serverless-handlers/_museumEvidence.js'
      - 'scripts/*museum*evidence*'
      - '.github/workflows/museum-v31.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Image sanitizer, survey integrity and live authorization policy
        run: node --test scripts/test-museum-live-v31.mjs
      - name: All 11 paper collage stage visuals and functionality
        run: node --test scripts/test-museum-live-paper-v41.mjs
      - name: Contest Live v4.2 voiceover, source library, safe video and group challenge contracts
        run: node --test scripts/test-museum-competition-v42.mjs
      - name: YouTube search API, fallback, error and UI regression
        run: node --test scripts/test-museum-youtube-search-fix.mjs
      - name: Fullscreen teaching dock and en-US voice strictness
        run: node --test scripts/test-museum-live-fullscreen-v43.mjs
      - name: Stage-scoped assigned videos and opt-in student narration
        run: node --test scripts/test-museum-stage-media-v50.mjs
      - name: Official climate videos and private live group feedback
        run: node --test scripts/test-museum-live-peer-v51.mjs
      - name: School-inspired 3D hall, authentic identity and backwards compatibility
        run: node --test scripts/test-pek-museum-v33.mjs
      - name: Artwork 360 orbit, original media and accessibility contract
        run: node --test scripts/test-museum-artwork-360-v34.mjs
      - name: Classroom portfolios, content integrity, no fabricated submission records
        run: node --test scripts/test-museum-prepared-portfolio-v35.mjs
      - name: Learning evidence invariants
        run: node --test scripts/test-museum-learning-evidence.mjs
      - name: Admin direct review and safe archive contracts
        run: node --test scripts/test-museum-admin-workflow-v38.mjs
      - name: Node backend syntax
        run: |
          node --check serverless-handlers/museum-live.js
          node --check serverless-handlers/_museumLiveMedia.js
          node --check serverless-handlers/_museumLivePeer.js
          node --check serverless-handlers/_youtube-search.js
          node --check serverless-handlers/museum-artwork.js
          node --check serverless-handlers/_museumPng.js
          node --check serverless-handlers/gallery-guest.js
          node --check serverless-handlers/gallery-staff.js
          node --check serverless-handlers/_galleryCreator.js
      - name: Site-wide localization audit
        run: node scripts/audit-site-language.mjs
      - name: Compile complete Brian Vite frontend
        run: npx vite build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: V3 baseline desktop/mobile regression
        run: npx playwright test --config tests/museum-lab/playwright.config.mjs

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run private upload schema and TTCM-approved image publication
        run: bash scripts/museum-admin-postgres-qa.sh
