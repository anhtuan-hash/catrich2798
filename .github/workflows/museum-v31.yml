name: Museum Lab V3.1 Teaching & Artwork Acceptance
on:
  pull_request:
    paths:
      - 'src/features/immersive-gallery/**'
      - 'serverless-handlers/museum-*.js'
      - 'serverless-handlers/_museumPng.js'
      - 'serverless-handlers/gallery-guest.js'
      - 'api/gateway.js'
      - 'vercel.json'
      - 'supabase/migrations/*museum_live*'
      - 'scripts/test-museum-live-v31.mjs'
      - '.github/workflows/museum-v31.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Image sanitizer, survey integrity and live authorization policy
        run: node --test scripts/test-museum-live-v31.mjs
      - name: Node backend syntax
        run: |
          node --check serverless-handlers/museum-live.js
          node --check serverless-handlers/museum-artwork.js
          node --check serverless-handlers/_museumPng.js
          node --check serverless-handlers/gallery-guest.js
      - name: Site-wide localization audit
        run: node scripts/audit-site-language.mjs
      - name: Compile complete Brian Vite frontend
        run: npx vite build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: V3 baseline desktop/mobile regression
        run: npx playwright test --config tests/museum-lab/playwright.config.mjs
