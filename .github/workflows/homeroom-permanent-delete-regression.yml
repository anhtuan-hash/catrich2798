name: Homeroom Permanent Delete Regression

on:
  pull_request:
    paths:
      - 'src/studentPermanentDeleteRuntime.js'
      - 'src/assignedSchoolClassBootstrap.js'
      - 'src/utils/permanentStudentDeletion.js'
      - 'scripts/test-student-permanent-deletion.mjs'
      - '.github/workflows/homeroom-permanent-delete-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run permanent-delete regression test
        run: node scripts/test-student-permanent-deletion.mjs
