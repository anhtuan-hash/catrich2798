name: Attendance Archive

on:
  pull_request:
    paths:
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/components/attendance/AttendanceArchivePanel.jsx'
      - 'src/components/attendance/AttendanceArchive.css'
      - 'src/components/attendance/AttendanceClassManagementWorkspace.jsx'
      - 'src/attendance/attendanceArchiveApi.js'
      - 'src/attendance/extraClassArchiveApi.js'
      - 'src/utils/permissions.js'
      - 'supabase/migrations/20260914_attendance_archive.sql'
      - 'supabase/migrations/20260914_attendance_archive_governance.sql'
      - 'supabase/migrations/20260914_attendance_archive_change_log_preservation.sql'
      - 'supabase/migrations/20260914182000_extra_class_archive_governance.sql'
      - 'scripts/test-attendance-archive.mjs'
      - 'scripts/test-attendance-archive-change-log-preservation.mjs'
      - 'scripts/test-attendance-archive-entry-permission.mjs'
      - 'scripts/test-extra-class-archive-governance.mjs'
      - '.github/workflows/attendance-archive.yml'
  push:
    branches:
      - 'feature/attendance-archive'
      - 'feat/extra-class-archive-governance'
    paths:
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/components/attendance/AttendanceArchivePanel.jsx'
      - 'src/components/attendance/AttendanceArchive.css'
      - 'src/components/attendance/AttendanceClassManagementWorkspace.jsx'
      - 'src/attendance/attendanceArchiveApi.js'
      - 'src/attendance/extraClassArchiveApi.js'
      - 'src/utils/permissions.js'
      - 'supabase/migrations/20260914_attendance_archive.sql'
      - 'supabase/migrations/20260914_attendance_archive_governance.sql'
      - 'supabase/migrations/20260914_attendance_archive_change_log_preservation.sql'
      - 'supabase/migrations/20260914182000_extra_class_archive_governance.sql'
      - 'scripts/test-attendance-archive.mjs'
      - 'scripts/test-attendance-archive-change-log-preservation.mjs'
      - 'scripts/test-attendance-archive-entry-permission.mjs'
      - 'scripts/test-extra-class-archive-governance.mjs'
      - '.github/workflows/attendance-archive.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify attendance archive contract
        run: node scripts/test-attendance-archive.mjs
      - name: Verify attendance archive preserves change logs
        run: node scripts/test-attendance-archive-change-log-preservation.mjs
      - name: Verify attendance:delete grants archive entry
        run: node scripts/test-attendance-archive-entry-permission.mjs
      - name: Verify whole-class archive governance
        run: node scripts/test-extra-class-archive-governance.mjs
