name: Retired Apps Safety
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/removed-apps-contract.test.mjs'
      - '.github/workflows/removed-apps-safety.yml'
  push:
    branches: [main, 'chore/remove-18-apps-20261010']
    paths:
      - 'src/**'
      - 'tests/removed-apps-contract.test.mjs'
      - '.github/workflows/removed-apps-safety.yml'
jobs:
  safe-app-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Confirm removal and retained app contracts
        run: node --test tests/removed-apps-contract.test.mjs
      - name: Confirm main site builds
        run: npm run build
