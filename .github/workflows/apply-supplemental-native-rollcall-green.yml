name: Apply supplemental native rollcall GREEN

on:
  push:
    branches:
      - fix/unify-supplemental-rollcall-20260911
    paths:
      - '.github/workflows/apply-supplemental-native-rollcall-green.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-supplemental-rollcall-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic GREEN patch
        run: node scripts/apply-supplemental-native-rollcall-green.mjs
      - name: Commit generated source changes and remove temporary patch machinery
        run: |
          rm scripts/apply-supplemental-native-rollcall-green.mjs
          rm .github/workflows/apply-supplemental-native-rollcall-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/attendance/supplementalLearningApi.js src/supplementalAttendanceQuickBootstrap.js scripts/apply-supplemental-native-rollcall-green.mjs .github/workflows/apply-supplemental-native-rollcall-green.yml
          git commit -m "feat: unify supplemental native rollcall"
          git push origin HEAD:fix/unify-supplemental-rollcall-20260911
