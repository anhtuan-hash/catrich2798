name: BMPE Gradebook Legacy Contract Diagnostics
on:
  push:
    branches: [perf/bmpe-wave2-dock-20261107]
    paths:
      - 'tests/gradebook-*.test.mjs'
      - 'scripts/test-gradebook-*.mjs'
      - 'scripts/bmpe-gradebook-contract-matrix.mjs'
      - '.github/workflows/bmpe-gradebook-compat-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradebook-contract-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run every old and current Gradebook contract independently, fail if ANY fails
        run: node scripts/bmpe-gradebook-contract-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmpe-gradebook-compat-matrix
          path: reports/performance/BMPE_gradebook_compat_matrix.json
          if-no-files-found: error
          retention-days: 14
