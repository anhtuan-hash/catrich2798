name: Apply TTCM inbox workspace architecture

on:
  push:
    paths:
      - '.github/workflows/ttcm-inbox-workspace-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TTCM workspace
        run: python scripts/patch_ttcm_inbox.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "Brian CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/GlobalTtcmNavigationTab.jsx src/styles/v1159.css
          git rm .github/workflows/ttcm-inbox-workspace-redesign.yml scripts/patch_ttcm_inbox.py
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild TTCM as inbox workspace"
          git push origin HEAD:main
