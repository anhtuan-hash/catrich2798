'''

          jsx_path.write_text(jsx, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit redesign and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Brian CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/GlobalTtcmNavigationTab.jsx src/styles/v1159.css
          git rm .github/workflows/ttcm-inbox-workspace-redesign.yml
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild TTCM as inbox workspace"
          git push origin HEAD:main
