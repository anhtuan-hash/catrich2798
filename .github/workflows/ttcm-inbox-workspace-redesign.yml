name: Apply TTCM inbox workspace architecture

on:
  push:
    paths:
      - '.github/workflows/ttcm-inbox-workspace-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TTCM workspace structure and final visual layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          jsx_path = Path('src/components/GlobalTtcmNavigationTab.jsx')
          css_path = Path('src/styles/v1159.css')
          jsx = jsx_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          old_filter_logic = """  const filteredItems = useMemo(() => items.filter((item) => {\n    if (filter === 'all') return true;\n    if (filter === 'action') return isActionItem(item);\n    return typeForItem(item).id === filter;\n  }), [filter, items]);"""
          new_filter_logic = """  const filteredItems = useMemo(() => items.filter((item) => {\n    if (filter === 'all') return true;\n    if (filter === 'unread') return !manager && item.created_by !== currentUser?.id && !readIds.has(String(item.id));\n    if (filter === 'action') return isActionItem(item);\n    if (filter === 'due') {\n      const due = item.due_at ? new Date(item.due_at).getTime() : 0;\n      const done = ['completed', 'approved', 'archived'].includes(String(item.status || '').toLowerCase());\n      return Boolean(due && due >= Date.now() && !done);\n    }\n    if (filter === 'done') return ['completed', 'approved', 'archived'].includes(String(item.status || '').toLowerCase());\n    return typeForItem(item).id === filter;\n  }), [currentUser?.id, filter, items, manager, readIds]);"""
          if old_filter_logic in jsx:
              jsx = jsx.replace(old_filter_logic, new_filter_logic, 1)
          elif new_filter_logic not in jsx:
              raise SystemExit('TTCM filter logic marker not found; aborting safely.')

          old_filter_menu = """              {[\n                ['all', 'Tất cả'],\n                ['announcement', 'Thông báo'],\n                ['resource', 'Tài liệu'],\n                ['action', 'Cần xử lý'],\n              ].map(([id, label]) => ("""
          new_filter_menu = """              {[\n                ['all', 'Tất cả'],\n                ['unread', 'Chưa đọc'],\n                ['action', 'Cần xử lý'],\n                ['due', 'Sắp đến hạn'],\n                ['done', 'Hoàn tất'],\n              ].map(([id, label]) => ("""
          if old_filter_menu in jsx:
              jsx = jsx.replace(old_filter_menu, new_filter_menu, 1)
          elif new_filter_menu not in jsx:
              raise SystemExit('TTCM filter menu marker not found; aborting safely.')

          marker = '/* TTCM INBOX ARCHITECTURE V3 — 2026-08-26 */'
          if marker not in css:
              css += r'''

