name: Brian Live Jury Public API QA
on:
  pull_request:
    paths:
      - 'src/components/PhotoJuryLive*'
      - 'supabase/functions/photo-judging/**'
      - 'supabase/migrations/*photo_story_live_jury.sql'
      - 'scripts/test-photo-jury-live.mjs'
      - '.github/workflows/photo-jury-live-api-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Anonymous API returns aggregates without judge identities
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://xpkbgqdlfonsinriggmj.supabase.co/functions/v1/photo-judging'
          curl --max-time 25 --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"public:live","albumId":"e1fc3295-2c5d-4e05-8538-b9a7aeef5a67"}' "$endpoint" > jury.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const data=JSON.parse(fs.readFileSync("jury.json","utf8"));
            assert.equal(data.enabled,true);
            assert.equal(data.minimumSubmissions,3);
            assert.ok(Array.isArray(data.artworks));
            assert.ok(Number.isInteger(data.judgeCount));
            assert.ok(Number.isInteger(data.submittedCount));
            const raw=JSON.stringify(data);
            for(const forbidden of ["full_name","invite_id","token_hash","token_ciphertext","comment","last_seen_at","submitted_at"]) {
              assert.equal(raw.includes(forbidden),false,"private field in public result: "+forbidden);
            }
            for(const artwork of data.artworks) {
              assert.ok(artwork.submittedCount >= 3 || (artwork.average===null && artwork.criteria.length===0));
            }
            console.log("Anonymous Live Jury privacy check PASS");
          '
      - name: Deny anonymous changes to public score visibility
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://xpkbgqdlfonsinriggmj.supabase.co/functions/v1/photo-judging'
          code="$(curl --max-time 25 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"admin:visibility","albumId":"e1fc3295-2c5d-4e05-8538-b9a7aeef5a67","enabled":false}' "$endpoint")"
          test "$code" = '403'
