name: Apply Attendance History V2 Patch

on:
  push:
    branches:
      - feat/attendance-history-visual-redesign
    paths:
      - scripts/apply-attendance-history-v2.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/attendance-history-visual-redesign
          fetch-depth: 0
      - name: Apply scoped history redesign patch
        run: python scripts/apply-attendance-history-v2.py
      - name: Commit component changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx
          if git diff --cached --quiet; then
            echo "No component changes to commit"
            exit 0
          fi
          git commit -m "feat: redesign attendance history view"
          git push origin HEAD:feat/attendance-history-visual-redesign
