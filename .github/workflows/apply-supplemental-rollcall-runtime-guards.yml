name: Apply supplemental rollcall runtime guards

on:
  push:
    branches:
      - fix/unify-supplemental-rollcall-20260911
    paths:
      - '.github/workflows/apply-supplemental-rollcall-runtime-guards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-supplemental-rollcall-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-supplemental-rollcall-runtime-guards.mjs
      - name: Commit source changes and remove temporary machinery
        run: |
          rm scripts/apply-supplemental-rollcall-runtime-guards.mjs
          rm .github/workflows/apply-supplemental-rollcall-runtime-guards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx scripts/apply-supplemental-rollcall-runtime-guards.mjs .github/workflows/apply-supplemental-rollcall-runtime-guards.yml
          git commit -m "fix: guard supplemental shared rollcall runtime"
          git push origin HEAD:fix/unify-supplemental-rollcall-20260911
