name: Apply Manage source single scroll

on:
  push:
    branches:
      - feat/manage-source-single-scroll

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Manage scrolling into original source
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f'Expected block not found in {path}')

          replace_once(
              'index.html',
              '    <link rel="stylesheet" href="/attendance-manage-scrollbar-fix.css?v=1" />\n',
              '',
          )

          replace_once(
              'src/components/GlobalAttendanceNavigationTab.css',
              '''.attendance-manage-layout {\n  height: 100%;\n  min-height: 0;\n  display: grid;\n  grid-template-rows: auto auto minmax(0, 1fr);\n  gap: 12px;\n  padding: 14px;\n  overflow: hidden;\n}\n''',
              '''.attendance-manage-layout {\n  height: 100%;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding: 14px;\n  overflow: hidden;\n}\n.attendance-manage-layout > .attendance-import-card,\n.attendance-manage-layout > .attendance-import-report { flex: 0 0 auto; }\n''',
          )

          replace_once(
              'src/components/GlobalAttendanceNavigationTab.css',
              '''.attendance-management-grid {\n  min-height: 0;\n  display: grid;\n  grid-template-columns: 300px minmax(0, 1fr);\n  overflow: hidden;\n  border: 1px solid var(--att-line);\n  border-radius: 14px;\n  background: #fff;\n}\n''',
              '''.attendance-management-grid {\n  flex: 1 1 0;\n  min-height: 0;\n  display: grid;\n  grid-template-columns: 300px minmax(0, 1fr);\n  overflow: hidden;\n  border: 1px solid var(--att-line);\n  border-radius: 14px;\n  background: #fff;\n}\n''',
          )

          replace_once(
              'src/components/GlobalAttendanceNavigationTab.css',
              '.attendance-member-manager { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); overflow: hidden; }\n',
              '''.attendance-member-manager {\n  min-width: 0;\n  min-height: 0;\n  display: block;\n  overflow-x: hidden;\n  overflow-y: auto;\n  overscroll-behavior-y: contain;\n  scrollbar-gutter: stable;\n  scrollbar-width: thin;\n  scrollbar-color: #b8c4d2 transparent;\n}\n.attendance-member-manager::-webkit-scrollbar { width: 8px; }\n.attendance-member-manager::-webkit-scrollbar-track { background: transparent; }\n.attendance-member-manager::-webkit-scrollbar-thumb {\n  border: 2px solid transparent;\n  border-radius: 999px;\n  background: #c3ccd7;\n  background-clip: padding-box;\n}\n''',
          )

          replace_once(
              'src/components/GlobalAttendanceNavigationTab.css',
              '.attendance-member-table { min-height: 0; overflow: auto; }\n',
              '.attendance-member-table { min-height: 0; overflow: visible; border-top: 1px solid var(--att-line-soft); }\n',
          )

          replace_once(
              'src/components/attendance/AttendanceClassEditor.css',
              '''.attendance-class-info-card {\n  margin: 0 0 14px;\n  padding: 16px;\n  border: 1px solid var(--att-m3-outline-variant, #c7c6d0);\n  border-radius: 20px;\n  background: var(--att-m3-surface-container, #f0eef6);\n}\n''',
              '''.attendance-class-info-card {\n  margin: 0;\n  padding: 14px 18px 16px;\n  border: 0;\n  border-top: 1px solid #e7ecef;\n  border-radius: 0;\n  background: transparent;\n  box-shadow: none;\n}\n''',
          )

          replace_once(
              'public/attendance-ui-polish.css',
              '''html body .attendance-shell .attendance-member-manager {\n  overflow: hidden !important;\n  background: linear-gradient(180deg, #ffffff 0%, #fbfffd 100%) !important;\n}\n''',
              '''html body .attendance-shell .attendance-member-manager {\n  background: linear-gradient(180deg, #ffffff 0%, #fbfffd 100%) !important;\n}\n''',
          )

          launch = Path('public/attendance-windows8-launch.css')
          text = launch.read_text()
          start_marker = '/* Manage Classes used to trap scrolling inside several nested panels.'
          end_marker = '''.attendance-member-table {\n  min-height: 0 !important;\n  overflow: visible !important;\n}\n\n'''
          start = text.find(start_marker)
          if start >= 0:
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Manage override end marker missing in launch CSS')
              launch.write_text(text[:start] + text[end + len(end_marker):])
          PY

          if [ -f public/attendance-manage-scrollbar-fix.css ]; then
            git rm public/attendance-manage-scrollbar-fix.css
          fi

          node scripts/test-attendance-manage-source-scroll.mjs
          node scripts/test-attendance-manage-unified-pane.mjs

      - name: Commit original-source fix
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/components/GlobalAttendanceNavigationTab.css src/components/attendance/AttendanceClassEditor.css public/attendance-ui-polish.css public/attendance-windows8-launch.css public/attendance-manage-scrollbar-fix.css 2>/dev/null || true
          git commit -m "fix: make class management use one source-owned scroll"
          git push
