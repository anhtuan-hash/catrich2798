name: Attendance History Display Fixes

on:
  push:
    branches:
      - fix/attendance-history-display-bugs-v2
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify display bug fixes
        run: node scripts/test-attendance-history-display-fixes.mjs
