name: Remove requested apps deeply

on:
  push:
    branches:
      - agent/remove-requested-apps-deep-20260807
    paths:
      - scripts/remove-requested-apps-deep.py
      - .github/workflows/remove-requested-apps-deep.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-requested-apps-deep-20260807
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove requested applications
        run: python3 scripts/remove-requested-apps-deep.py

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Run existing removed-app audit
        run: npm run audit:removed-apps

      - name: Verify no active references remain
        shell: bash
        run: |
          set -euo pipefail
          markers='lesson-plan-ai|exam-studio|word2graph|wordgraph-studio|student-practice|learner-sprint|reading-studio|assessment-core|flying-words|random-group|group-maker|classroom-screen|content-ecosystem|automation-center|collaboration-hub|knowledge-train|word-orbit|activity-graph|crossword-trial|LessonArchitect|ExamStudio|WordGraphStudio|StudentPractice|ReadingStudio|AssessmentCore|FlyingWords|RandomGroup|GroupMaker|ClassroomScreen|ContentEcosystem|AutomationCenter|CollaborationHub|KnowledgeTrain|WordOrbit|ActivityGraph|CrosswordTrial'
          if git grep -n -E "$markers" -- src apps public ':!src/utils/retiredFeatureCleanup.js'; then
            echo 'Active references to the requested retired applications remain.' >&2
            exit 1
          fi
          if git grep -n 'currentRoute === &&' -- src; then
            echo 'Malformed route expressions remain.' >&2
            exit 1
          fi
          test ! -d apps/classroom-screen

      - name: Commit clean application tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/remove-requested-apps-deep.py .github/workflows/remove-requested-apps-deep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove requested applications completely'
          git push origin HEAD:agent/remove-requested-apps-deep-20260807
