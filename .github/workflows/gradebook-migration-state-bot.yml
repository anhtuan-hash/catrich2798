name: Gradebook Migration State Bot

on:
  push:
    branches:
      - fix/gradebook-migration-state
    paths:
      - '.github/workflows/gradebook-migration-state-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gradebook-migration-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Harden gradebook migration state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/utils/gradebookWorkspaceStore.js')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing contract: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              "    updatedAt: workspace.updatedAt,\n    source: 'gradebook-local',\n",
              "    updatedAt: workspace.updatedAt,\n    migrationState: 'migrated',\n    source: 'gradebook-local',\n",
              'local metadata migration state',
          )
          replace_once(
              "    migratedFromHomeroom: row.migrated_from_homeroom === true,\n    source: 'gradebook-cloud',\n",
              "    migratedFromHomeroom: row.migrated_from_homeroom === true,\n    migrationState: 'migrated',\n    source: 'gradebook-cloud',\n",
              'cloud metadata migration state',
          )

          marker = "function mergeCatalog(preferred = [], fallback = []) {\n  const merged = new Map();\n  fallback.forEach((item) => { if (item?.id) merged.set(item.id, item); });\n  preferred.forEach((item) => { if (item?.id) merged.set(item.id, item); });\n  return sortCatalog([...merged.values()]);\n}\n"
          addition = marker + "\nfunction markMigrationState(items = [], migrationState = 'pending', source = 'homeroom-legacy') {\n  return (items || []).map((item) => ({\n    ...item,\n    migrationState,\n    source: item?.source && String(item.source).startsWith('gradebook-') ? item.source : source,\n  }));\n}\n\nexport function summarizeGradebookMigration(items = []) {\n  const summary = { total: 0, migrated: 0, pending: 0, compatibility: 0, complete: false };\n  (items || []).forEach((item) => {\n    if (!item?.id) return;\n    summary.total += 1;\n    const state = item.migrationState === 'compatibility' ? 'compatibility' : item.migrationState === 'migrated' ? 'migrated' : 'pending';\n    summary[state] += 1;\n  });\n  summary.complete = summary.pending === 0 && summary.compatibility === 0;\n  return summary;\n}\n\nfunction catalogResult(items, extra = {}) {\n  return { ...extra, items, migration: summarizeGradebookMigration(items) };\n}\n"
          replace_once(marker, addition, 'catalog helpers')

          marker = "function writeLocalIndex(user, item) {\n  const current = readLocalIndex(user).filter((entry) => entry.id !== item.id);\n  writeJson(indexKey(user), sortCatalog([item, ...current]));\n}\n"
          addition = marker + "\nfunction readDedicatedLocalGradebookClass(user, classId) {\n  const dedicated = readJson(workspaceKey(user, classId), null);\n  return dedicated ? normalizeGradebookWorkspace(dedicated, user) : null;\n}\n"
          replace_once(marker, addition, 'dedicated local reader')

          replace_once(
              "export function listLocalGradebookClasses(user) {\n  const dedicated = readLocalIndex(user);\n  const legacy = listLocalHomeroomWorkspaces(user);\n  return mergeCatalog(dedicated, legacy);\n}\n",
              "export function listLocalGradebookClasses(user) {\n  const dedicated = markMigrationState(readLocalIndex(user), 'migrated', 'gradebook-local');\n  const legacy = markMigrationState(listLocalHomeroomWorkspaces(user), 'pending');\n  return mergeCatalog(dedicated, legacy);\n}\n",
              'local catalog states',
          )

          old_list = """export async function listGradebookClasses(user) {
  const local = listLocalGradebookClasses(user);
  if (!isSupabaseConfigured || !supabase || !user?.id) {
    return { ok: true, offline: true, items: local, source: 'gradebook-local' };
  }

  const { data, error } = await supabase
    .from(GRADEBOOK_TABLE)
    .select('workspace_id,class_name,school_year,grade,semester,class_type,status,archived_at,student_count,migrated_from_homeroom,updated_at')
    .eq('owner_id', user.id)
    .order('updated_at', { ascending: false });

  if (error && isMissingGradebookTable(error)) {
    const legacy = await listHomeroomWorkspaces(user);
    return { ...legacy, items: mergeCatalog(local, legacy.items || []), source: 'legacy-cloud-compat' };
  }

  if (error) {
    try {
      const legacy = await listHomeroomWorkspaces(user);
      return { ok: false, offline: true, message: error.message, items: mergeCatalog(local, legacy.items || []) };
    } catch {
      return { ok: false, offline: true, message: error.message, items: local };
    }
  }

  let legacyItems = [];
  try {
    const legacy = await listHomeroomWorkspaces(user);
    legacyItems = legacy.items || [];
  } catch {
    legacyItems = [];
  }
  const cloud = (data || []).map(metadataFromRow);
  return { ok: true, items: mergeCatalog(cloud, mergeCatalog(local, legacyItems)), source: 'gradebook-cloud' };
}
"""
          new_list = """export async function listGradebookClasses(user) {
  const local = listLocalGradebookClasses(user);
  if (!isSupabaseConfigured || !supabase || !user?.id) {
    return catalogResult(local, { ok: true, offline: true, source: 'gradebook-local' });
  }

  const { data, error } = await supabase
    .from(GRADEBOOK_TABLE)
    .select('workspace_id,class_name,school_year,grade,semester,class_type,status,archived_at,student_count,migrated_from_homeroom,updated_at')
    .eq('owner_id', user.id)
    .order('updated_at', { ascending: false });

  if (error && isMissingGradebookTable(error)) {
    const legacy = await listHomeroomWorkspaces(user);
    const compatibility = markMigrationState(legacy.items || [], 'compatibility', 'legacy-cloud-compat');
    return catalogResult(mergeCatalog(local, compatibility), { ...legacy, source: 'legacy-cloud-compat', gradebookTablePending: true });
  }

  if (error) {
    try {
      const legacy = await listHomeroomWorkspaces(user);
      const pending = markMigrationState(legacy.items || [], 'pending');
      return catalogResult(mergeCatalog(local, pending), { ok: false, offline: true, message: error.message, source: 'gradebook-local' });
    } catch {
      return catalogResult(local, { ok: false, offline: true, message: error.message, source: 'gradebook-local' });
    }
  }

  let legacyItems = [];
  try {
    const legacy = await listHomeroomWorkspaces(user);
    legacyItems = markMigrationState(legacy.items || [], 'pending');
  } catch {
    legacyItems = [];
  }
  const cloud = markMigrationState((data || []).map(metadataFromRow), 'migrated', 'gradebook-cloud');
  const items = mergeCatalog(cloud, mergeCatalog(local, legacyItems));
  return catalogResult(items, { ok: true, source: 'gradebook-cloud' });
}
"""
          replace_once(old_list, new_list, 'gradebook catalog flow')

          replace_once(
              "export function loadLocalGradebookClass(user, classId) {\n  const dedicated = readJson(workspaceKey(user, classId), null);\n  if (dedicated) return normalizeGradebookWorkspace(dedicated, user);\n  const legacy = loadLocalHomeroomWorkspace(user, classId);\n  if (!legacy) return null;\n  return saveLocalGradebookClass(legacy, user);\n}\n",
              "export function loadLocalGradebookClass(user, classId) {\n  const dedicated = readDedicatedLocalGradebookClass(user, classId);\n  if (dedicated) return dedicated;\n  const legacy = loadLocalHomeroomWorkspace(user, classId);\n  if (!legacy) return null;\n  return saveLocalGradebookClass(legacy, user);\n}\n",
              'local compatibility loader',
          )

          old_load = """export async function loadGradebookClass(user, classId) {
  const local = loadLocalGradebookClass(user, classId);
  if (!isSupabaseConfigured || !supabase || !user?.id) {
    return { ok: true, offline: true, workspace: local, source: 'gradebook-local' };
  }

  const { data, error } = await supabase
    .from(GRADEBOOK_TABLE)
    .select('payload,migrated_from_homeroom,updated_at')
    .eq('owner_id', user.id)
    .eq('workspace_id', classId)
    .maybeSingle();

  if (!error && data?.payload) {
    const workspace = saveLocalGradebookClass(data.payload, user);
    return { ok: true, workspace, source: 'gradebook-cloud' };
  }

  const tableMissing = Boolean(error && isMissingGradebookTable(error));
  try {
    const legacy = await loadHomeroomWorkspace(user, classId);
    if (legacy?.workspace) {
      const workspace = saveLocalGradebookClass(legacy.workspace, user);
      if (!tableMissing) {
        const migrationResult = await upsertGradebookCloud(workspace, user, { migratedFromHomeroom: true });
        if (migrationResult.ok) return { ok: true, workspace, source: 'gradebook-cloud-migrated' };
      }
      return { ...legacy, workspace, source: tableMissing ? 'legacy-cloud-compat' : 'legacy-migrated-local' };
    }
  } catch {
    // Dedicated local state remains the final fallback below.
  }

  if (local) {
    return { ok: !error, offline: true, message: error?.message || '', workspace: local, source: 'gradebook-local' };
  }
  return { ok: false, offline: true, message: error?.message || 'Không tìm thấy lớp.', workspace: null };
}
"""
          new_load = """export async function loadGradebookClass(user, classId) {
  const local = readDedicatedLocalGradebookClass(user, classId);
  if (!isSupabaseConfigured || !supabase || !user?.id) {
    if (local) return { ok: true, offline: true, workspace: local, source: 'gradebook-local', migrationState: 'migrated' };
    const legacyLocal = loadLocalHomeroomWorkspace(user, classId);
    if (!legacyLocal) return { ok: false, offline: true, message: 'Không tìm thấy lớp.', workspace: null };
    const workspace = saveLocalGradebookClass(legacyLocal, user);
    return { ok: true, offline: true, workspace, source: 'gradebook-local-migrated', migrationState: 'pending' };
  }

  const { data, error } = await supabase
    .from(GRADEBOOK_TABLE)
    .select('payload,migrated_from_homeroom,updated_at')
    .eq('owner_id', user.id)
    .eq('workspace_id', classId)
    .maybeSingle();

  if (!error && data?.payload) {
    const workspace = saveLocalGradebookClass(data.payload, user);
    return { ok: true, workspace, source: 'gradebook-cloud', migrationState: 'migrated' };
  }

  const tableMissing = Boolean(error && isMissingGradebookTable(error));
  if (local) {
    if (tableMissing) {
      return { ok: true, offline: true, workspace: local, source: 'gradebook-local', migrationState: 'compatibility', gradebookTablePending: true };
    }
    if (error) {
      return { ok: false, offline: true, message: error.message || '', workspace: local, source: 'gradebook-local', migrationState: 'migrated' };
    }
    const restored = await upsertGradebookCloud(local, user);
    return restored.ok
      ? { ok: true, workspace: local, source: 'gradebook-cloud-restored', migrationState: 'migrated' }
      : { ok: false, offline: true, message: restored.error?.message || 'Không thể đồng bộ Sổ điểm.', workspace: local, source: 'gradebook-local', migrationState: 'migrated' };
  }

  try {
    const legacy = await loadHomeroomWorkspace(user, classId);
    if (legacy?.workspace) {
      const workspace = saveLocalGradebookClass(legacy.workspace, user);
      if (!tableMissing) {
        const migrationResult = await upsertGradebookCloud(workspace, user, { migratedFromHomeroom: true });
        if (migrationResult.ok) return { ok: true, workspace, source: 'gradebook-cloud-migrated', migrationState: 'migrated' };
      }
      return { ...legacy, workspace, source: tableMissing ? 'legacy-cloud-compat' : 'legacy-migrated-local', migrationState: tableMissing ? 'compatibility' : 'pending' };
    }
  } catch {
    // No dedicated state exists; legacy remains the final migration source.
  }

  return { ok: false, offline: true, message: error?.message || 'Không tìm thấy lớp.', workspace: null };
}
"""
          replace_once(old_load, new_load, 'dedicated-first gradebook load')

          p.write_text(s)
          PY
      - name: Verify patch contracts
        run: |
          grep -q "function readDedicatedLocalGradebookClass" src/utils/gradebookWorkspaceStore.js
          grep -q "export function summarizeGradebookMigration" src/utils/gradebookWorkspaceStore.js
          grep -q "const local = readDedicatedLocalGradebookClass(user, classId)" src/utils/gradebookWorkspaceStore.js
          grep -q "source: 'gradebook-cloud-restored'" src/utils/gradebookWorkspaceStore.js
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/gradebookWorkspaceStore.js
          git commit -m "fix(gradebook): make dedicated storage authoritative"
          git push origin HEAD:fix/gradebook-migration-state
