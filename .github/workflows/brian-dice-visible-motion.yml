name: Brian Instant Tools — Dice 3D Motion
on:
  pull_request:
    paths:
      - 'src/components/BrianInstantTools/BrianInstantTools.jsx'
      - 'src/components/BrianInstantTools/BrianInstantTools.css'
      - 'tests/e2e/brian-dice-visible-motion.spec.js'
      - 'playwright.brian-wheel-motion.config.js'
      - '.github/workflows/brian-dice-visible-motion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dice-3d-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate tool contracts
        run: node scripts/test-brian-instant-tools.mjs
      - name: Build Vite for production
        run: npx vite build
      - name: Install Chromium only
        run: npx playwright install chromium
      - name: Assert real dice and wheel animation
        run: npx playwright test --config=playwright.brian-wheel-motion.config.js --project=desktop-chromium
