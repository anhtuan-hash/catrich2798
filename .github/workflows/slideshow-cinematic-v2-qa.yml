name: BRIAN Cinematic Slideshow QA
on:
  pull_request:
    paths:
      - 'src/components/PhotoTransitionStage*'
      - 'src/components/HomePublishedSlideshow*'
      - 'tests/fixtures/photo-motion-test.*'
      - 'scripts/test-photo-transition-browser.mjs'
      - 'src/pages/PhotoSlideshow*'
      - 'supabase/migrations/*slideshow_cinematic*'
      - 'scripts/test-slideshow-cinematic-v2.mjs'
      - '.github/workflows/slideshow-cinematic-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cinematic-slideshow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Two-frame transition and public editor regression
        run: node scripts/test-slideshow-cinematic-v2.mjs
      - name: Install Chromium for real motion validation
        run: npx playwright install --with-deps chromium
      - name: Test transitions running in a real Chromium browser
        run: node scripts/test-photo-transition-browser.mjs
      - name: Existing slideshow route regression
        run: |
          node scripts/test-brian-photo-slideshow.mjs
          node scripts/test-home-published-slideshow.mjs
      - name: Actual production Vercel release build
        run: node scripts/build-brian-vercel-release.mjs
