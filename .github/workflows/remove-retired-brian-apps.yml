name: Remove retired Brian apps

on:
  pull_request:
    paths:
      - scripts/remove-retired-brian-apps.py
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remove-retired-brian-apps
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove applications and references
        run: python3 scripts/remove-retired-brian-apps.py

      - name: Install dependencies
        run: npm ci

      - name: Audit source removal
        run: npm run audit:removed-apps

      - name: Build production
        run: npm run build

      - name: Audit production bundles
        run: npm run audit:removed-apps

      - name: Commit permanent removal
        shell: bash
        run: |
          rm -f .github/workflows/remove-retired-brian-apps.yml scripts/remove-retired-brian-apps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remove requested Brian applications completely"
          git push origin HEAD:main
