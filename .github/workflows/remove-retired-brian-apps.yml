name: Remove retired Brian apps

on:
  push:
    paths:
      - .github/workflows/remove-retired-brian-apps.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-retired-brian-apps
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove applications and all active references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          ROOT = Path('.')
          WORKFLOW = Path('.github/workflows/remove-retired-brian-apps.yml')

          target_slugs = {
              'lesson-plan-ai', 'exam-studio', 'word2graph', 'student-practice',
              'reading-studio', 'assessment-core', 'flying-words',
              'random-group-generator', 'classroom-screen', 'content-ecosystem',
              'automation-center', 'collaboration-hub', 'knowledge-train',
              'word-orbit', 'activity-graph', 'crossword-trial', 'practice',
          }

          target_titles = {
              'Lesson Architect', 'Exam Studio', 'WordGraph Studio', 'Learner Sprint',
              'Reading Studio', 'Assessment Core', 'Ngân hàng câu hỏi & đề thi',
              'Flying Words', 'Từ Ngữ Biết Bay', 'Brian Group Maker',
              'Brian Classroom Stage', 'Teaching Content Ecosystem',
              'Hệ sinh thái nội dung dạy học', 'Automation Center',
              'Trung tâm tự động hóa', 'Collaboration Hub', 'Không gian cộng tác',
              'Knowledge Train', 'Đoàn Tàu Tri Thức', 'Vocabulary Orbit',
              'Quỹ đạo từ vựng', 'Brian Activity Graph', 'Crossword Trial',
              'Ô Chữ Bàn Thử',
          }

          component_tokens = {
              'LessonArchitect', 'ExamStudio', 'WordGraph', 'Word2Graph',
              'StudentPractice', 'LearnerSprint', 'ReadingStudio', 'AssessmentCore',
              'FlyingWords', 'RandomGroupGenerator', 'ClassroomScreenHost',
              'ContentEcosystem', 'AutomationCenter', 'CollaborationHub',
              'KnowledgeTrain', 'WordOrbit', 'VocabularyOrbit',
              'ActivityGraphStudio', 'CrosswordTrial',
          }

          filename_needles = {
              'lessonarchitect', 'examstudio', 'wordgraph', 'word2graph',
              'studentpractice', 'learnersprint', 'readingstudio', 'assessmentcore',
              'flyingwords', 'randomgroupgenerator', 'groupmaker',
              'classroomscreen', 'contentecosystem', 'automationcenter',
              'collaborationhub', 'knowledgetrain', 'wordorbit',
              'vocabularyorbit', 'activitygraph', 'crosswordtrial',
              'registeractivitygraph', 'registerwordorbit',
          }

          protected_files = {
              Path('src/main.jsx'), Path('src/pages/ToolPage.jsx'),
              Path('src/data/apps.js'), Path('src/data/designProfiles.js'),
              Path('src/data/appVisibilityRegistry.js'), Path('src/utils/permissions.js'),
              Path('src/applicationBootstrap.jsx'), Path('vite.config.js'),
              Path('package.json'), Path('scripts/audit-removed-apps-v11.6.7.mjs'),
          }

          def norm(value):
              return re.sub(r'[^a-z0-9]+', '', str(value).lower())

          # Delete dedicated application files, styles, tests, reports and standalone app folder.
          dedicated_dirs = [Path('apps/classroom-screen')]
          for directory in dedicated_dirs:
              if directory.exists():
                  shutil.rmtree(directory)

          scan_roots = [
              Path('src'), Path('public'), Path('scripts'), Path('tests'),
              Path('supabase'), Path('docs'), Path('build'), ROOT,
          ]
          seen = set()
          to_delete = []
          for base in scan_roots:
              if not base.exists():
                  continue
              candidates = base.rglob('*') if base != ROOT else base.glob('*')
              for path in candidates:
                  if not path.is_file() or path in seen or path == WORKFLOW:
                      continue
                  seen.add(path)
                  if path in protected_files:
                      continue
                  normalized = norm(path.name)
                  if any(needle in normalized for needle in filename_needles):
                      to_delete.append(path)
          for path in sorted(set(to_delete), key=lambda p: len(p.parts), reverse=True):
              path.unlink(missing_ok=True)

          def find_matching_brace(text, start):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = start
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '*' and nxt == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
                  if ch in "'\"`": quote = ch; i += 1; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              return -1

          def remove_object_blocks(text, markers):
              changed = True
              while changed:
                  changed = False
                  i = 0
                  while i < len(text):
                      if text[i] != '{':
                          i += 1; continue
                      end = find_matching_brace(text, i)
                      if end < 0: break
                      block = text[i:end + 1]
                      if any(marker in block for marker in markers):
                          left = i
                          right = end + 1
                          while left > 0 and text[left - 1] in ' \t\r\n': left -= 1
                          if left > 0 and text[left - 1] == ',':
                              left -= 1
                          else:
                              while right < len(text) and text[right] in ' \t\r\n': right += 1
                              if right < len(text) and text[right] == ',': right += 1
                          text = text[:left] + text[right:]
                          changed = True
                          break
                      i = end + 1
              return text

          slug_markers = []
          for slug in target_slugs:
              slug_markers.extend([f"slug: '{slug}'", f'slug: "{slug}"'])
          title_markers = []
          for title in target_titles:
              title_markers.extend([f"title: '{title}'", f'title: "{title}"', f"titleVi: '{title}'", f'titleVi: "{title}"'])

          apps_path = Path('src/data/apps.js')
          if apps_path.exists():
              text = apps_path.read_text(encoding='utf-8')
              text = remove_object_blocks(text, slug_markers + title_markers)
              text = re.sub(r'\n{3,}', '\n\n', text).rstrip() + '\n'
              apps_path.write_text(text, encoding='utf-8')

          def remove_named_function(text, name):
              match = re.search(rf'\bfunction\s+{re.escape(name)}\s*\(', text)
              if not match: return text
              brace = text.find('{', match.end())
              if brace < 0: return text
              end = find_matching_brace(text, brace)
              if end < 0: return text
              return text[:match.start()] + text[end + 1:]

          vite_path = Path('vite.config.js')
          if vite_path.exists():
              text = vite_path.read_text(encoding='utf-8')
              text = remove_named_function(text, 'randomGroupGeneratorPlugin')
              text = re.sub(r'^.*randomGroupGeneratorPlugin\(\).*$\n?', '', text, flags=re.M)
              text = re.sub(r'\n{3,}', '\n\n', text)
              vite_path.write_text(text, encoding='utf-8')

          package_path = Path('package.json')
          if package_path.exists():
              package = json.loads(package_path.read_text(encoding='utf-8'))
              build = package.get('scripts', {}).get('build', '')
              build = re.sub(r'\s*&&\s*vite build --config apps/classroom-screen/vite\.config\.ts', '', build)
              package['scripts']['build'] = build
              package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          token_pattern = re.compile('|'.join(sorted((re.escape(x) for x in component_tokens), key=len, reverse=True)), re.I)
          slug_pattern = re.compile('|'.join(sorted((re.escape(x) for x in target_slugs), key=len, reverse=True)), re.I)
          title_pattern = re.compile('|'.join(sorted((re.escape(x) for x in target_titles), key=len, reverse=True)), re.I)

          def strip_import_statements(text):
              pattern = re.compile(r'^\s*import\b[\s\S]*?;\s*$', re.M)
              return pattern.sub(lambda m: '' if (token_pattern.search(m.group(0)) or slug_pattern.search(m.group(0))) else m.group(0), text)

          def strip_target_lines(text):
              output = []
              for line in text.splitlines(True):
                  hit = token_pattern.search(line) or slug_pattern.search(line) or title_pattern.search(line)
                  if not hit:
                      output.append(line); continue
                  compact = line.strip()
                  removable = (
                      compact.startswith('import ') or
                      ('lazy(' in line and ('const ' in line or 'import(' in line)) or
                      compact.startswith('if (') or compact.startswith('if(') or
                      'currentRoute ===' in line or 'route ===' in line or
                      'recordAppUsage' in line or
                      compact.startswith("'") or compact.startswith('"') or
                      re.match(r"^['\"][^'\"]+['\"]\s*:\s*\{", compact) or
                      compact.startswith('//')
                  )
                  if removable:
                      continue
                  output.append(line)
              return ''.join(output)

          shared_candidates = []
          for pattern in ('*.js', '*.jsx', '*.ts', '*.tsx'):
              shared_candidates.extend(Path('src').rglob(pattern))
          shared_candidates.append(vite_path)

          for path in sorted(set(shared_candidates)):
              if not path.exists() or path == apps_path:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = strip_import_statements(text)
              text = strip_target_lines(text)
              for slug in target_slugs:
                  q = re.escape(slug)
                  text = re.sub(rf"\s*['\"]{q}['\"]\s*,?", '', text)
                  text = re.sub(rf"(['\"]{q}['\"]\s*:\s*)\{{[^{{}}]*\}}\s*,?", '', text)
              # Remove balanced registry objects that still describe one of the retired apps.
              text = remove_object_blocks(text, slug_markers + title_markers)
              text = re.sub(r',\s*,', ',', text)
              text = re.sub(r'\[\s*,', '[', text)
              text = re.sub(r',\s*\]', ']', text)
              text = re.sub(r'\n{3,}', '\n\n', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Remove target-specific documentation and SQL/test artifacts by content when their whole file is dedicated to one app.
          for base in (Path('docs'), Path('supabase'), Path('scripts'), ROOT):
              if not base.exists(): continue
              candidates = base.rglob('*') if base != ROOT else base.glob('*.md')
              for path in list(candidates):
                  if not path.is_file() or path == WORKFLOW or path in protected_files:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  hits = sum(1 for title in target_titles if title.lower() in text.lower()) + sum(1 for slug in target_slugs if slug in text)
                  if hits >= 2 and len(text) < 120000:
                      path.unlink(missing_ok=True)

          # Replace the release guard with a strict recursive audit for both source and production output.
          audit_path = Path('scripts/audit-removed-apps-v11.6.7.mjs')
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_js = r'''import fs from 'node:fs';
import path from 'node:path';

const retiredSlugs = __SLUGS__;
const retiredTitles = __TITLES__;
const retiredNameTokens = __TOKENS__;
const roots = ['src', 'apps', 'public', 'supabase', 'build', 'dist'];
const allowed = new Set(['scripts/audit-removed-apps-v11.6.7.mjs']);
const textExtensions = new Set(['.js','.jsx','.ts','.tsx','.css','.html','.json','.md','.sql','.mjs','.cjs','.txt','.webmanifest']);
let failures = 0;
const fail = (message) => { console.error(`✗ ${message}`); failures += 1; };
const pass = (message) => console.log(`✓ ${message}`);

function walk(root) {
  if (!fs.existsSync(root)) return [];
  const output = [];
  for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
    const full = path.join(root, entry.name);
    if (entry.isDirectory()) output.push(...walk(full));
    else output.push(full.replaceAll('\\', '/'));
  }
  return output;
}

for (const root of roots) {
  for (const file of walk(root)) {
    if (allowed.has(file)) continue;
    const normalizedName = path.basename(file).toLowerCase().replace(/[^a-z0-9]+/g, '');
    for (const token of retiredNameTokens) {
      if (normalizedName.includes(token.toLowerCase().replace(/[^a-z0-9]+/g, ''))) fail(`retired application file remains: ${file}`);
    }
    if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
    const text = fs.readFileSync(file, 'utf8');
    for (const slug of retiredSlugs) if (text.includes(slug)) fail(`${slug} remains in ${file}`);
    for (const title of retiredTitles) if (text.toLowerCase().includes(title.toLowerCase())) fail(`${title} remains in ${file}`);
  }
}

const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
if (String(pkg.scripts?.build || '').includes('apps/classroom-screen')) fail('classroom-screen build remains active');
else pass('standalone classroom-screen build removed');

if (failures) {
  console.error(`Retired application audit failed (${failures} issue${failures === 1 ? '' : 's'}).`);
  process.exit(1);
}
pass('all requested Brian applications and active references are absent');
'''
          audit_js = audit_js.replace('__SLUGS__', json.dumps(sorted(target_slugs), ensure_ascii=False))
          audit_js = audit_js.replace('__TITLES__', json.dumps(sorted(target_titles), ensure_ascii=False))
          audit_js = audit_js.replace('__TOKENS__', json.dumps(sorted(filename_needles), ensure_ascii=False))
          audit_path.write_text(audit_js, encoding='utf-8')

          # The workflow is one-shot and must not remain in the repository.
          WORKFLOW.unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit removed applications
        run: npm run audit:removed-apps

      - name: Build production bundles
        run: npm run build

      - name: Audit production bundles
        run: npm run audit:removed-apps

      - name: Commit permanent removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remove requested Brian applications completely"
          git push origin HEAD:main
