name: Apply Supplemental History Integration

on:
  push:
    branches:
      - fix/unify-supplemental-attendance-history-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/unify-supplemental-attendance-history-20260911
      - name: Apply integration patch
        run: node scripts/apply-attendance-history-supplemental-integration.mjs
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/supplementalAttendanceReportingBootstrap.js
          git commit -m "Integrate supplemental sessions into native attendance history"
          git push origin HEAD:fix/unify-supplemental-attendance-history-20260911
