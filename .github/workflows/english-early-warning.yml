name: English Early Warning pilot contract
on:
  pull_request:
    paths:
      - 'src/features/english-early-warning/**'
      - 'src/pages/StudentSupportCenter.jsx'
      - 'src/studentSupport/studentSupportIdentity.js'
      - 'scripts/test-english-early-warning.mjs'
      - '.github/workflows/english-early-warning.yml'
  push:
    branches: ['feature/english-early-warning-v3-20261114']
    paths:
      - 'src/features/english-early-warning/**'
      - 'src/pages/StudentSupportCenter.jsx'
      - 'src/studentSupport/studentSupportIdentity.js'
      - 'scripts/test-english-early-warning.mjs'
permissions:
  contents: read
jobs:
  rules-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test deterministic screening and privacy guards
        run: |
          node --version
          node --check src/features/english-early-warning/earlyWarningEngine.js
          node scripts/test-english-early-warning.mjs
