name: Brian Photo Slideshow QA
on:
  pull_request:
    paths:
      - 'src/pages/PhotoSlideshow*'
      - 'src/components/PhotoJudging*'
      - 'src/utils/judgingMath.js'
      - 'supabase/functions/photo-judging/**'
      - 'supabase/migrations/*photo_story_judging.sql'
      - 'scripts/test-photo-judging.mjs'
      - 'scripts/test-photo-jury-live.mjs'
      - 'src/components/PhotoJuryLive*'
      - 'supabase/migrations/*photo_story_live_jury.sql'
      - 'scripts/test-photo-judging-quick-scores.mjs'
      - 'scripts/test-photo-judging-copy-links.mjs'
      - 'supabase/migrations/*photo_judging_encrypted_links.sql'
      - 'src/main.jsx'
      - 'src/utils/permissions.js'
      - 'src/data/appVisibilityRegistry.js'
      - 'supabase/brian_photo_slideshow.sql'
      - 'scripts/test-brian-photo-slideshow.mjs'
      - '.github/workflows/brian-photo-slideshow-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slideshow-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-brian-photo-slideshow.mjs
      - run: node scripts/test-photo-judging.mjs
      - run: node scripts/test-photo-jury-live.mjs
      - run: node scripts/test-photo-judging-quick-scores.mjs
      - run: node scripts/test-photo-judging-copy-links.mjs
      - run: node scripts/build-brian-vercel-release.mjs
