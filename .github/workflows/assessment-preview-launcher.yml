name: Assessment Studio Launcher Card
on:
  pull_request:
    paths:
      - 'src/pages/AssessmentPreview.jsx'
      - 'src/data/apps.js'
      - 'src/data/designProfiles.js'
      - 'src/pages/appsDirectoryData.js'
      - 'src/main.jsx'
      - 'src/utils/permissions.js'
      - 'src/utils/launcherPreferences.js'
      - 'public/assessment-studio-preview.html'
      - 'tests/assessment-preview-card.test.mjs'
      - '.github/workflows/assessment-preview-launcher.yml'
  workflow_dispatch:
jobs:
  verify-app-card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify app directory integration
        run: node --test tests/assessment-preview-card.test.mjs
      - name: Verify production bundle
        run: npx vite build
