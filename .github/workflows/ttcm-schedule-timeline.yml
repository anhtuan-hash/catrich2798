name: TTCM Schedule Timeline

on:
  push:
    branches:
      - style/ttcm-schedule-timeline
  pull_request:
    paths:
      - 'src/components/GlobalWorkScheduleCenter.jsx'
      - 'src/components/GlobalWorkScheduleCompatibleCenter.jsx'
      - 'src/components/GlobalWorkScheduleTimeline.css'
      - 'scripts/test-ttcm-schedule-timeline-ui.mjs'
      - '.github/workflows/ttcm-schedule-timeline.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TTCM schedule timeline contract
        run: node scripts/test-ttcm-schedule-timeline-ui.mjs
      - name: Production build
        run: npm run build
