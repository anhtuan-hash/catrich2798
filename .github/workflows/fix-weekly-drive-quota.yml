name: Fix weekly Drive quota

on:
  push:
    paths:
      - '.github/workflows/fix-weekly-drive-quota.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Separate Drive limits from AI quota
        shell: python
        run: |
          from pathlib import Path

          security = Path('server/api/_security.js')
          text = security.read_text(encoding='utf-8')
          old_signature = "export async function enforceRateLimit(context, { feature = 'api', perMinute = 20, perDay = 200 } = {}) {"
          new_signature = "export async function enforceRateLimit(context, { feature = 'api', perMinute = 20, perDay = 200, useAiQuota = true } = {}) {"
          if old_signature not in text:
              raise SystemExit('enforceRateLimit signature not found')
          text = text.replace(old_signature, new_signature, 1)

          old_quota = """  try {
    const { data, error } = await context.client.rpc('bes_v1099_consume_ai_quota', {
      p_user_id: context.user.id,
      p_feature: feature,
      p_ip_hash: crypto.createHash('sha256').update(context.ip).digest('hex'),
      p_per_minute: perMinute,
      p_per_day: perDay,
    });
    if (!error && data === false) {
      const quotaError = new Error('Your server-side AI quota has been reached.');
      quotaError.status = 429;
      throw quotaError;
    }
  } catch (error) {
    if (error?.status === 429) throw error;
    // The memory limiter remains active when the optional database quota is unavailable.
  }
"""
          new_quota = """  if (useAiQuota) {
    try {
      const { data, error } = await context.client.rpc('bes_v1099_consume_ai_quota', {
        p_user_id: context.user.id,
        p_feature: feature,
        p_ip_hash: crypto.createHash('sha256').update(context.ip).digest('hex'),
        p_per_minute: perMinute,
        p_per_day: perDay,
      });
      if (!error && data === false) {
        const quotaError = new Error('Your server-side AI quota has been reached.');
        quotaError.status = 429;
        throw quotaError;
      }
    } catch (error) {
      if (error?.status === 429) throw error;
      // The memory limiter remains active when the optional database quota is unavailable.
    }
  }
"""
          if old_quota not in text:
              raise SystemExit('AI quota block not found')
          security.write_text(text.replace(old_quota, new_quota, 1), encoding='utf-8')

          upload = Path('api/google-drive-upload.js')
          text = upload.read_text(encoding='utf-8')
          old_limit = "await enforceRateLimit(context, { feature: 'drive_upload', perMinute: 6, perDay: 60 });"
          new_limit = "await enforceRateLimit(context, { feature: 'drive_upload', perMinute: 60, perDay: 500, useAiQuota: false });"
          if old_limit not in text:
              raise SystemExit('Drive upload limit block not found')
          text = text.replace(old_limit, new_limit, 1)
          old_catch = """  } catch (error) {
    return send(res, 400, { error: error.message });
  }
}"""
          new_catch = """  } catch (error) {
    const status = Number(error?.status || 400);
    if (error?.retryAfter) res.setHeader('Retry-After', String(error.retryAfter));
    return send(res, status, { error: error?.message || 'Không thể tải file lên Google Drive.' });
  }
}"""
          if old_catch not in text:
              raise SystemExit('Drive upload catch block not found')
          upload.write_text(text.replace(old_catch, new_catch, 1), encoding='utf-8')

          action = Path('api/weekly-practice-drive-action.js')
          text = action.read_text(encoding='utf-8')
          old_action_limit = "await enforceRateLimit(context, { feature: 'weekly_practice_drive', perMinute: 40, perDay: 500 });"
          new_action_limit = "await enforceRateLimit(context, { feature: 'weekly_practice_drive', perMinute: 60, perDay: 500, useAiQuota: false });"
          if old_action_limit not in text:
              raise SystemExit('Weekly Drive action limit block not found')
          action.write_text(text.replace(old_action_limit, new_action_limit, 1), encoding='utf-8')

          Path('.github/workflows/fix-weekly-drive-quota.yml').unlink()

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api/_security.js api/google-drive-upload.js api/weekly-practice-drive-action.js .github/workflows/fix-weekly-drive-quota.yml
          git commit -m "Separate weekly Drive uploads from AI quota"
          git push origin HEAD:main
