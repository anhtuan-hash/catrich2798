name: TTCM Teacher History

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ttcm-teacher-history
  pull_request:
    paths:
      - 'src/components/GlobalTtcmNavigationTab.jsx'
      - 'src/components/GlobalTtcmTeacherHistory.css'
      - 'src/utils/ttcmTeacherHistory.js'
      - 'scripts/test-ttcm-teacher-history.mjs'
      - '.github/workflows/ttcm-teacher-history.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Teacher history contract
        run: node scripts/test-ttcm-teacher-history.mjs
      - name: Production build
        run: npm run build
