name: Apply Attendance History Late Flow Fix

on:
  push:
    branches:
      - fix/attendance-history-late-overlap-v3

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/attendance-history-late-overlap-v3
          fetch-depth: 0

      - name: Isolate ordered History sections into explicit grid rows
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/attendance/AttendanceHistoryV2.css')
          css = path.read_text(encoding='utf-8')
          replacements = {
            "  grid-column: 1 / -1;\n  order: 1;\n": "  grid-column: 1 / -1;\n  grid-row: 1;\n  order: 1;\n",
            "  grid-column: 1 / -1;\n  order: 2;\n": "  grid-column: 1 / -1;\n  grid-row: 2;\n  order: 2;\n",
            "  grid-column: 1 / -1;\n  order: 3;\n": "  grid-column: 1 / -1;\n  grid-row: 3;\n  order: 3;\n",
            "  grid-column: 1 / -1;\n  order: 4;\n": "  grid-column: 1 / -1;\n  grid-row: 4;\n  order: 4;\n",
            "  grid-column: 1 / -1;\n  order: 5;\n": "  grid-column: 1 / -1;\n  grid-row: 5;\n  order: 5;\n",
            "  grid-column: 1 / -1;\n  order: 6;\n": "  grid-column: 1 / -1;\n  grid-row: 6;\n  order: 6;\n",
          }
          for old, new in replacements.items():
            assert old in css, f'missing ordered grid target: {old!r}'
            css = css.replace(old, new, 1)

          late = ".ahv3__shell .ahv3__detail > .ahv3__late-section {\n  grid-column: 1 / -1;\n  order: 7;\n}"
          late_new = ".ahv3__shell .ahv3__detail > .ahv3__late-section {\n  grid-column: 1 / -1;\n  grid-row: 7;\n  order: 7;\n}"
          cancel = ".ahv3__shell .ahv3__detail > .att-m3-cancel-reason {\n  grid-column: 1 / -1;\n  order: 7;\n}"
          cancel_new = ".ahv3__shell .ahv3__detail > .att-m3-cancel-reason {\n  grid-column: 1 / -1;\n  grid-row: 7;\n  order: 7;\n}"
          proof = ".ahv3__shell .ahv3__detail > .ahv3__proof {\n  grid-column: 1 / 2;\n  order: 8;\n}"
          proof_new = ".ahv3__shell .ahv3__detail > .ahv3__proof {\n  grid-column: 1 / 2;\n  grid-row: 8;\n  order: 8;\n}"
          absent = ".ahv3__shell .ahv3__detail > .ahv3__absent-section {\n  grid-column: 2 / 3;\n  order: 8;\n}"
          absent_new = ".ahv3__shell .ahv3__detail > .ahv3__absent-section {\n  grid-column: 2 / 3;\n  grid-row: 8;\n  order: 8;\n}"
          footer = ".ahv3__shell .ahv3__detail > .ahv3__footer-grid {\n  grid-column: 1 / -1;\n  order: 9;\n}"
          footer_new = ".ahv3__shell .ahv3__detail > .ahv3__footer-grid {\n  grid-column: 1 / -1;\n  grid-row: 9;\n  order: 9;\n}"
          for old, new in [(late, late_new), (cancel, cancel_new), (proof, proof_new), (absent, absent_new), (footer, footer_new)]:
            assert old in css, f'missing History section target: {old.splitlines()[0]}'
            css = css.replace(old, new, 1)

          css += r'''

          /* A tardy card with two or more visible rows must contribute its full
             visual height to the grid track. Without this minimum, the following
             absence/footer rows can be auto-sized underneath its overflowing rows. */
          .ahv3__shell .ahv3__detail > .ahv3__late-section:has(.attendance-late-list > div:nth-child(2)) {
            min-height: 166px !important;
          }
          '''
          path.write_text(css, encoding='utf-8')

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify tardy flow no longer overlaps
        run: npx playwright test tests/e2e/attendance-history-late-flow.spec.js --project=chromium-desktop

      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-attendance-history-late-flow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/attendance/AttendanceHistoryV2.css .github/workflows/apply-attendance-history-late-flow-fix.yml
          git commit -m "Fix Attendance History tardy section overlap"
          git push origin HEAD:fix/attendance-history-late-overlap-v3
