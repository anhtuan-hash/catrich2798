name: Navigation Mockup A Safety
on:
  pull_request:
    paths:
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalReportsNavigationTab.jsx'
      - 'src/components/GlobalTtcmNavigationTab.jsx'
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/components/GlobalNavigationHubController.jsx'
      - 'src/components/GlobalNavigationUtilitiesDropdown.css'
      - 'tests/nav-utilities-mockup-a.test.mjs'
      - 'tests/e2e/nav-utilities-mockup-a.spec.js'
      - '.github/workflows/navigation-utilities-mockup-a.yml'
  push:
    branches: [main, ui/mockup-a-utilities-nav-20261010]
    paths:
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalReportsNavigationTab.jsx'
      - 'src/components/GlobalTtcmNavigationTab.jsx'
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/components/GlobalNavigationHubController.jsx'
      - 'src/components/GlobalNavigationUtilitiesDropdown.css'
      - 'tests/nav-utilities-mockup-a.test.mjs'
      - 'tests/e2e/nav-utilities-mockup-a.spec.js'
      - '.github/workflows/navigation-utilities-mockup-a.yml'
jobs:
  utilities:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Navigation permission and portal contract
        run: node --test tests/nav-utilities-mockup-a.test.mjs tests/nav-text-only-compact.test.mjs
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Visual navigation regression in Chromium and WebKit
        run: npx playwright test tests/e2e/nav-utilities-mockup-a.spec.js --project=chromium-desktop --project=webkit-desktop
