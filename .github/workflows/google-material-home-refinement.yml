name: Google Material Home Refinement Guard

on:
  pull_request:
    paths:
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalHomeGoogleHeroOverlay.jsx'
      - 'src/components/GlobalHomeGoogleHeroOverlay.css'
      - 'src/components/GlobalNavigationGoogleRefinement.css'
      - 'scripts/test-google-material-home-refinement.mjs'
      - '.github/workflows/google-material-home-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Google Material home refinement contract
        run: node scripts/test-google-material-home-refinement.mjs
