name: BMPE Wave 4 - Baseline Visual Evidence (Review Required)
on:
  push:
    branches: [perf/bmpe-wave2-dock-20261107]
    paths:
      - 'scripts/bmpe-visual-*'
      - '.github/workflows/bmpe-wave4-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build production main and BMPE candidate without mutating production
        shell: bash
        run: |
          cd baseline && npm ci --ignore-scripts && npx --no-install vite build && cd ..
          cd candidate && npm ci --ignore-scripts && npx --no-install vite build
      - name: Install headless Linux Chromium and Pillow
        shell: bash
        run: |
          cd candidate
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Serve both local Vite builds on separate ports
        shell: bash
        run: |
          mkdir -p candidate/reports/bmpe-visual
          (cd baseline && npx --no-install vite preview --host 127.0.0.1 --port 4175 --strictPort) > candidate/reports/bmpe-visual/baseline-server.log 2>&1 &
          (cd candidate && npx --no-install vite preview --host 127.0.0.1 --port 4176 --strictPort) > candidate/reports/bmpe-visual/candidate-server.log 2>&1 &
          for port in 4175 4176; do
            ready=0
            for attempt in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then echo "Vite preview port $port failed"; exit 1; fi
          done
      - name: Capture actual routes with synthetic admin demo, both viewports
        shell: bash
        run: |
          cd candidate
          BMPE_REPORT_SHA="$(git -C ../baseline rev-parse HEAD)" node scripts/bmpe-visual-capture.mjs --base http://127.0.0.1:4175 --label baseline
          BMPE_REPORT_SHA="$(git rev-parse HEAD)" node scripts/bmpe-visual-capture.mjs --base http://127.0.0.1:4176 --label candidate
          python ../candidate/scripts/bmpe-visual-diff.py reports/bmpe-visual
      - name: Export screenshots, differences, and route errors (NOT approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmpe-wave4-main-versus-candidate-visual-evidence
          path: candidate/reports/bmpe-visual/
          retention-days: 14
          if-no-files-found: ignore
