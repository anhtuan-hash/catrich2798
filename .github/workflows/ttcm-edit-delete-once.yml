name: TTCM edit delete once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ttcm-edit-delete-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply TTCM edit and delete controls
        run: python .github/scripts/ttcm_edit_delete_once.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmNavigationTab.css
          git diff --cached --quiet || git commit -m "feat(ttcm): edit and delete sent communications"
          git push origin HEAD:main
