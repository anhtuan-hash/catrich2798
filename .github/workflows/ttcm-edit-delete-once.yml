name: TTCM edit delete once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ttcm-edit-delete-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply TTCM edit and delete controls
        run: |
          python <<'PY'
          from pathlib import Path

          jsx_path = Path('src/components/GlobalTtcmNavigationTab.jsx')
          css_path = Path('src/components/GlobalTtcmNavigationTab.css')
          jsx = jsx_path.read_text()
          css = css_path.read_text()

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Marker not found: {label}')
              return text.replace(old, new, 1)

          jsx = replace_once(
              jsx,
              "  createWorkHubAttachmentUrl,\n  rememberWorkHubItem,",
              "  createWorkHubAttachmentUrl,\n  rememberWorkHubItem,\n  removeWorkHubSubmissionFiles,",
              'work hub removal import',
          )

          jsx = replace_once(
              jsx,
              "  download: 'M11 3h2v9l3-3 1.4 1.4L12 15.8l-5.4-5.4L8 9l3 3V3ZM5 18h14v2H5v-2Z',\n};",
              "  download: 'M11 3h2v9l3-3 1.4 1.4L12 15.8l-5.4-5.4L8 9l3 3V3ZM5 18h14v2H5v-2Z',\n  delete: 'M7 21a2 2 0 0 1-2-2V7h14v12a2 2 0 0 1-2 2H7Zm1-11v8h2v-8H8Zm6 0v8h2v-8h-2ZM8 4l1-1h6l1 1h4v2H4V4h4Z',\n};",
              'delete glyph',
          )

          jsx = replace_once(
              jsx,
              "function dueLabel(value) {\n  if (!value) return '';",
              "function dateTimeLocalValue(value) {\n  if (!value) return '';\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) return '';\n  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);\n  return local.toISOString().slice(0, 16);\n}\n\nfunction dueLabel(value) {\n  if (!value) return '';",
              'datetime local helper',
          )

          jsx = replace_once(
              jsx,
              "  const [composeOpen, setComposeOpen] = useState(false);\n  const [items, setItems]",
              "  const [composeOpen, setComposeOpen] = useState(false);\n  const [editingId, setEditingId] = useState('');\n  const [items, setItems]",
              'editing state',
          )

          jsx = replace_once(
              jsx,
              "  function beginCompose() {\n    setComposeOpen(true);\n    setKind('announcement');",
              "  function beginCompose() {\n    setEditingId('');\n    setComposeOpen(true);\n    setKind('announcement');",
              'reset edit on compose',
          )

          marker = "  function toggleRecipient(id) {\n"
          insertion = r'''  function beginEdit(item) {
    if (!manager || !item) return;
    const canManage = item.created_by === currentUser?.id || item.owner_id === currentUser?.id;
    if (!canManage) return;
    setEditingId(String(item.id));
    setKind(typeForItem(item).id);
    setTitle(item.title || '');
    setDescription(item.description || '');
    setDueAt(dateTimeLocalValue(item.due_at));
    setFile(null);
    setRecipientQuery('');
    setSelectedRecipients(uniqueIds(item.assignee_ids));
    setError('');
    setNotice('');
    setComposeOpen(true);
  }

  async function saveEditedCommunication(event) {
    event.preventDefault();
    if (!manager || busy || !editingId) return;
    const existing = items.find((item) => String(item.id) === String(editingId));
    if (!existing) { setError('Không tìm thấy nội dung cần chỉnh sửa.'); return; }
    const canManage = existing.created_by === currentUser?.id || existing.owner_id === currentUser?.id;
    if (!canManage) { setError('Bạn không có quyền chỉnh sửa nội dung này.'); return; }
    if (!title.trim()) { setError('Vui lòng nhập tiêu đề.'); return; }
    const recipients = uniqueIds(selectedRecipients);
    if (!recipients.length) { setError('Vui lòng chọn ít nhất một giáo viên nhận nội dung.'); return; }
    if (file) {
      const validation = validateWorkHubFile(file);
      if (!validation.ok) { setError(validation.message); return; }
    }

    const type = CONTENT_TYPES.find((entry) => entry.id === kind) || CONTENT_TYPES[0];
    setBusy(true); setError(''); setNotice('');
    try {
      const editedAt = new Date().toISOString();
      const patch = {
        title: title.trim(),
        description: description.trim(),
        item_type: `ttcm_${kind}`,
        status: type.action
          ? (['completed', 'approved', 'archived'].includes(String(existing.status || '').toLowerCase()) ? 'assigned' : (existing.status || 'assigned'))
          : 'completed',
        priority: kind === 'task' ? 'high' : 'normal',
        assignee_ids: recipients,
        due_at: dueAt ? new Date(dueAt).toISOString() : null,
        metadata: {
          ...(existing.metadata || {}),
          ttcm: true,
          ttcm_kind: kind,
          ttcm_action_required: type.action,
          notify_assignee: type.action,
          recipient_count: recipients.length,
          ttcm_edited_at: editedAt,
          ttcm_edited_by: currentUser.id,
        },
        updated_at: editedAt,
      };

      let updated = { ...existing, ...patch };
      if (client && runtime.ready && runtime.session) {
        if (file) {
          const upload = await uploadWorkHubSubmissionFile({ file, itemId: existing.id, userId: currentUser.id });
          if (!upload.ok) throw new Error(upload.message || 'Không thể tải tệp đính kèm mới.');
          patch.attachments = [upload.attachment];
        }
        const { data, error: updateError } = await client
          .from('work_hub_items')
          .update(patch)
          .eq('id', existing.id)
          .eq('created_by', currentUser.id)
          .select(WORK_ITEM_COLUMNS)
          .single();
        if (updateError) throw updateError;
        updated = data;

        if (file) {
          const previousAttachments = Array.isArray(existing.attachments) ? existing.attachments : [];
          if (previousAttachments.length) {
            removeWorkHubSubmissionFiles(previousAttachments).catch(() => {});
          }
        }
      }

      const next = items.map((item) => String(item.id) === String(updated.id) ? updated : item);
      setItems(next);
      writeLocalItems(currentUser, next);
      setEditingId('');
      setComposeOpen(false);
      setFile(null);
      setNotice('Đã cập nhật nội dung đã gửi. Thay đổi được đồng bộ đến tổ viên và Trung tâm công việc.');
      window.setTimeout(() => setNotice(''), 3600);
    } catch (editError) {
      setError(editError?.message || 'Không thể cập nhật nội dung TTCM.');
    } finally {
      setBusy(false);
    }
  }

  async function deleteCommunication(item) {
    if (!manager || busy || !item) return;
    const canManage = item.created_by === currentUser?.id || item.owner_id === currentUser?.id;
    if (!canManage) return;
    const confirmed = window.confirm(`Xóa “${item.title}”?\n\nNội dung sẽ biến mất khỏi Kênh TTCM và mục liên quan trong Trung tâm công việc. Hành động này không thể hoàn tác.`);
    if (!confirmed) return;

    setBusy(true); setError(''); setNotice('');
    try {
      if (client && runtime.ready && runtime.session) {
        const attachments = Array.isArray(item.attachments) ? item.attachments : [];
        if (attachments.length) {
          const removeResult = await removeWorkHubSubmissionFiles(attachments);
          if (!removeResult.ok) throw new Error(removeResult.message || 'Không thể xóa tệp đính kèm.');
        }
        const { error: deleteError } = await client
          .from('work_hub_items')
          .delete()
          .eq('id', item.id)
          .eq('created_by', currentUser.id);
        if (deleteError) throw deleteError;
      }

      const next = items.filter((entry) => String(entry.id) !== String(item.id));
      setItems(next);
      writeLocalItems(currentUser, next);
      setReadIds((current) => {
        const updated = new Set(current);
        updated.delete(String(item.id));
        writeReadIds(currentUser, updated);
        return updated;
      });
      if (String(editingId) === String(item.id)) {
        setEditingId('');
        setComposeOpen(false);
      }
      setNotice('Đã xóa nội dung TTCM và dữ liệu công việc liên quan.');
      window.setTimeout(() => setNotice(''), 3200);
    } catch (deleteError) {
      setError(deleteError?.message || 'Không thể xóa nội dung TTCM.');
    } finally {
      setBusy(false);
    }
  }

'''
          if 'async function deleteCommunication(item)' not in jsx:
              if marker not in jsx:
                  raise SystemExit('Marker not found: edit delete insertion')
              jsx = jsx.replace(marker, insertion + marker, 1)

          jsx = replace_once(
              jsx,
              "            const attachments = Array.isArray(item.attachments) ? item.attachments : [];\n            return (",
              "            const attachments = Array.isArray(item.attachments) ? item.attachments : [];\n            const canManageItem = manager && (item.created_by === currentUser?.id || item.owner_id === currentUser?.id);\n            return (",
              'card management flag',
          )

          jsx = replace_once(
              jsx,
              "                    {manager ? <span><Icon name=\"people\" size={15} /> {uniqueIds(item.assignee_ids).length} giáo viên</span> : null}\n                    {unread ? <i>Mới</i> : null}",
              "                    {manager ? <span><Icon name=\"people\" size={15} /> {uniqueIds(item.assignee_ids).length} giáo viên</span> : null}\n                    {item.metadata?.ttcm_edited_at ? <span className=\"ttcm-m3-edited-chip\">Đã chỉnh sửa {formatDate(item.metadata.ttcm_edited_at)}</span> : null}\n                    {unread ? <i>Mới</i> : null}",
              'edited indicator',
          )

          jsx = replace_once(
              jsx,
              "                  {attachments.length ? (\n                    <div className=\"ttcm-m3-attachments\">",
              "                  {attachments.length ? (\n                    <div className=\"ttcm-m3-attachments\">",
              'attachment marker noop',
          )

          action_anchor = "                  {!manager && isActionItem(item) ? (\n                    <div className=\"ttcm-m3-card-actions\">"
          manager_actions = r'''                  {canManageItem ? (
                    <div className="ttcm-m3-manager-actions" aria-label="Quản lý nội dung đã gửi">
                      <button type="button" className="ttcm-m3-manager-button" disabled={busy} onClick={(event) => { event.stopPropagation(); beginEdit(item); }}>
                        <Icon name="edit" size={17} />Sửa
                      </button>
                      <button type="button" className="ttcm-m3-manager-button is-danger" disabled={busy} onClick={(event) => { event.stopPropagation(); deleteCommunication(item); }}>
                        <Icon name="delete" size={17} />Xóa
                      </button>
                    </div>
                  ) : null}
'''
          if 'className="ttcm-m3-manager-actions"' not in jsx:
              if action_anchor not in jsx:
                  raise SystemExit('Marker not found: manager card actions')
              jsx = jsx.replace(action_anchor, manager_actions + action_anchor, 1)

          jsx = replace_once(
              jsx,
              "            <form className=\"ttcm-m3-compose\" onSubmit={saveCommunication}>",
              "            <form className=\"ttcm-m3-compose\" onSubmit={editingId ? saveEditedCommunication : saveCommunication}>",
              'edit form submit',
          )

          jsx = replace_once(
              jsx,
              "                  <strong>Tạo nội dung TTCM</strong>\n                  <small>Chọn đúng loại để hệ thống quyết định có đưa sang Trung tâm công việc hay không.</small>",
              "                  <strong>{editingId ? 'Chỉnh sửa nội dung TTCM' : 'Tạo nội dung TTCM'}</strong>\n                  <small>{editingId ? 'Thay đổi sẽ cập nhật cùng một nội dung đã gửi và đồng bộ sang Trung tâm công việc.' : 'Chọn đúng loại để hệ thống quyết định có đưa sang Trung tâm công việc hay không.'}</small>",
              'compose edit heading',
          )

          jsx = replace_once(
              jsx,
              "                  <span>Tệp đính kèm <small>(tối đa 10 MB)</small></span>\n                  <input type=\"file\" onChange={(event) => setFile(event.target.files?.[0] || null)} />",
              "                  <span>Tệp đính kèm <small>{editingId ? '(để trống nếu giữ tệp hiện tại)' : '(tối đa 10 MB)'}</small></span>\n                  <input type=\"file\" onChange={(event) => setFile(event.target.files?.[0] || null)} />",
              'edit attachment helper',
          )

          jsx = replace_once(
              jsx,
              "                <button type=\"button\" className=\"ttcm-m3-text-button\" onClick={() => setComposeOpen(false)}>Hủy</button>\n                <button type=\"submit\" className=\"ttcm-m3-filled-button\" disabled={busy}>{busy ? 'Đang gửi…' : 'Gửi đến tổ viên'}</button>",
              "                <button type=\"button\" className=\"ttcm-m3-text-button\" onClick={() => { setComposeOpen(false); setEditingId(''); }}>Hủy</button>\n                <button type=\"submit\" className=\"ttcm-m3-filled-button\" disabled={busy}>{busy ? (editingId ? 'Đang lưu…' : 'Đang gửi…') : (editingId ? 'Lưu thay đổi' : 'Gửi đến tổ viên')}</button>",
              'edit submit label',
          )

          jsx = replace_once(
              jsx,
              "                <button type=\"button\" className=\"ttcm-m3-icon-button\" onClick={() => setComposeOpen(false)} aria-label=\"Đóng\"><Icon name=\"close\" /></button>",
              "                <button type=\"button\" className=\"ttcm-m3-icon-button\" onClick={() => { setComposeOpen(false); setEditingId(''); }} aria-label=\"Đóng\"><Icon name=\"close\" /></button>",
              'edit close button',
          )

          css_append = r'''

/* TTCM sent-item management — Google Material 3 */
.ttcm-m3-manager-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #eef0f2;
}

.ttcm-m3-manager-button {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 13px;
  border: 0;
  border-radius: 999px;
  background: #e8f0fe;
  color: #0b57d0;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.ttcm-m3-manager-button:hover {
  background: #d3e3fd;
}

.ttcm-m3-manager-button.is-danger {
  background: #fce8e6;
  color: #b3261e;
}

.ttcm-m3-manager-button.is-danger:hover {
  background: #f9dedc;
}

.ttcm-m3-manager-button:disabled {
  opacity: .5;
  cursor: default;
}

.ttcm-m3-edited-chip {
  padding: 3px 8px;
  border-radius: 999px;
  background: #eef3f8;
  color: #5f6368;
  font-weight: 600;
}

@media (max-width: 540px) {
  .ttcm-m3-manager-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .ttcm-m3-manager-button {
    width: 100%;
  }
}
'''
          if 'TTCM sent-item management — Google Material 3' not in css:
              css += css_append

          jsx_path.write_text(jsx)
          css_path.write_text(css)
          PY

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmNavigationTab.css
          git diff --cached --quiet || git commit -m "feat(ttcm): edit and delete sent communications"
          git push origin HEAD:main
