name: Gradebook Focus Workspace V5
on:
  push:
    branches: [main, 'feat/gradebook-focus-workspace-v5-20261012']
    paths:
      - 'src/pages/GradebookStudio.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookFocusBar.jsx'
      - 'src/styles/GradebookFocusV5.css'
      - 'tests/gradebook-focus-v5.test.mjs'
      - '.github/workflows/gradebook-focus-v5.yml'
  pull_request:
    paths:
      - 'src/pages/GradebookStudio.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookFocusBar.jsx'
      - 'src/styles/GradebookFocusV5.css'
      - 'tests/gradebook-focus-v5.test.mjs'
jobs:
  gradebook-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/gradebook-focus-v5.test.mjs
      - run: node tests/gradebook-roster-layout-hotfix.test.mjs
      - run: node scripts/test-gradebook-command-deck-v3.mjs
      - run: node scripts/test-gradebook-mock-exams.mjs
      - run: node scripts/test-gradebook-mock-exams-v2.mjs
      - run: node --test tests/gradebook-spectrum-v4.test.mjs tests/gradebook-permanent-palette.test.mjs tests/gradebook-workbench-two.test.mjs tests/gradebook-material3-colorful.test.mjs
      - run: npm run build
