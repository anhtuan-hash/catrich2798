name: Brian Family Feud Manual Score QA
on:
  pull_request:
    paths:
      - 'src/components/BrianFamilyFeud/**'
      - 'scripts/test-brian-family-feud*.mjs'
      - '.github/workflows/brian-family-feud-manual-scores.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-feud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Family Feud engine, Grade 10–12 packs, TV layout and interactions
        run: |
          node scripts/test-brian-family-feud.mjs
          node scripts/test-brian-family-feud-g10-units.mjs
          node scripts/test-brian-family-feud-g11-units.mjs
          node scripts/test-brian-family-feud-g12-units.mjs
          node scripts/test-brian-family-feud-tv-stage.mjs
      - name: Verify Vite production compilation
        run: npx vite build
