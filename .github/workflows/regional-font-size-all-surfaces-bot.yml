name: Regional Font Size Reset Patch

on:
  push:
    branches:
      - fix/regional-font-sizes-all-surfaces

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regional-font-sizes-all-surfaces
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch reset semantics
        run: python .github/scripts/fix-regional-font-size-reset.py
      - name: Install dependencies
        run: npm ci
      - name: Verify font contracts
        run: node scripts/test-font-upload-live-preview.mjs
      - name: Build production bundle
        run: npm run build
      - name: Commit reset fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/RegionalFontAdminPanel.jsx scripts/test-font-upload-live-preview.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(fonts): reset regional text size to inheritance"
          git push origin HEAD:fix/regional-font-sizes-all-surfaces
