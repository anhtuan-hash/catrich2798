          panel = replace_once(panel,
          """const REGION_FONT_OPTIONS = GLOBAL_FONT_PRESETS.filter((item) => !item.custom);
const NAV_FONT_SIZE_MIN = 11;
const NAV_FONT_SIZE_MAX = 22;
const NAV_FONT_SIZE_FALLBACK = 15;
""",
          """const REGION_FONT_OPTIONS = GLOBAL_FONT_PRESETS.filter((item) => !item.custom);
""",
          'panel constants')

          panel = replace_once(panel,
          """function clampNavigationFontSize(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return null;
  return Math.min(NAV_FONT_SIZE_MAX, Math.max(NAV_FONT_SIZE_MIN, Math.round(number)));
}

""",
          "",
          'panel clamp')

          panel = replace_once(panel,
          """  const [message, setMessage] = useState('');
  const [messageTone, setMessageTone] = useState('info');
  const [navigationDefaultSize, setNavigationDefaultSize] = useState(NAV_FONT_SIZE_FALLBACK);

  const savedRef = useRef(saved);""",
          """  const [message, setMessage] = useState('');
  const [messageTone, setMessageTone] = useState('info');

  const savedRef = useRef(saved);""",
          'panel default state')

          start = panel.find("  useEffect(() => {\n    if (typeof document === 'undefined' || typeof window === 'undefined') return;\n    const target = document.querySelector('.brian-nav a")
          if start < 0:
              raise SystemExit('panel nav measure effect start missing')
          end_marker = "  }, []);\n\n  useEffect(() => {\n    let alive = true;"
          end = panel.find(end_marker, start)
          if end < 0:
              raise SystemExit('panel nav measure effect end missing')
          panel = panel[:start] + "  useEffect(() => {\n    let alive = true;" + panel[end + len(end_marker):]

          panel = replace_once(panel,
          """    return GLOBAL_FONT_REGIONS.filter((region) => (
      Boolean(normalized[region.id])
      || (region.id === 'navigation' && Boolean(getRegionalFontSize(normalized, 'navigation')))
    )).length;""",
          """    return GLOBAL_FONT_REGIONS.filter((region) => (
      Boolean(normalized[region.id]) || Boolean(getRegionalFontSize(normalized, region.id))
    )).length;""",
          'custom count')

          panel = replace_once(panel,
          """  const setNavigationFontSize = (value) => {
    setMessage('');
    const nextSize = clampNavigationFontSize(value);
    setDraft((current) => {
      const next = { ...current };
      const fontSizes = { ...(current.fontSizes || {}) };
      if (nextSize) fontSizes.navigation = nextSize;
      else delete fontSizes.navigation;
      if (Object.keys(fontSizes).length) next.fontSizes = fontSizes;
      else delete next.fontSizes;
      return next;
    });
  };""",
          """  const setRegionFontSize = (regionId, value) => {
    setMessage('');
    const limits = getRegionalFontSizeLimits(regionId);
    const number = Number(value);
    const nextSize = Number.isFinite(number)
      ? Math.min(limits.max, Math.max(limits.min, Math.round(number)))
      : null;
    setDraft((current) => {
      const next = { ...current };
      const fontSizes = { ...(current.fontSizes || {}) };
      if (nextSize) fontSizes[regionId] = nextSize;
      else delete fontSizes[regionId];
      if (Object.keys(fontSizes).length) next.fontSizes = fontSizes;
      else delete next.fontSizes;
      return next;
    });
  };""",
          'generic setter')

          panel = replace_once(panel,
          """      delete next[regionId];
      if (regionId === 'navigation' && next.fontSizes?.navigation) {
        const fontSizes = { ...next.fontSizes };
        delete fontSizes.navigation;
        if (Object.keys(fontSizes).length) next.fontSizes = fontSizes;
        else delete next.fontSizes;
      }
      return next;""",
          """      delete next[regionId];
      if (next.fontSizes?.[regionId]) {
        const fontSizes = { ...next.fontSizes };
        delete fontSizes[regionId];
        if (Object.keys(fontSizes).length) next.fontSizes = fontSizes;
        else delete next.fontSizes;
      }
      return next;""",
          'generic reset')

          panel = panel.replace('Đã lưu font theo khu vực và cỡ chữ thanh điều hướng. Các phiên Brian đang mở sẽ nhận thay đổi qua Realtime.', 'Đã lưu font và cỡ chữ theo từng khu vực. Các phiên Brian đang mở sẽ nhận thay đổi qua Realtime.')
          panel = panel.replace('Regional fonts and navigation text size saved. Open Brian sessions will receive the change through Realtime.', 'Regional fonts and per-region text sizes saved. Open Brian sessions will receive the change through Realtime.')
          panel = panel.replace('Mỗi thẻ bên dưới có bộ chọn font và nút tải font cá nhân độc lập. Riêng Thanh điều hướng còn có thể chỉnh cỡ chữ và xem thử trực tiếp trước khi lưu.', 'Mỗi thẻ bên dưới có bộ chọn font, cỡ chữ và nút tải font cá nhân độc lập. Mọi khu vực đều xem thử trực tiếp trước khi lưu.')
          panel = panel.replace('Every card has its own font selector and custom upload. Navigation also supports live text-size adjustment before saving.', 'Every card has its own font selector, text size and custom upload with live preview before saving.')

          panel = replace_once(panel,
          """          const customActive = choice === 'custom';
          const navigationFontSize = region.id === 'navigation' ? getRegionalFontSize(draft, 'navigation') : null;
          const navigationSizeCustomized = region.id === 'navigation' && Boolean(navigationFontSize);
          const regionCustomized = choice !== 'inherit' || navigationSizeCustomized;""",
