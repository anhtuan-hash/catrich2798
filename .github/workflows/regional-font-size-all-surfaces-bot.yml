name: Regional Font Size All Surfaces Bot

on:
  push:
    branches:
      - fix/regional-font-sizes-all-surfaces

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regional-font-sizes-all-surfaces
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix patcher regression assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch-regional-font-sizes.py')
          text = path.read_text()
          bad = '''system.includes(\\"node.style.setProperty('font-size', `${size}px`, 'important')\\"))],'''
          good = '''system.includes(\\"node.style.setProperty('font-size', `${size}px`, 'important')\\")],'''
          if bad not in text:
              raise SystemExit('expected bad regression assertion not found')
          path.write_text(text.replace(bad, good, 1))
          PY
      - name: Patch regional font sizes
        run: python .github/scripts/patch-regional-font-sizes.py
      - name: Install dependencies
        run: npm ci
      - name: Verify font contracts
        run: node scripts/test-font-upload-live-preview.mjs
      - name: Build production bundle
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/globalRegionalFontSystem.js src/components/admin/RegionalFontAdminPanel.jsx scripts/test-font-upload-live-preview.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(fonts): enable text size for every region"
          git push origin HEAD:fix/regional-font-sizes-all-surfaces
