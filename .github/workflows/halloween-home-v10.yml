name: Halloween V10 — art-first scene QA
on:
  pull_request:
    paths:
      - 'src/features/halloween-home/halloween.v10-art-direction.css'
      - 'src/pages/Home.jsx'
      - 'src/components/HomeHeroExperience2026.jsx'
      - 'src/components/HomePublishedSlideshow.jsx'
      - 'src/components/mobile/MobileHomeView.jsx'
      - 'src/main.jsx'
      - 'src/components/GlobalEditorialAuthorityRuntime.jsx'
      - 'public/assets/home/v11/**'
      - 'public/assets/home/v12/**'
      - 'scripts/test-halloween-home-v10*'
      - 'scripts/test-halloween-home-v11-app-browser.mjs'
      - 'scripts/test-halloween-home-v12-live-browser.mjs'
      - 'tests/fixtures/halloween-home-v10*'
      - '.github/workflows/halloween-home-v10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-halloween-home-v10.mjs
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-halloween-home-v10-browser.mjs
      - run: node scripts/test-halloween-home-v11-app-browser.mjs
      - name: Build with intercepted test backend
        run: npx vite build
        env:
          VITE_SUPABASE_URL: https://brian-fixture.invalid
          VITE_SUPABASE_ANON_KEY: fixture-anon-key
      - run: node scripts/test-halloween-home-v12-live-browser.mjs
      - name: Preserve ON / OFF screenshots for real comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halloween-v10-art-first-visual-QA
          path: |
            artifacts/halloween-v10/
            artifacts/halloween-v12/
          if-no-files-found: warn
