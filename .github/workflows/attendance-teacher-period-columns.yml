name: Attendance teacher period columns

on:
  push:
    branches:
      - fix/teacher-report-period-columns-20260912
  pull_request:
    paths:
      - 'src/utils/attendanceReport.js'
      - 'src/utils/attendanceReportExport.js'
      - 'scripts/test-attendance-teacher-period-columns.mjs'
      - '.github/workflows/attendance-teacher-period-columns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify teacher period columns contract
        run: node scripts/test-attendance-teacher-period-columns.mjs
      - name: Verify production build
        run: npm run build
