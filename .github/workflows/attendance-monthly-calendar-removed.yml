name: Attendance Monthly Calendar Removed

on:
  pull_request:
    paths:
      - 'src/attendanceLegacyMonthlyCalendarCleanup.js'
      - 'src/tabResumeStability.js'
      - 'scripts/test-attendance-monthly-calendar-removed.mjs'
      - '.github/workflows/attendance-monthly-calendar-removed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify monthly attendance calendar is removed
        run: node scripts/test-attendance-monthly-calendar-removed.mjs
