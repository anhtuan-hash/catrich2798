name: Attendance History Visual Redesign

on:
  push:
    branches:
      - feat/attendance-history-visual-redesign
  pull_request:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify attendance history visual redesign
        run: node scripts/test-attendance-history-visual-redesign.mjs
      - name: Verify attendance history behavior guard
        run: node scripts/test-attendance-history-functional-guard.mjs
      - name: Verify attendance history date filter and sorting
        run: node scripts/test-attendance-history-date-filter.mjs
      - name: Verify attendance history delete authorization
        run: node scripts/test-attendance-history-delete-authorization.mjs
      - name: Verify attendance history display fixes
        run: node scripts/test-attendance-history-display-fixes.mjs
      - name: Checkout supplemental integration head
        if: github.head_ref == 'fix/unify-supplemental-attendance-history-20260911'
        uses: actions/checkout@v4
        with:
          ref: fix/unify-supplemental-attendance-history-20260911
      - name: Apply supplemental history integration
        if: github.head_ref == 'fix/unify-supplemental-attendance-history-20260911'
        run: node scripts/apply-attendance-history-supplemental-integration.mjs
      - name: Verify supplemental history integration
        run: node scripts/test-attendance-history-supplemental-integration.mjs
      - name: Verify production build for supplemental integration
        if: github.head_ref == 'fix/unify-supplemental-attendance-history-20260911'
        run: npm run build
      - name: Commit verified supplemental source
        if: github.head_ref == 'fix/unify-supplemental-attendance-history-20260911' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- src/components/GlobalAttendanceNavigationTab.jsx src/supplementalAttendanceReportingBootstrap.js; then
            echo "No supplemental source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/supplementalAttendanceReportingBootstrap.js
          git commit -m "Integrate supplemental sessions into native attendance history"
          git push origin HEAD:fix/unify-supplemental-attendance-history-20260911
