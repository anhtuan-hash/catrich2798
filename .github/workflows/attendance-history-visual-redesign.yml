name: Attendance History Visual Redesign

on:
  push:
    branches:
      - feat/attendance-history-visual-redesign
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify attendance history visual redesign
        run: node scripts/test-attendance-history-visual-redesign.mjs
      - name: Verify approved attendance history mockup V4
        run: node scripts/test-attendance-history-mockup-v4.mjs
      - name: Verify attendance history behavior guard
        run: node scripts/test-attendance-history-functional-guard.mjs
      - name: Verify attendance history date filter and sorting
        run: node scripts/test-attendance-history-date-filter.mjs
      - name: Verify attendance history delete authorization
        run: node scripts/test-attendance-history-delete-authorization.mjs
      - name: Verify attendance history display fixes
        run: node scripts/test-attendance-history-display-fixes.mjs
      - name: Verify supplemental history integration
        run: node scripts/test-attendance-history-supplemental-integration.mjs
