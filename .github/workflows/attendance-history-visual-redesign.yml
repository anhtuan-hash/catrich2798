name: Attendance History Visual Redesign

on:
  push:
    branches:
      - feat/attendance-history-visual-redesign
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify attendance history visual redesign
        run: node scripts/test-attendance-history-visual-redesign.mjs
