name: Apply Attendance History Bulk Delete

on:
  push:
    branches:
      - feat/attendance-history-bulk-delete

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-history-bulk-delete
          fetch-depth: 0

      - name: Apply bounded history multi-select change
        run: python scripts/apply-attendance-history-bulk-delete.py

      - name: Commit applied change
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add history multi-select bulk delete"
          git push origin HEAD:feat/attendance-history-bulk-delete
