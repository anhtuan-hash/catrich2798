name: Gradebook Semester Mission Safety
on:
  pull_request:
    paths:
      - 'src/utils/gradebookSemesterMission.js'
      - 'src/components/gradebook/GradebookSemesterMission.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'tests/gradebook-semester-mission.test.mjs'
      - 'tests/e2e/gradebook-semester-mission.spec.js'
      - '.github/workflows/gradebook-semester-mission.yml'
  push:
    branches: [main]
    paths:
      - 'src/utils/gradebookSemesterMission.js'
      - 'src/components/gradebook/GradebookSemesterMission.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
jobs:
  gradebook-semester:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Data integrity and semester mission regression
        run: |
          node --test tests/gradebook-semester-mission.test.mjs tests/gradebook-workbench-two.test.mjs tests/gradebook-student-workbench.test.mjs tests/gradebook-studio-edition.test.mjs tests/gradebook-colorful-mockup.test.mjs tests/gradebook-material3-finish.test.mjs tests/gradebook-usability-material3.test.mjs tests/gradebook-academic-workspace.test.mjs tests/gradebook-productivity.test.mjs tests/gradebook-phase2.test.mjs tests/gradebook-phase3.test.mjs
      - name: Vite production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Semester mission responsiveness and score-table geometry
        run: npx playwright test tests/e2e/gradebook-semester-mission.spec.js tests/e2e/gradebook-workbench-two.spec.js tests/e2e/gradebook-academic-geometry.spec.js tests/e2e/gradebook-usability-material3.spec.js --project=chromium-desktop
