name: One-shot Attendance Search Keep

on:
  push:
    branches:
      - fix/attendance-search-runtime-keep

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-search-runtime-keep
      - name: Add runtime keep marker to attendance discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/GlobalAttendanceNavigationTab.jsx')
          text = path.read_text()
          before = '<div className="att-m3-class-discovery">'
          after = '<div className="att-m3-class-discovery" data-bes-keep-search="true">'
          if after in text:
              print('Marker already present')
          elif before in text:
              path.write_text(text.replace(before, after, 1))
              print('Marker applied')
          else:
              raise SystemExit('Attendance discovery anchor not found')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx
          git diff --cached --check
          git commit -m "fix: keep attendance search and subject filters visible"
          git push origin HEAD:fix/attendance-search-runtime-keep
