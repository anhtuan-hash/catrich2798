name: Attendance Full UI Rebuild
on:
  pull_request:
    paths:
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/components/attendance/AttendanceWorkspaceUI.jsx'
      - 'src/components/attendance/AttendanceClassManagementWorkspace.jsx'
      - 'src/components/attendance/AttendanceArchivePanel.jsx'
      - 'src/components/attendance/AttendanceMonthlyReport.jsx'
      - 'src/components/attendance/StudentAttendanceReport.jsx'
      - 'src/pages/AttendanceWorkspaceRebuilt.css'
      - 'src/pages/AttendanceWorkspace.jsx'
      - 'scripts/test-attendance-rebuilt-ui.mjs'
      - 'tests/e2e/attendance-rebuilt-ui.spec.js'
      - '.github/workflows/attendance-rebuilt-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-attendance-rebuilt-ui.mjs
      - run: node scripts/test-attendance-unified-typography.mjs
      - run: node scripts/test-attendance-unified-design.mjs
      - run: node scripts/test-student-attendance-report.mjs
      - run: node scripts/test-attendance-report-export.mjs
      - run: node scripts/test-attendance-standalone-route.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/attendance-rebuilt-ui.spec.js --project=chromium-desktop --project=webkit-desktop
