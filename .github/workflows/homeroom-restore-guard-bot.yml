name: Homeroom Restore Guard Bot

on:
  push:
    branches:
      - fix/homeroom-restore-migration-guard
    paths:
      - '.github/workflows/homeroom-restore-guard-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homeroom-restore-migration-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply restore safety boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          phase = Path('src/utils/homeroomPhase3.js')
          s = phase.read_text()
          import_marker = "import { normalizeHomeroomWorkspace } from './homeroomStore.js';\n"
          import_replacement = import_marker + "import { sanitizeWorkspaceBackupSnapshot, sanitizeWorkspaceRestoreSnapshot } from './homeroomProductionSafety.js';\n"
          require(import_marker in s, 'homeroomPhase3 import marker missing')
          require('sanitizeWorkspaceRestoreSnapshot' not in s, 'restore sanitizer already wired')
          s = s.replace(import_marker, import_replacement, 1)

          snapshot_old = "  const { auditLogs, backups, ...rest } = normalized;\n  return rest;"
          snapshot_new = "  const { auditLogs, backups, ...rest } = normalized;\n  return sanitizeWorkspaceBackupSnapshot(rest);"
          require(snapshot_old in s, 'snapshotPayload contract missing')
          s = s.replace(snapshot_old, snapshot_new, 1)

          restore_old = "  const restored = normalizeHomeroomWorkspace({\n    ...backup.snapshot,\n    id: current.id,\n    backups: current.backups,\n    auditLogs: current.auditLogs,\n    updatedAt: nowIso(),\n  }, actor);"
          restore_new = "  const restoreCandidate = sanitizeWorkspaceRestoreSnapshot(backup.snapshot, current);\n  const restored = normalizeHomeroomWorkspace({\n    ...restoreCandidate,\n    id: current.id,\n    backups: current.backups,\n    auditLogs: current.auditLogs,\n    updatedAt: nowIso(),\n  }, actor);"
          require(restore_old in s, 'restoreWorkspaceBackup contract missing')
          s = s.replace(restore_old, restore_new, 1)
          phase.write_text(s)

          tabs = Path('src/components/HomeroomPhase3Tabs.jsx')
          s = tabs.read_text()
          old_confirm = "Khôi phục bản sao lưu này? Dữ liệu hiện tại sẽ được thay thế nhưng vẫn giữ lịch sử sao lưu."
          new_confirm = "Khôi phục bản sao lưu này? Dữ liệu lớp sẽ được thay thế; cấu hình bảo mật, quyền truy cập và loại lớp hiện tại vẫn được giữ an toàn."
          require(old_confirm in s, 'restore confirmation copy missing')
          s = s.replace(old_confirm, new_confirm, 1)
          old_success = "onCommit(restoreWorkspaceBackup(workspace, id, currentUser), 'Đã khôi phục bản sao lưu.');"
          new_success = "onCommit(restoreWorkspaceBackup(workspace, id, currentUser), 'Đã khôi phục bản sao lưu an toàn; cấu hình truy cập hiện tại được giữ nguyên.');"
          require(old_success in s, 'restore success copy missing')
          s = s.replace(old_success, new_success, 1)
          tabs.write_text(s)
          PY
      - name: Verify and build
        run: |
          grep -q "sanitizeWorkspaceBackupSnapshot(rest)" src/utils/homeroomPhase3.js
          grep -q "sanitizeWorkspaceRestoreSnapshot(backup.snapshot, current)" src/utils/homeroomPhase3.js
          grep -q "cấu hình bảo mật, quyền truy cập và loại lớp hiện tại" src/components/HomeroomPhase3Tabs.jsx
          npm ci
          node scripts/test-homeroom-production-safety.mjs
          node scripts/test-homeroom-legacy-cleanup.mjs
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/homeroomPhase3.js src/components/HomeroomPhase3Tabs.jsx
          git commit -m "fix(homeroom): sanitize backup restore boundary"
          git push origin HEAD:fix/homeroom-restore-migration-guard
