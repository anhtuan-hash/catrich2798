name: Dashboard Google colorful refresh

on:
  push:
    paths:
      - '.github/workflows/dashboard-google-color-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Dashboard hero and Google Material color layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/WorkDashboard.jsx')
          source = page.read_text(encoding='utf-8')

          import_marker = "import '../styles/teacher-dashboard-compact-layout.css';\n"
          import_line = "import '../styles/teacher-dashboard-google-colorful.css';\n"
          if import_line not in source:
              if import_marker not in source:
                  raise SystemExit('Dashboard compact CSS import marker not found')
              source = source.replace(import_marker, import_marker + import_line, 1)

          old = '''        <header className="gd-hero">\n          <div className="gd-hero-copy"><span>{t.eyebrow}</span><h1>{t.hello}, {name}</h1><p>{t.lead}</p></div>\n          <div className="gd-hero-actions"><button type="button" className="gd-button filled" onClick={() => document.querySelector('#dashboard-calendar')?.scrollIntoView({ behavior: 'auto', block: 'start' })}><Icon name="calendar" size={20} />{t.calendar}</button><button type="button" className="gd-button outlined" onClick={() => refresh()} disabled={loading}><Icon name="refresh" size={20} />{loading ? t.refreshing : t.refresh}</button></div>\n        </header>'''
          new = '''        <header className="gd-hero">\n          <div className="gd-hero-copy">\n            <span className="gd-hero-eyebrow">{t.eyebrow}</span>\n            <h1><span className="gd-hero-greeting">{t.hello},</span><strong className="gd-hero-name">{name}</strong><span className="gd-hero-wave" aria-hidden="true">👋</span></h1>\n            <p>{t.lead}</p>\n          </div>\n          <div className="gd-hero-actions"><button type="button" className="gd-button filled" onClick={() => document.querySelector('#dashboard-calendar')?.scrollIntoView({ behavior: 'auto', block: 'start' })}><Icon name="calendar" size={20} />{t.calendar}</button><button type="button" className="gd-button outlined" onClick={() => refresh()} disabled={loading}><Icon name="refresh" size={20} />{loading ? t.refreshing : t.refresh}</button></div>\n        </header>'''
          if old not in source:
              raise SystemExit('Dashboard hero marker not found')
          source = source.replace(old, new, 1)
          page.write_text(source, encoding='utf-8')

          css = r'''/* Dashboard Google Material 3 — vivid color layer.
   Loaded after compact layout to restore hero copy and add stronger Google color hierarchy. */

.app-shell[data-route="dashboard"] .gd-page {
  --gd-blue: #0b57d0 !important;
  --gd-blue-bright: #1a73e8 !important;
  --gd-blue-soft: #d3e3fd !important;
  --gd-blue-container: #c2e7ff !important;
  --gd-green: #188038 !important;
  --gd-green-soft: #c4eed0 !important;
  --gd-yellow: #b06000 !important;
  --gd-yellow-soft: #ffefc3 !important;
  --gd-red: #c5221f !important;
  --gd-red-soft: #f9dedc !important;
  --gd-purple: #7e22ce !important;
  --gd-purple-soft: #eadcff !important;
  --gd-text: #1f1f1f !important;
  --gd-muted: #4f5965 !important;
  --gd-border: #c7d5e5 !important;
  --gd-border-soft: #e3eaf2 !important;
  --gd-canvas: #f7faff !important;
  background:
    radial-gradient(circle at 8% 8%, rgba(66,133,244,.09), transparent 24%),
    radial-gradient(circle at 92% 22%, rgba(52,168,83,.07), transparent 24%),
    #f7faff !important;
}

.app-shell[data-route="dashboard"] .gd-shell { gap: 22px !important; }

/* ---------- HERO ---------- */
.app-shell[data-route="dashboard"] .gd-top-grid > .gd-hero {
  isolation: isolate !important;
  min-height: 232px !important;
  height: 232px !important;
  padding: 26px 34px !important;
  justify-content: center !important;
  border: 1px solid #b9d4ff !important;
  border-radius: 28px !important;
  background:
    radial-gradient(circle at 88% 22%, rgba(52,168,83,.20), transparent 24%),
    radial-gradient(circle at 78% 92%, rgba(251,188,4,.18), transparent 22%),
    radial-gradient(circle at 96% 78%, rgba(234,67,53,.13), transparent 18%),
    linear-gradient(105deg, #ffffff 0%, #f5f9ff 43%, #e9f2ff 100%) !important;
  box-shadow: 0 6px 20px rgba(32, 86, 160, .10) !important;
}

.app-shell[data-route="dashboard"] .gd-top-grid > .gd-hero::before,
.app-shell[data-route="dashboard"] .gd-top-grid > .gd-hero::after {
  z-index: 0 !important;
  opacity: .92 !important;
  transform: scale(.70) translate3d(10px, 2px, 0) !important;
  transform-origin: right center !important;
  pointer-events: none !important;
}

.app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy {
  position: relative !important;
  z-index: 5 !important;
  display: grid !important;
  width: min(590px, 55%) !important;
  max-width: 590px !important;
  align-content: center !important;
  justify-items: start !important;
  opacity: 1 !important;
  visibility: visible !important;
  transform: none !important;
  filter: none !important;
}

.app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-eyebrow {
  display: inline-flex !important;
  min-height: 26px !important;
  margin: 0 0 10px !important;
  padding: 0 11px !important;
  align-items: center !important;
  border: 1px solid #a8c7fa !important;
  border-radius: 999px !important;
  background: #d3e3fd !important;
  color: #0842a0 !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: .02em !important;
}

.app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy h1 {
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: baseline !important;
  gap: 0 .18em !important;
  max-width: 580px !important;
  margin: 0 !important;
  color: #1f1f1f !important;
  font-size: clamp(38px, 4vw, 54px) !important;
  font-weight: 500 !important;
  line-height: .98 !important;
  letter-spacing: -.045em !important;
  opacity: 1 !important;
  visibility: visible !important;
}

.app-shell[data-route="dashboard"] .gd-hero-greeting { color: #202124 !important; }
.app-shell[data-route="dashboard"] .gd-hero-name {
  color: #0b57d0 !important;
  font: inherit !important;
  font-weight: 650 !important;
}
.app-shell[data-route="dashboard"] .gd-hero-wave {
  font-size: .62em !important;
  letter-spacing: 0 !important;
  transform: translateY(-.04em) !important;
}

.app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy p {
  max-width: 560px !important;
  margin: 12px 0 0 !important;
  color: #46515f !important;
  font-size: 14px !important;
  font-weight: 500 !important;
  line-height: 1.48 !important;
  opacity: 1 !important;
}

.app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-actions {
  position: relative !important;
  z-index: 6 !important;
  margin-top: 16px !important;
  gap: 10px !important;
}

.app-shell[data-route="dashboard"] .gd-button {
  min-height: 42px !important;
  padding: 0 18px !important;
  border-radius: 999px !important;
  font-size: 13px !important;
  font-weight: 700 !important;
}
.app-shell[data-route="dashboard"] .gd-button.filled {
  border-color: #0b57d0 !important;
  background: #0b57d0 !important;
  box-shadow: 0 2px 6px rgba(11,87,208,.24) !important;
}
.app-shell[data-route="dashboard"] .gd-button.filled:hover { background: #0842a0 !important; }
.app-shell[data-route="dashboard"] .gd-button.outlined {
  border: 1px solid #8ab4f8 !important;
  background: rgba(255,255,255,.94) !important;
  color: #0b57d0 !important;
}

/* ---------- MATERIAL SURFACES ---------- */
.app-shell[data-route="dashboard"] .gd-calendar,
.app-shell[data-route="dashboard"] .gd-surface,
.app-shell[data-route="dashboard"] .dnh {
  border-color: #c7d5e5 !important;
  background: #fff !important;
  box-shadow: 0 2px 7px rgba(32,64,110,.07), 0 12px 32px rgba(32,64,110,.05) !important;
}

.app-shell[data-route="dashboard"] .gd-calendar-header {
  border-bottom-color: #cfe0f5 !important;
  background: linear-gradient(90deg, #eaf2ff 0%, #f7faff 56%, #fff 100%) !important;
}
.app-shell[data-route="dashboard"] .gd-calendar-title > span {
  background: #c2e7ff !important;
  color: #0b57d0 !important;
}
.app-shell[data-route="dashboard"] .gd-calendar-title h2 { color: #16325c !important; font-weight: 650 !important; }
.app-shell[data-route="dashboard"] .gd-calendar-title p { color: #536579 !important; }

.app-shell[data-route="dashboard"] .gd-calendar-sidebar {
  background: linear-gradient(180deg, #f0f6ff 0%, #f8fbff 100%) !important;
  border-bottom-color: #d6e4f5 !important;
}
.app-shell[data-route="dashboard"] .gd-calendar-side-head > div > span { color: #0b57d0 !important; font-weight: 700 !important; }
.app-shell[data-route="dashboard"] .gd-count-chip {
  background: #d3e3fd !important;
  color: #0842a0 !important;
}

.app-shell[data-route="dashboard"] .gd-day-card {
  border-color: #d5e0ee !important;
  background: #fff !important;
  box-shadow: 0 1px 3px rgba(32,64,110,.06) !important;
}
.app-shell[data-route="dashboard"] .gd-day-card:hover {
  border-color: #8ab4f8 !important;
  background: #f3f7ff !important;
}
.app-shell[data-route="dashboard"] .gd-day-card.is-selected {
  border-color: #669df6 !important;
  background: #d3e3fd !important;
  box-shadow: inset 0 0 0 1px rgba(11,87,208,.10), 0 2px 7px rgba(11,87,208,.10) !important;
}
.app-shell[data-route="dashboard"] .gd-day-card.is-today .gd-day-number {
  background: #0b57d0 !important;
  color: #fff !important;
}
.app-shell[data-route="dashboard"] .gd-day-card.has-events .gd-day-event-count {
  background: #c2e7ff !important;
  color: #0842a0 !important;
}

.app-shell[data-route="dashboard"] .gd-calendar-next-event {
  border: 1px solid #a8dab5 !important;
  background: #c4eed0 !important;
}
.app-shell[data-route="dashboard"] .gd-calendar-next-event > span {
  background: #9bd6aa !important;
  color: #0d652d !important;
}

.app-shell[data-route="dashboard"] .gd-agenda-panel { background: #fff !important; }
.app-shell[data-route="dashboard"] .gd-agenda-date-badge {
  background: linear-gradient(145deg, #0b57d0, #1a73e8) !important;
  box-shadow: 0 4px 12px rgba(11,87,208,.20) !important;
}
.app-shell[data-route="dashboard"] .gd-agenda-heading > span { color: #0b57d0 !important; font-weight: 700 !important; }
.app-shell[data-route="dashboard"] .gd-agenda-heading h3 { color: #1f1f1f !important; font-weight: 650 !important; }

.app-shell[data-route="dashboard"] .gd-agenda-list-split .gd-event {
  border: 1px solid #e0e7ef !important;
  background: #fff !important;
}
.app-shell[data-route="dashboard"] .gd-agenda-list-split .gd-event:hover {
  border-color: #b8cff0 !important;
  background: #f6f9ff !important;
  box-shadow: 0 2px 7px rgba(32,64,110,.07) !important;
}
.app-shell[data-route="dashboard"] .gd-event.is-today .gd-event-color { background: #188038 !important; }
.app-shell[data-route="dashboard"] .gd-event.is-soon .gd-event-color { background: #f9ab00 !important; }
.app-shell[data-route="dashboard"] .gd-event.is-overdue .gd-event-color { background: #d93025 !important; }

/* ---------- NEWS HUB ---------- */
.app-shell[data-route="dashboard"] .dnh { border-radius: 26px !important; overflow: hidden !important; }
.app-shell[data-route="dashboard"] .dnh::before {
  content: "";
  display: block;
  height: 4px;
  background: linear-gradient(90deg, #4285f4 0 25%, #34a853 25% 50%, #fbbc04 50% 75%, #ea4335 75% 100%);
}
.app-shell[data-route="dashboard"] .dnh-head {
  background: linear-gradient(90deg, #f4f8ff 0%, #fff 60%) !important;
  border-bottom-color: #dbe5f2 !important;
}
.app-shell[data-route="dashboard"] .dnh-icon { background: #c2e7ff !important; color: #0b57d0 !important; }
.app-shell[data-route="dashboard"] .dnh-title>div>span { color: #0b57d0 !important; }
.app-shell[data-route="dashboard"] .dnh-title h2 { color: #1f1f1f !important; font-weight: 650 !important; }
.app-shell[data-route="dashboard"] .dnh-tabs { background: #e8eef7 !important; }
.app-shell[data-route="dashboard"] .dnh-tabs button.is-active {
  background: #fff !important;
  color: #0b57d0 !important;
  box-shadow: 0 2px 6px rgba(32,64,110,.12) !important;
}
.app-shell[data-route="dashboard"] .dnh-featured-copy strong { color: #172b4d !important; }
.app-shell[data-route="dashboard"] .dnh-featured-copy>span,
.app-shell[data-route="dashboard"] .dnh-view-all { color: #0b57d0 !important; }
.app-shell[data-route="dashboard"] .dnh-story:hover { background: #f3f7ff !important; }

/* ---------- QUICK ACTIONS ---------- */
.app-shell[data-route="dashboard"] .gd-quick-surface .gd-surface-header {
  border-bottom-color: #c8dcf7 !important;
  background: linear-gradient(90deg, #dff0ff 0%, #eff8ff 58%, #fff 100%) !important;
}
.app-shell[data-route="dashboard"] .gd-quick-surface .gd-heading-icon {
  background: #c2e7ff !important;
  color: #0b57d0 !important;
}
.app-shell[data-route="dashboard"] .gd-quick-surface .gd-surface-heading h2 { color: #17365f !important; font-weight: 650 !important; }
.app-shell[data-route="dashboard"] .gd-quick-action {
  border-color: #c8d7e8 !important;
  background: #fff !important;
  color: #263747 !important;
  box-shadow: 0 1px 3px rgba(32,64,110,.05) !important;
}
.app-shell[data-route="dashboard"] .gd-quick-action:hover {
  border-color: #8ab4f8 !important;
  background: #eef4ff !important;
  color: #0b57d0 !important;
}
.app-shell[data-route="dashboard"] .gd-quick-action:nth-child(1) > span { background:#c2e7ff !important; color:#0b57d0 !important; }
.app-shell[data-route="dashboard"] .gd-quick-action:nth-child(2) > span { background:#c4eed0 !important; color:#137333 !important; }
.app-shell[data-route="dashboard"] .gd-quick-action:nth-child(3) > span { background:#ffefc3 !important; color:#8a5300 !important; }
.app-shell[data-route="dashboard"] .gd-quick-action:nth-child(4) > span { background:#eadcff !important; color:#7627bb !important; }
.app-shell[data-route="dashboard"] .gd-quick-action:nth-child(5) > span { background:#f9dedc !important; color:#b3261e !important; }
.app-shell[data-route="dashboard"] .gd-quick-action:nth-child(6) > span { background:#d3e3fd !important; color:#0842a0 !important; }

@media (max-width: 900px) {
  .app-shell[data-route="dashboard"] .gd-top-grid > .gd-hero {
    min-height: 220px !important;
    height: auto !important;
    padding: 24px !important;
  }
  .app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy { width: 64% !important; max-width: 64% !important; }
  .app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy h1 { font-size: clamp(34px, 6vw, 46px) !important; }
}

@media (max-width: 650px) {
  .app-shell[data-route="dashboard"] .gd-top-grid > .gd-hero {
    min-height: 0 !important;
    padding: 22px 20px 132px !important;
  }
  .app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy { width: 100% !important; max-width: 100% !important; }
  .app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-copy h1 { font-size: clamp(34px, 10vw, 44px) !important; }
  .app-shell[data-route="dashboard"] .gd-top-grid .gd-hero-actions { flex-wrap: wrap !important; }
}
'''
          Path('src/styles/teacher-dashboard-google-colorful.css').write_text(css, encoding='utf-8')
          PY

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit Dashboard refresh
        shell: bash
        run: |
          git config user.name "Brian CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/WorkDashboard.jsx src/styles/teacher-dashboard-google-colorful.css
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Dashboard with vivid Google Material styling"
          git push origin HEAD:main
