name: Fix Attendance Archive SQL Quote

on:
  push:
    branches:
      - 'feature/attendance-archive'
    paths:
      - 'scripts/fix-attendance-archive-sql-quote.mjs'
      - '.github/workflows/fix-attendance-archive-sql-quote.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attendance-archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix SQL dollar quoting
        run: node scripts/fix-attendance-archive-sql-quote.mjs
      - name: Commit SQL fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260914_attendance_archive.sql
          git commit -m "fix: repair archive finalizer SQL quoting"
          git push origin HEAD:feature/attendance-archive
