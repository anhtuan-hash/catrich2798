name: Student attendance reports
on:
  pull_request:
    paths:
      - 'src/components/attendance/StudentAttendanceReport.jsx'
      - 'src/components/attendance/StudentAttendanceReport.css'
      - 'src/components/attendance/StudentAttendanceReportTheme.css'
      - 'src/components/attendance/AttendanceMonthlyReport.jsx'
      - 'src/utils/studentAttendanceReport.js'
      - 'src/utils/studentAttendanceExport.js'
      - 'scripts/test-student-attendance-report.mjs'
      - 'scripts/test-student-report-visual-theme.mjs'
      - '.github/workflows/student-attendance-report.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-student-attendance-report.mjs
      - run: node scripts/test-student-report-visual-theme.mjs
      - run: node scripts/test-attendance-report-aggregation.mjs
      - run: node scripts/test-attendance-report-export.mjs
      - run: node scripts/test-attendance-report-supplemental-integration.mjs
      - run: npm run build
