name: Brian Instant Tools — Lucky Wheel Motion
on:
  pull_request:
    paths:
      - 'src/components/BrianInstantTools/BrianInstantTools.jsx'
      - 'src/components/BrianInstantTools/BrianInstantTools.css'
      - 'playwright.brian-wheel-motion.config.js'
      - 'tests/e2e/brian-wheel-visible-motion.spec.js'
      - '.github/workflows/brian-wheel-visible-motion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate existing Toolbox contracts
        run: node scripts/test-brian-instant-tools.mjs
      - name: Build production assets
        run: npx vite build
      - name: Install browser engines
        run: npx playwright install webkit
      - name: Check real wheel motion and fireworks in browsers
        run: npx playwright test --config=playwright.brian-wheel-motion.config.js --project=iphone-webkit
