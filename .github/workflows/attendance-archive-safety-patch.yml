name: Apply Attendance Archive Safety Patch

on:
  push:
    branches:
      - 'feature/attendance-archive'
    paths:
      - 'scripts/patch-attendance-archive-safety.mjs'
      - '.github/workflows/attendance-archive-safety-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attendance-archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic safety patch
        run: node scripts/patch-attendance-archive-safety.mjs
      - name: Commit migration safety changes
        run: |
          if git diff --quiet -- supabase/migrations/20260914_attendance_archive.sql; then
            echo "No migration patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260914_attendance_archive.sql
          git commit -m "fix: make archive permanent deletion two-phase"
          git push origin HEAD:feature/attendance-archive
