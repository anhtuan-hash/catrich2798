name: Apply Tardy Feature Patch

on:
  push:
    branches:
      - feat/attendance-tardy-status

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/attendance-tardy-status
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/patch_tardy_feature.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/attendancePostConfirmEditBootstrap.js src/utils/attendanceReport.js src/components/attendance/AttendanceMonthlyReport.jsx src/components/attendance/AttendanceMaterial3.css src/styles/AttendancePostConfirmEdit.css
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate tardy attendance across UI and reports"
          git push origin HEAD:feat/attendance-tardy-status
