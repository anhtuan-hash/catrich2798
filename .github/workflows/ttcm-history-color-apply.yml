name: Apply TTCM History Color Refinement

on:
  push:
    branches:
      - feat/ttcm-history-color-filters
    paths:
      - '.github/workflows/ttcm-history-color-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ttcm-history-color-filters
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply approved TTCM history refinement
        run: python scripts/apply-ttcm-history-color.py
      - name: Teacher history contract
        run: node scripts/test-ttcm-teacher-history.mjs
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ttcm-history-color-apply.yml scripts/apply-ttcm-history-color.py
          git add src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmTeacherHistory.css src/utils/ttcmTeacherHistory.js
          git commit -m "feat(ttcm): refine history filters and color states"
          git push origin HEAD:feat/ttcm-history-color-filters
