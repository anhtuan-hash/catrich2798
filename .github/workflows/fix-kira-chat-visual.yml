name: Fix Kira chat visual

on:
  push:
    branches:
      - fix/kira-chat-solid-panel-20260731

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply solid panel CSS fix
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/styles/SharedChatbotDrawer.css"
          MARKER="KIRA SOLID PANEL FIX 20260731"
          if grep -q "$MARKER" "$FILE"; then
            echo "Patch already applied."
            exit 0
          fi

          cat >> "$FILE" <<'CSS'

/* KIRA SOLID PANEL FIX 20260731
   Prevent the page hero and dashboard from bleeding through the chatbot,
   especially in Safari/WebKit while the opening animation is active. */
.bes-kira-chat-root,
.bes-kira-chat-root.is-open {
  opacity: 1 !important;
  filter: none !important;
  mix-blend-mode: normal !important;
}

.bes-kira-chat-root .bes-kira-chat-panel {
  opacity: 1 !important;
  background: #ffffff !important;
  background-color: #ffffff !important;
  background-image: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  animation: none !important;
  contain: paint;
}

.bes-kira-chat-root .bes-kira-chat-header {
  opacity: 1 !important;
  background: #ffffff !important;
  background-color: #ffffff !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  border-bottom: 1px solid #eef1f5 !important;
}

.bes-kira-chat-root .bes-kira-chat-messages {
  opacity: 1 !important;
  background: #f7f9fc !important;
  background-color: #f7f9fc !important;
}

.bes-kira-chat-root .bes-kira-chat-message.is-assistant .bes-kira-chat-bubble {
  padding: 12px 14px !important;
  border: 1px solid #e5e9ef !important;
  border-radius: 20px 20px 20px 8px !important;
  background: #ffffff !important;
  background-color: #ffffff !important;
  color: #253247 !important;
  box-shadow: 0 2px 8px rgba(31, 41, 55, .06) !important;
}

.bes-kira-chat-root .bes-kira-chat-suggestions button {
  opacity: 1 !important;
  background: #ffffff !important;
  background-color: #ffffff !important;
}

.bes-kira-chat-root .bes-kira-chat-composer {
  opacity: 1 !important;
  background: #ffffff !important;
  background-color: #ffffff !important;
  border-top: 1px solid #edf0f4 !important;
}

.bes-kira-chat-root .bes-kira-chat-input-wrap {
  opacity: 1 !important;
  background: #ffffff !important;
  background-color: #ffffff !important;
}
CSS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Fix opaque KiraAI chat panel"
          git push
