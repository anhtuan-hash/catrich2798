name: Brian learning reports verification
on:
  pull_request:
    paths:
      - 'src/features/learningReports/**'
      - 'src/pages/BrianTeamPortal.jsx'
      - 'src/components/GlobalWorkHubNotificationBridge.jsx'
      - 'src/components/GlobalReportsNavigationTab.jsx'
      - 'src/components/GlobalReportsNavigationTab.css'
      - 'src/utils/legacySiteTranslations.js'
      - 'supabase/migrations/20261027100000_learning_reports_gifted_remedial.sql'
      - 'scripts/test-learning-reports-contract.mjs'
      - 'scripts/test-learning-report-attendance-contract.mjs'
      - 'scripts/test-learning-report-instructor-scoping.mjs'
      - 'scripts/test-learning-reports-manager-analytics.mjs'
      - 'scripts/test-learning-report-navigation-countdown.mjs'
      - 'scripts/test-smart-learning-auto-assignment.mjs'
      - 'scripts/test-learning-report-dual-kind-campaign.mjs'
      - 'supabase/migrations/20261027155000_learning_reports_dual_kind_campaign_unique.sql'
      - 'scripts/test-revoke-learning-report-assignments.mjs'
      - 'scripts/test-learning-reports-unified-workspace.mjs'
      - 'scripts/test-learning-reports-macos-material3-design.mjs'
      - 'src/pages/BrianTeamPortal.css'
      - 'supabase/migrations/20261027153000_learning_report_bulk_revocation.sql'
      - 'supabase/migrations/20261027142000_revoke_learning_report_assignments.sql'
      - 'supabase/migrations/20261027130000_smart_learning_identity_preview.sql'
      - 'supabase/migrations/20261027130100_smart_candidates_uuid_aggregate.sql'
      - 'supabase/migrations/20261027131000_smart_learning_dispatch.sql'
      - 'supabase/migrations/20261027131100_smart_dispatch_event_immutable_guard.sql'
      - 'supabase/migrations/20261027131200_smart_identity_conflict_guard.sql'
      - 'supabase/migrations/20261027143000_learning_reports_manager_analytics.sql'
      - 'supabase/migrations/20261027143500_learning_report_deadline_rls_scope.sql'
      - 'supabase/migrations/20261027132000_learning_reports_instructor_scoped.sql'
      - 'supabase/migrations/20261027133000_learning_report_teacher_name_uniqueness.sql'
      - '.github/workflows/brian-learning-reports.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate report contracts
        run: node scripts/test-learning-reports-contract.mjs
      - name: Verify authoritative Attendance read-through
        run: node scripts/test-learning-report-attendance-contract.mjs
      - name: Verify per-instructor source attribution
        run: node scripts/test-learning-report-instructor-scoping.mjs
      - name: Check annual dashboard contracts and arithmetic
        run: node scripts/test-learning-reports-manager-analytics.mjs
      - name: Check shared navigation countdown for HSG and remedial requests
        run: node scripts/test-learning-report-navigation-countdown.mjs
      - name: Validate smart whole-team report assignment contracts
        run: node scripts/test-smart-learning-auto-assignment.mjs
      - name: Confirm teachers can receive both HSG and remedial reports in one campaign
        run: node scripts/test-learning-report-dual-kind-campaign.mjs
      - name: Verify safe revoke of teacher report assignments
        run: node scripts/test-revoke-learning-report-assignments.mjs
      - name: Verify unified workspace and safe select-all bulk actions
        run: node scripts/test-learning-reports-unified-workspace.mjs
      - name: Check macOS Material 3 visual system and protected operations
        run: node scripts/test-learning-reports-macos-material3-design.mjs
      - name: Validate report JSX syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const paths = ['src/features/learningReports/LearningReportsWorkspace.jsx',
            'src/features/learningReports/LearningReportsManagerDashboard.jsx',
            'src/features/learningReports/SmartAssignmentComposer.jsx',
            'src/features/learningReports/LearningAssignmentManager.jsx',
            'src/pages/BrianTeamPortal.jsx',
            'src/components/GlobalReportsNavigationTab.jsx'];
          const errors = paths.flatMap(path => {
            const result = ts.transpileModule(fs.readFileSync(path, 'utf8'), {
              fileName: path, reportDiagnostics: true,
              compilerOptions: { allowJs:true, jsx:ts.JsxEmit.ReactJSX, target:ts.ScriptTarget.ES2022 },
            });
            return (result.diagnostics || [])
              .filter(item => item.category === ts.DiagnosticCategory.Error)
              .map(item => ({
                path,
                line: fs.readFileSync(path, 'utf8').slice(0, item.start || 0).split('\n').length,
                message: ts.flattenDiagnosticMessageText(item.messageText, '\n'),
              }));
          });
          for (const item of errors) console.error(item.path + ':' + item.line + ': ' + item.message);
          if (errors.length) process.exit(1);
          console.log('PASS: JSX parsed and transpiled');
          NODE
      - name: Check JS syntax
        run: |
          node --check src/features/learningReports/learningReportsService.js
          node --check src/features/learningReports/learningReportsAnalytics.js
          node --check src/features/learningReports/navigationDeadlines.js
          node --check src/features/learningReports/learningAssignmentsModel.js
      - name: Bilingual UI audit
        run: npm run audit:i18n
      - name: Reproduce exact Vercel release build command
        run: node scripts/build-brian-vercel-release.mjs
