name: BRIAN Halloween Footer Admin Toggle QA
on:
  pull_request:
    paths:
      - 'src/components/Footer.jsx'
      - 'src/components/HalloweenFooterSkin.css'
      - 'src/components/HalloweenFooterRefinement.css'
      - 'docs/brian-seasonal-chrome-v3-spec.md'
      - 'scripts/test-halloween-chrome-v3.mjs'
      - 'src/utils/halloweenFooterTheme.js'
      - 'src/components/admin/HalloweenFooterAdminPanel*'
      - 'src/pages/Settings.jsx'
      - 'src/components/settings/SettingsLauncherHome.jsx'
      - 'supabase/migrations/*halloween_footer*'
      - 'public/assets/footer/halloween-night-footer.svg'
      - 'public/assets/footer/halloween-*-card.svg'
      - 'docs/halloween-footer-integrated-cards-spec.md'
      - 'scripts/test-halloween-footer*'
      - 'tests/fixtures/halloween-footer-test.*'
      - '.github/workflows/halloween-footer-admin-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  halloween-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Halloween chrome V3 shared palette and rollback scope
        run: node scripts/test-halloween-chrome-v3.mjs
      - name: Halloween footer security and scoped design assertions
        run: node scripts/test-halloween-footer.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test ON OFF restoring original footer in Chromium
        run: node scripts/test-halloween-footer-browser.mjs
      - name: Real Vercel production release build
        run: node scripts/build-brian-vercel-release.mjs
