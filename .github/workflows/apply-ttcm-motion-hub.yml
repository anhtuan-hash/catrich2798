name: Apply TTCM and Motion Hub update

on:
  push:
    paths:
      - '.github/workflows/apply-ttcm-motion-hub.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/patch-ttcm-motion-hub.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit source and remove one-time audit files
        run: |
          rm -f scripts/patch-ttcm-motion-hub.py
          rm -f .github/workflows/apply-ttcm-motion-hub.yml
          rm -f .github/workflows/audit-ttcm-motion-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmPersonnel.css src/utils/globalMotionSystem.js src/components/admin/GlobalMotionAdminPanel.jsx src/pages/Settings.jsx src/styles/GlobalMotionSystem.css src/styles/SettingsGoogleM3.css scripts/patch-ttcm-motion-hub.py .github/workflows/apply-ttcm-motion-hub.yml .github/workflows/audit-ttcm-motion-settings.yml
          git commit -m "Default TTCM to action items and unify motion navigation settings"
          git push
