name: Attendance Quick Roster Layout Repair
on:
  pull_request:
    paths:
      - 'src/pages/AttendanceWorkspace.jsx'
      - 'src/pages/AttendanceQuickLayoutFix.css'
      - 'scripts/test-attendance-quick-layout-fix.mjs'
      - 'tests/e2e/attendance-quick-layout-fix.spec.js'
      - '.github/workflows/attendance-quick-layout-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roster-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-attendance-quick-layout-fix.mjs
      - run: node scripts/test-attendance-standalone-route.mjs
      - run: node scripts/test-attendance-rebuilt-ui.mjs
      - run: node scripts/test-attendance-tardy-status.mjs
      - run: node scripts/test-attendance-report-export.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/attendance-quick-layout-fix.spec.js tests/e2e/attendance-standalone-workspace.spec.js --project=chromium-desktop --project=webkit-desktop
