name: Apply Attendance Material3 Reporting Patch

on:
  push:
    branches:
      - feat/attendance-material3-reports
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/attendance-material3-reports
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/patch-attendance-material3-reporting.py

      - name: Commit focused patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx
          git commit -m "feat: wire Material 3 attendance reporting"
          git push origin HEAD:feat/attendance-material3-reports
