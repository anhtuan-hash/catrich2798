name: Finalize Attendance Report No Logo

on:
  push:
    branches:
      - fix/remove-attendance-report-logo

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-attendance-report-logo
          fetch-depth: 0
      - name: Remove report logo and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/utils/attendanceReportExport.js')
          text = path.read_text()

          text = text.replace("import schoolLogoUrl from '../assets/petrus-ky-school-logo.png';\n", '', 1)

          text, count = re.subn(
              r"\nasync function waitForImageReady\(image\) \{.*?\n\}\n\nasync function buildPrintSafeSchoolLogoDataUrl\(\) \{.*?\n\}\n\nfunction waitForPrintWindowLoad",
              "\nfunction waitForPrintWindowLoad",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('logo helper block not found exactly once')

          text = text.replace("  const printSafeLogoUrl = await buildPrintSafeSchoolLogoDataUrl();\n", '', 1)

          css_pattern = re.compile(
              r"\.school-head\{.*?\}\.school-logo-box\{.*?\}\.school-head img\{.*?\}\.school-head__text\{.*?\}\.school-head__text b\{.*?\}\.school-head__text strong\{.*?\}\.school-head__spacer\{.*?\}\.report-title\{",
              re.S,
          )
          replacement = ".school-head{border-bottom:2px solid #0b6b3a;padding:0 0 3mm;margin-bottom:3mm;text-align:center}.school-head__text{text-align:center;min-width:0}.school-head__text b{display:block;font-size:9.7px;letter-spacing:.02em}.school-head__text strong{display:block;font-size:11.5px;margin-top:3px;color:#0b6b3a}.report-title{"
          text, count = css_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('logo/header CSS block not found exactly once')

          old_markup = '<div class="school-head"><div class="school-logo-box"><img data-report-school-logo src="${htmlEscape(printSafeLogoUrl)}" alt="Logo Pétrus Ký"></div><div class="school-head__text"><b>SỞ GIÁO DỤC VÀ ĐÀO TẠO THÀNH PHỐ HỒ CHÍ MINH</b><strong>TRƯỜNG TRUNG - TIỂU HỌC PÉTRUS KÝ</strong></div><span class="school-head__spacer" aria-hidden="true"></span></div>'
          new_markup = '<div class="school-head"><div class="school-head__text"><b>SỞ GIÁO DỤC VÀ ĐÀO TẠO THÀNH PHỐ HỒ CHÍ MINH</b><strong>TRƯỜNG TRUNG - TIỂU HỌC PÉTRUS KÝ</strong></div></div>'
          if old_markup not in text:
              raise SystemExit('logo markup not found')
          text = text.replace(old_markup, new_markup, 1)

          text = text.replace("  await waitForImageReady(popup.document.querySelector('[data-report-school-logo]'));\n", '', 1)

          path.write_text(text)
          PY

          rm -f .github/workflows/attendance-report-no-logo-red.yml
          rm -f .github/workflows/attendance-report-no-logo-finalize.yml

          node scripts/test-attendance-report-export.mjs
          node scripts/test-attendance-material3-ui.mjs
          npm ci --ignore-scripts
          npm run build

          git add src/utils/attendanceReportExport.js scripts/test-attendance-report-export.mjs .github/workflows/attendance-report-no-logo-red.yml .github/workflows/attendance-report-no-logo-finalize.yml
          git commit -m "fix: remove logo from attendance PDF report"
          git push origin HEAD:fix/remove-attendance-report-logo
