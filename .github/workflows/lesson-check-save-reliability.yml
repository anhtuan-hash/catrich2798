name: Lesson Check Save Reliability
on:
  pull_request:
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/pages/LessonCheckApprovedMockupOne.css'
      - 'tests/lesson-check-save-reliability.test.mjs'
      - 'tests/e2e/lesson-check-save-feedback.spec.js'
      - '.github/workflows/lesson-check-save-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/pages/LessonCheckApprovedMockupOne.css'
      - 'tests/lesson-check-save-reliability.test.mjs'
      - 'tests/e2e/lesson-check-save-feedback.spec.js'
jobs:
  validation:
    name: Save flow contracts & build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/lesson-check-save-reliability.test.mjs
      - run: node --test tests/lesson-check-approved-mockup-1.test.mjs
      - run: node --test tests/assessment-5-contract.test.mjs
      - run: npm run build
  browser:
    name: Browser save validation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/lesson-check-save-feedback.spec.js --project=chromium-desktop
