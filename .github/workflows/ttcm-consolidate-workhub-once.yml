name: TTCM consolidate Work Hub once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ttcm-consolidate-workhub-once.yml'

permissions:
  contents: write

jobs:
  migrate-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply TTCM consolidation
        run: python .github/scripts/retire_workhub_into_ttcm.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit verified migration
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add src/main.jsx src/data/apps.js src/components/GlobalFlatNavigation.jsx src/components/GlobalWorkScheduleCenter.jsx src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmNavigationTab.css src/pages/WorkDashboard.jsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor(ttcm): consolidate Work Hub into TTCM"
          git push origin HEAD:main
