name: One-time fix personnel add degree

on:
  push:
    branches:
      - codex/fix-personnel-add-degree

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-personnel-add-degree
          fetch-depth: 0

      - name: Patch degree editor state handling
        run: |
          python - <<'PY'
          from pathlib import Path

          component_path = Path('src/components/PersonnelLookup.jsx')
          component = component_path.read_text()
          old = "  const setDegrees = (nextDegrees) => setDraft(cleanPersonnelRecord({ ...draft, degrees: nextDegrees }));"
          new = "  const setDegrees = (nextDegrees) => setDraft((current) => ({ ...current, degrees: nextDegrees }));"
          if old not in component:
              raise SystemExit('Expected DegreeEditor setDegrees implementation was not found')
          component_path.write_text(component.replace(old, new, 1))

          audit_path = Path('scripts/audit-personnel-multiple-degrees.mjs')
          audit = audit_path.read_text()
          anchor = "  ['add degree action', /t\\.addDegree/.test(component)],\n"
          regression = "  ['draft degree retained before save', /setDraft\\(\\(current\\)\\s*=>\\s*\\(\\{\\s*\\.\\.\\.current,\\s*degrees:\\s*nextDegrees\\s*\\}\\)\\)/.test(component)],\n"
          if regression not in audit:
              if anchor not in audit:
                  raise SystemExit('Audit insertion point was not found')
              audit = audit.replace(anchor, anchor + regression, 1)
              audit_path.write_text(audit)

          Path('.github/workflows/one-time-fix-personnel-add-degree.yml').unlink()
          PY

      - name: Verify regression audit
        run: node scripts/audit-personnel-multiple-degrees.mjs

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix add degree draft state" 
          git push origin HEAD:codex/fix-personnel-add-degree
