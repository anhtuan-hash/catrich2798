name: Verify attendance manage unified pane

on:
  pull_request:
    paths:
      - 'src/components/GlobalAttendanceNavigationTab.css'
      - 'src/components/attendance/AttendanceClassEditor.css'
      - 'public/attendance-ui-polish.css'
      - 'public/attendance-windows8-launch.css'
      - 'index.html'
      - 'tests/e2e/attendance-manage-independent-scroll.spec.js'
      - 'scripts/test-attendance-manage-unified-pane.mjs'
      - 'scripts/test-attendance-manage-source-scroll.mjs'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-owned Manage contracts
        run: node scripts/test-attendance-manage-unified-pane.mjs && node scripts/test-attendance-manage-source-scroll.mjs
