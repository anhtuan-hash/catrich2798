name: Attendance Global Permission

on:
  pull_request:
    paths:
      - 'src/attendanceTimeAccessBootstrap.js'
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/utils/attendanceTimeAccess.js'
      - 'src/utils/permissions.js'
      - 'supabase/migrations/*attendance*.sql'
      - 'scripts/test-attendance-global-permission.mjs'
      - '.github/workflows/attendance-global-permission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify global all-class attendance permission
        run: node scripts/test-attendance-global-permission.mjs
