name: TTCM Scrapbook
on:
  pull_request:
    paths:
      - 'src/features/ttcm-scrapbook/**'
      - 'src/utils/createScrapbookTheme.js'
      - 'src/components/GlobalTtcmNavigationTab.jsx'
      - 'src/pages/Settings.jsx'
      - 'public/assets/ttcm-scrapbook/**'
      - 'supabase/migrations/*ttcm_scrapbook*'
      - 'scripts/test-ttcm-scrapbook-browser.mjs'
      - 'tests/fixtures/ttcm-scrapbook.jsx'
      - '.github/workflows/ttcm-scrapbook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-ttcm-scrapbook-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttcm-scrapbook-screens
          path: test-results/ttcm-scrapbook/
