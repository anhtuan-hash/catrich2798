name: Apply Egress V3 Source Patch

on:
  push:
    branches:
      - feat/egress-hardening-v3-webp-homeroom
    paths:
      - scripts/apply-egress-v3.mjs
      - .github/workflows/apply-egress-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/egress-hardening-v3-webp-homeroom
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source changes
        run: node scripts/apply-egress-v3.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check src/utils/weeklyPractice.js
          node --check src/utils/homeroomPhase2.js

      - name: Remove one-shot updater
        run: rm -f scripts/apply-egress-v3.mjs .github/workflows/apply-egress-v3.yml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/weeklyPractice.js src/utils/homeroomPhase2.js src/pages/HomeroomWorkspace.jsx scripts/apply-egress-v3.mjs .github/workflows/apply-egress-v3.yml
          git commit -m "Apply low-risk Supabase egress hardening v3"
          git push origin HEAD:feat/egress-hardening-v3-webp-homeroom
