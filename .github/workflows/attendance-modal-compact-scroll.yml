name: Attendance Modal Compact Scroll

on:
  push:
    branches:
      - fix/attendance-modal-compact-scroll
      - fix/attendance-modal-size-history-standard
      - fix/attendance-typography-history-standard
      - fix/attendance-mobile-modal-frame
      - fix/attendance-mobile-inner-layout
      - fix/attendance-history-mobile-list-first
      - fix/attendance-history-mobile-bottom-sheet
      - fix/attendance-history-mobile-polish
  pull_request:
    paths:
      - 'public/attendance-windows8-launch.css'
      - 'public/attendance-history-mockup-v4.css'
      - 'public/attendance-history-v5.css'
      - 'public/attendance-history-v5.js'
      - 'public/attendance-history-mobile-bottom-sheet.css'
      - 'public/attendance-history-pixel-v6.css'
      - 'public/attendance-card-size-sync-v1.css'
      - 'src/components/GlobalAttendanceNavigationTab.css'
      - 'src/components/GlobalAttendanceNavigationTab.jsx'
      - 'src/components/attendance/AttendanceClassManagementWorkspace.css'
      - 'scripts/test-attendance-modal-compact-scroll.mjs'
      - 'scripts/test-attendance-history-mobile-polish.mjs'
      - 'scripts/test-attendance-typography-parity.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: History enhancer syntax
        run: node --check public/attendance-history-v5.js
      - name: History-sized modal scroll contract
        run: node scripts/test-attendance-modal-compact-scroll.mjs
      - name: History mobile polish contract
        run: node scripts/test-attendance-history-mobile-polish.mjs
      - name: History typography parity contract
        run: node scripts/test-attendance-typography-parity.mjs
