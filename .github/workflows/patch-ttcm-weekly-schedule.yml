name: Patch TTCM weekly schedule

on:
  push:
    paths:
      - '.github/workflows/patch-ttcm-weekly-schedule.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply weekly schedule patch
        run: node scripts/patch-ttcm-weekly-schedule.mjs

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit patched source and remove one-time files
        run: |
          rm -f scripts/patch-ttcm-weekly-schedule.mjs
          rm -f .github/workflows/patch-ttcm-weekly-schedule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalWorkScheduleCenter.jsx src/components/GlobalWorkScheduleCenter.css scripts/patch-ttcm-weekly-schedule.mjs .github/workflows/patch-ttcm-weekly-schedule.yml
          git commit -m "Show TTCM schedule by current week" || exit 0
          git push
