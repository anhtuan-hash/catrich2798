name: World Explorer Vite Compile
on:
  pull_request:
    paths:
      - 'src/features/world-explorer/**'
      - 'src/pages/HomeApproved.jsx'
      - 'src/components/mobile/MobileHomeView.jsx'
      - '.github/workflows/world-explorer-compile.yml'
      - 'scripts/test-world-explorer-inline-drawer.mjs'
      - 'scripts/test-world-explorer-hourly-auto.mjs'
      - 'supabase/functions/world-explorer-hourly/**'
      - 'supabase/migrations/*world_explorer_hourly*.sql'
  push:
    branches:
      - feat/world-explorer-20261030
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify World Explorer drawer and reader behavior contracts
        run: node scripts/test-world-explorer-inline-drawer.mjs
      - name: Validate autonomous hourly articles and licensing
        run: node scripts/test-world-explorer-hourly-auto.mjs
      - name: Compile the production bundle directly
        run: npx vite build
