name: TTCM Reader UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/GlobalTtcmNavigationTab.jsx'
      - 'src/components/TtcmAssignmentEventPopup.jsx'
      - 'src/utils/ttcmAssignmentEvents.mjs'
      - 'scripts/test-ttcm-assignment-events.mjs'
      - 'src/components/GlobalTtcmTeacherReaderV2.css'
      - 'scripts/test-ttcm-reader-two-column-ui.mjs'
      - '.github/workflows/ttcm-reader-ui.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TTCM reader two-column contract
        run: node scripts/test-ttcm-reader-two-column-ui.mjs
      - name: TTCM assignment events recipient isolation
        run: node scripts/test-ttcm-assignment-events.mjs
      - name: Production build
        run: npm run build
