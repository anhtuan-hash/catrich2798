name: World Explorer Learning Verification
on:
  push:
    branches: [main]
    paths:
      - 'src/features/world-explorer/**'
      - 'scripts/test-world-explorer-learning.mjs'
      - 'supabase/migrations/*world_explorer*'
      - '.github/workflows/world-explorer-learning.yml'
  pull_request:
    paths:
      - 'src/features/world-explorer/**'
      - 'scripts/test-world-explorer-learning.mjs'
      - 'supabase/migrations/*world_explorer*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test World Explorer Learning contracts
        run: node scripts/test-world-explorer-learning.mjs
      - name: Test existing hourly publishing
        run: node scripts/test-world-explorer-hourly-auto.mjs
      - name: Test existing inline reader
        run: node scripts/test-world-explorer-inline-drawer.mjs
      - name: Compile frontend
        run: npx vite build
