name: Apply TTCM History Usability Polish

on:
  push:
    branches:
      - feat/ttcm-history-usability-polish
    paths:
      - '.github/workflows/ttcm-history-usability-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ttcm-history-usability-polish
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply approved TTCM history polish
        run: python scripts/apply-ttcm-history-usability.py
      - name: Teacher history contract
        run: node scripts/test-ttcm-teacher-history.mjs
      - name: Teacher history usability contract
        run: node scripts/test-ttcm-history-usability.mjs
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmTeacherHistory.css src/components/GlobalTtcmPersonnel.css
          git commit -m 'feat(ttcm): polish history usability' || exit 0
          git push origin HEAD:feat/ttcm-history-usability-polish
