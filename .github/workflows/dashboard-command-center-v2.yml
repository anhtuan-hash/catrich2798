name: BRIAN Dashboard Editorial Restoration Gate
on:
  push:
    branches:
      - main
      - restore/dashboard-editorial-20261010-20261023
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify restored dashboard contract
        run: TZ=Asia/Ho_Chi_Minh node scripts/test-dashboard-editorial-restore-20261010.mjs
      - name: Gradebook and homeroom non-interference tests
        run: |
          node scripts/test-gradebook-mock-exams.mjs
          node scripts/test-gradebook-mock-exams-v2.mjs
          node scripts/test-homeroom-assignment-entry.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Restored dashboard desktop and mobile smoke tests
        run: npx playwright test tests/e2e/dashboard-editorial-restore-20261010.spec.js --project=chromium-desktop
