name: BRIAN Dashboard 3.1 Release Gate
on:
  push:
    branches:
      - feat/dashboard-command-center-20261012
      - feat/dashboard-2-1-accuracy-20261012
      - feat/dashboard-2-2-insights-20261012
      - feat/dashboard-2-3-personal-layout-20261012
      - feat/dashboard-3-command-center-20261012
      - feat/dashboard-3-1-focus-search-theme-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Dashboard regression tests
        run: |
          node scripts/test-dashboard-command-center-v2.mjs
          node scripts/test-dashboard-drop-zone.mjs
          TZ=Asia/Ho_Chi_Minh node scripts/test-dashboard-command-center-v21.mjs
          TZ=Asia/Ho_Chi_Minh node scripts/test-dashboard-command-center-v22.mjs
          TZ=America/New_York node scripts/test-dashboard-command-center-v22.mjs
          node scripts/test-dashboard-command-center-v23.mjs
          TZ=Asia/Ho_Chi_Minh node scripts/test-dashboard-v3.mjs
          TZ=Asia/Ho_Chi_Minh node scripts/test-dashboard-v31.mjs
      - name: Gradebook non-interference tests
        run: |
          node scripts/test-gradebook-mock-exams.mjs
          node scripts/test-gradebook-mock-exams-v2.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Interactive dashboard smoke tests
        run: npx playwright test tests/e2e/dashboard-command-center-v2.spec.js --project=chromium-desktop
