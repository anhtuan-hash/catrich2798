name: Editorial dashboard hero rebuild

on:
  push:
    paths:
      - '.github/workflows/editorial-dashboard-hero-rebuild.yml'
      - 'scripts/rebuild-dashboard-editorial-hero.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild hero from zero
        run: node scripts/rebuild-dashboard-editorial-hero.mjs

      - name: Normalize generated JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/WorkDashboard.jsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\\`', '`').replace('\\${', '${')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate legacy hero removal
        shell: bash
        run: |
          if grep -q 'teacher-dashboard-hero-interactive-2026.css' src/pages/WorkDashboard.jsx; then
            echo 'Legacy hero stylesheet is still imported.' >&2
            exit 1
          fi
          if grep -q 'className="dash-hero"' src/pages/WorkDashboard.jsx; then
            echo 'Legacy dash-hero markup remains.' >&2
            exit 1
          fi
          if grep -q '\\`' src/pages/WorkDashboard.jsx; then
            echo 'Escaped template literals remain in generated JSX.' >&2
            exit 1
          fi
          test -f src/styles/teacher-dashboard-editorial-hero.css
          test ! -f src/styles/teacher-dashboard-hero-interactive-2026.css

      - name: Production build
        run: npm run build

      - name: Commit rebuilt hero
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WorkDashboard.jsx src/styles/teacher-dashboard-editorial-hero.css
          git add -u src/styles/teacher-dashboard-hero-interactive-2026.css || true
          git rm --ignore-unmatch scripts/rebuild-dashboard-editorial-hero.mjs .github/workflows/editorial-dashboard-hero-rebuild.yml
          git commit -m 'feat: rebuild dashboard hero in editorial style'
          git push origin HEAD:main
