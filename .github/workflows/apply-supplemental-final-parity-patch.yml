name: Apply supplemental final parity patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-supplemental-final-parity-patch.py'
      - '.github/workflows/apply-supplemental-final-parity-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/supplemental-final-parity-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-supplemental-final-parity-patch.py
      - name: Commit frontend parity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/attendancePostConfirmEditBootstrap.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat: complete supplemental shared attendance parity"
          git push origin HEAD:${{ github.head_ref }}
