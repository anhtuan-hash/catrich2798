name: Apply Attendance History Polish V2

on:
  push:
    branches:
      - fix/attendance-history-polish-v2
    paths:
      - scripts/apply-attendance-history-polish-v2.py
      - .github/workflows/apply-attendance-history-polish-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/attendance-history-polish-v2
          fetch-depth: 0
      - name: Apply focused history polish patch
        run: python scripts/apply-attendance-history-polish-v2.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit generated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/components/attendance/AttendanceHistoryV2.css
          git commit -m "fix: polish attendance history production layout"
          git push origin HEAD:fix/attendance-history-polish-v2
