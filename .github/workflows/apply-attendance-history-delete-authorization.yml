name: Apply attendance history delete authorization

on:
  push:
    branches:
      - fix/attendance-history-delete-authorization
    paths:
      - .github/workflows/apply-attendance-history-delete-authorization.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authorization branch
        uses: actions/checkout@v4
        with:
          ref: fix/attendance-history-delete-authorization
          fetch-depth: 0

      - name: Apply frontend authorization guards
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('src/components/GlobalAttendanceNavigationTab.jsx')
          app = app_path.read_text()

          anchor = "  const canAccessAttendanceView = (tabId) => isAttendanceAdmin || hasAttendanceTabAccess(currentUser, tabId);"
          capability = "  const canDeleteAttendanceHistory = isAttendanceAdmin || String(currentUser?.email || '').trim().toLowerCase() === 'hongtham@accounts.brianenglish.studio';"
          if capability not in app:
              if anchor not in app:
                  raise SystemExit('Attendance access capability anchor not found')
              app = app.replace(anchor, anchor + '\n' + capability, 1)

          old_single_guard = "  async function deleteAttendanceSession(session) {\n    if (!session || busy || !client) return;"
          new_single_guard = "  async function deleteAttendanceSession(session) {\n    if (!session || busy || !client || !canDeleteAttendanceHistory) return;"
          if old_single_guard in app:
              app = app.replace(old_single_guard, new_single_guard, 1)
          elif new_single_guard not in app:
              raise SystemExit('Single-session delete guard marker not found')

          old_bulk_guard = "  async function deleteSelectedHistorySessions() {\n    if (!selectedHistorySessionIds.length || busy || !client) return;"
          new_bulk_guard = "  async function deleteSelectedHistorySessions() {\n    if (!selectedHistorySessionIds.length || busy || !client || !canDeleteAttendanceHistory) return;"
          if old_bulk_guard in app:
              app = app.replace(old_bulk_guard, new_bulk_guard, 1)
          elif new_bulk_guard not in app:
              raise SystemExit('Bulk delete guard marker not found')

          old_bulk_button = "{canAccessAttendanceView('quick') ? <button type=\"button\" className={historySelectionMode ? 'is-active' : ''} disabled={busy} onClick={toggleHistorySelectionMode}>"
          new_bulk_button = "{canDeleteAttendanceHistory ? <button type=\"button\" className={historySelectionMode ? 'is-active' : ''} disabled={busy} onClick={toggleHistorySelectionMode}>"
          if old_bulk_button in app:
              app = app.replace(old_bulk_button, new_bulk_button, 1)
          elif new_bulk_button not in app:
              raise SystemExit('Bulk history selection button marker not found')

          old_delete_button = "{canAccessAttendanceView('quick') ? <button type=\"button\" className=\"ahv3__delete-button\" disabled={busy} onClick={() => deleteAttendanceSession(selectedSession)}>"
          new_delete_button = "{canDeleteAttendanceHistory ? <button type=\"button\" className=\"ahv3__delete-button\" disabled={busy} onClick={() => deleteAttendanceSession(selectedSession)}>"
          if old_delete_button in app:
              app = app.replace(old_delete_button, new_delete_button, 1)
          elif new_delete_button not in app:
              raise SystemExit('Single history delete button marker not found')

          app_path.write_text(app)

          permissions_path = Path('src/utils/permissions.js')
          permissions = permissions_path.read_text()
          old_desc = "    desc: 'Take attendance, cancel a class session, and reopen a locked attendance day.',\n    descVi: 'Điểm danh, hủy buổi học và xóa buổi điểm danh đã chốt để mở lại ngày.',"
          new_desc = "    desc: 'Take attendance and cancel a class session.',\n    descVi: 'Điểm danh và hủy buổi học.',"
          if old_desc in permissions:
              permissions = permissions.replace(old_desc, new_desc, 1)
          elif new_desc not in permissions:
              raise SystemExit('Quick-attendance permission description marker not found')
          permissions_path.write_text(permissions)
          PY

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify delete authorization contract
        run: node scripts/test-attendance-history-delete-authorization.mjs

      - name: Verify existing history behavior
        run: node scripts/test-attendance-history-functional-guard.mjs

      - name: Build frontend
        run: npm run build

      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/apply-attendance-history-delete-authorization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/utils/permissions.js .github/workflows/apply-attendance-history-delete-authorization.yml
          git diff --cached --quiet || git commit -m "Restrict attendance history deletion controls"
          git push origin HEAD:fix/attendance-history-delete-authorization
