name: Apply apps flat two-column V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-apps-flat-two-column-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install apps flat two-column V4 patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Disable grouped app directory rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/WebAppsRedesign.jsx')
          text = path.read_text()
          old = "  const showGroupedDirectory = !editMode && activeGroup === 'all' && !normalizedSearch;"
          new = "  const showGroupedDirectory = false;"
          if old not in text:
              raise SystemExit('Expected grouped directory line not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "Brian UI Bot"
          git config user.email "brian-ui-bot@users.noreply.github.com"
          git add src/pages/WebAppsRedesign.jsx
          git commit -m "Render apps as one ungrouped two-column directory"
          git push origin main