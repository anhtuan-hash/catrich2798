name: Apply Attendance PDF Tardy Patch

on:
  push:
    branches:
      - feat/attendance-pdf-late-students
    paths:
      - scripts/apply-attendance-pdf-late-patch.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/attendance-pdf-late-students
          fetch-depth: 0

      - name: Apply source patch
        if: ${{ hashFiles('scripts/apply-attendance-pdf-late-patch.py') != '' }}
        run: python scripts/apply-attendance-pdf-late-patch.py

      - name: Commit patched sources
        if: ${{ hashFiles('scripts/apply-attendance-pdf-late-patch.py') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/attendanceReport.js src/utils/attendanceReportExport.js scripts/test-attendance-report-export.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: show tardy students in attendance PDF"
          git push origin HEAD:feat/attendance-pdf-late-students
