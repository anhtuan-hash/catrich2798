name: Attendance Report No Logo RED

on:
  push:
    branches:
      - fix/remove-attendance-report-logo

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-attendance-report-logo
      - name: Run no-logo regression contract
        run: node scripts/test-attendance-report-export.mjs
