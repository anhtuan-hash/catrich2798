name: Brian motion source cleanup once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/motion-source-cleanup-once.py'
      - '.github/workflows/motion-source-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Strip presentation motion from source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/motion-source-cleanup-once.py

      - name: Build static application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit cleaned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes were required.'
            exit 0
          fi
          git commit -m 'chore(motion): strip legacy presentation motion from source'
          git push origin HEAD:main
