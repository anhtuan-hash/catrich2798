name: Halloween Full-Home V4 — mockup fidelity gates
on:
  pull_request:
    paths:
      - 'src/styles/HalloweenFullHomeV4.css'
      - 'src/utils/halloweenHomeTheme.js'
      - 'src/components/admin/HalloweenHomeAdminPanel*'
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/mobile/MobileAppShell.jsx'
      - 'src/components/HomePublishedSlideshow.jsx'
      - 'src/components/Footer.jsx'
      - 'src/pages/Home.jsx'
      - 'src/pages/Settings.jsx'
      - 'supabase/migrations/*halloween_home_master_v4*'
      - 'docs/brian-halloween-home-v4-acceptance-spec.md'
      - 'scripts/test-halloween-home-v4*'
      - 'tests/fixtures/halloween-home-v4.*'
      - '.github/workflows/halloween-home-v4-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity:
    name: G01–G07 mockup gates and original-theme restoration
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate all seven mockup gates and server permission scope
        run: node scripts/test-halloween-home-v4.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture ON/OFF desktop/mobile evidence and layout regression
        run: node scripts/test-halloween-home-v4-browser.mjs
      - name: Publish screenshots for visual mockup comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halloween-v4-desktop-mobile-before-after
          path: artifacts/halloween-home-v4/
          if-no-files-found: warn
      - name: Actual Vercel production release build
        run: node scripts/build-brian-vercel-release.mjs
