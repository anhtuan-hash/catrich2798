name: Brian Wheel Studio — UI and Logic UAT
on:
  pull_request:
    paths:
      - 'src/components/BrianInstantTools/**'
      - 'scripts/test-wheel-studio.mjs'
      - 'tests/e2e/brian-wheel-studio.spec.js'
      - 'tests/e2e/brian-powerup-wheel.spec.js'
      - 'scripts/test-brian-powerups-50.mjs'
      - 'playwright.brian-wheel-studio.config.js'
      - '.github/workflows/brian-wheel-studio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-brian-instant-tools.mjs && node scripts/test-wheel-studio.mjs && node scripts/test-brian-powerups-50.mjs
      - run: npx vite build
  desktop-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test --config=playwright.brian-wheel-studio.config.js --project=desktop-chromium
  safari-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config=playwright.brian-wheel-studio.config.js --project=iphone-webkit
