name: Gradebook Colorful Material 3 Safety
on:
  pull_request:
    paths:
      - 'src/pages/GradebookStudio.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookWorkspace.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'public/gradebook-material3-hero.svg'
      - 'tests/gradebook-material3-colorful.test.mjs'
      - '.github/workflows/gradebook-material3-colorful.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/GradebookStudio.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookWorkspace.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'public/gradebook-material3-hero.svg'
      - 'tests/gradebook-material3-colorful.test.mjs'
jobs:
  gradebook-material3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Colorful Material 3 UI and existing scoring workflow contracts
        run: |
          node --test tests/gradebook-material3-colorful.test.mjs tests/gradebook-academic-workspace.test.mjs tests/gradebook-permanent-palette.test.mjs tests/gradebook-visual-defects.test.mjs tests/gradebook-approved-v2.test.mjs tests/gradebook-approved-mockup-4.test.mjs
          node scripts/test-gradebook-colorful-hero-v1.mjs
          node scripts/test-gradebook-colorful-workspace-v1.mjs
          node scripts/test-gradebook-migration-state.mjs
      - name: Production build
        run: npm run build
      - name: Install browser for real table geometry checks
        run: npx playwright install --with-deps chromium
      - name: Regression across phone, tablet and desktop with 42 columns
        run: npx playwright test tests/e2e/gradebook-academic-geometry.spec.js tests/e2e/gradebook-permanent-palette.spec.js tests/e2e/gradebook-visual-defects.spec.js --project=chromium-desktop
