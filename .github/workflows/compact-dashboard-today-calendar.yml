name: Compact dashboard today calendar

on:
  push:

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refactor dashboard calendar to today only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          page = Path('src/pages/WorkDashboard.jsx')
          s = page.read_text()

          replacements = {
            "calendar: 'Lịch làm việc tuần này', calendarSummary: '7 ngày gần nhất · Không hiển thị tiết dạy',": "calendar: 'Lịch hôm nay', calendarSummary: 'Công việc và sự kiện trong ngày hôm nay',",
            "calendar: 'This week', calendarSummary: 'Next 7 days · Teaching periods are hidden',": "calendar: 'Today schedule', calendarSummary: 'Work and events scheduled for today',",
            "  const [selectedDay, setSelectedDay] = useState(() => dateKey(new Date()));\n": "",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected source fragment: {old[:80]}')
            s = s.replace(old, new, 1)

          old_logic = """  const timeline = useMemo(() => (snapshot.timeline || []).filter((item) => !isTeachingPeriod(item)).sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime()), [snapshot.timeline]);
  const calendarDays = useMemo(() => Array.from({ length: 7 }, (_, index) => {
    const date = new Date(); date.setHours(0, 0, 0, 0); date.setDate(date.getDate() + index);
    const key = dateKey(date); return { date, key, events: timeline.filter((item) => dateKey(item.date) === key) };
  }), [timeline]);
  const selectedCalendarDay = useMemo(() => calendarDays.find((day) => day.key === selectedDay) || calendarDays[0], [calendarDays, selectedDay]);
  const selectedEvents = selectedCalendarDay?.events || [];
  const name = currentUser?.name || currentUser?.full_name || currentUser?.email?.split('@')[0] || t.teacher;
  const locale = language === 'vi' ? 'vi-VN' : 'en-US';
  const todayKey = dateKey(new Date());
  const selectedWeekday = selectedCalendarDay ? new Intl.DateTimeFormat(locale, { weekday: 'long' }).format(selectedCalendarDay.date) : '';
  const selectedDate = selectedCalendarDay ? new Intl.DateTimeFormat(locale, { day: '2-digit', month: 'long', year: 'numeric' }).format(selectedCalendarDay.date) : '';
  const calendarRange = calendarDays.length ? `${new Intl.DateTimeFormat(locale, { day: '2-digit', month: 'short' }).format(calendarDays[0].date)} — ${new Intl.DateTimeFormat(locale, { day: '2-digit', month: 'short', year: 'numeric' }).format(calendarDays[calendarDays.length - 1].date)}` : '';
"""
          new_logic = """  const timeline = useMemo(() => (snapshot.timeline || []).filter((item) => !isTeachingPeriod(item)).sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime()), [snapshot.timeline]);
  const name = currentUser?.name || currentUser?.full_name || currentUser?.email?.split('@')[0] || t.teacher;
  const locale = language === 'vi' ? 'vi-VN' : 'en-US';
  const todayKey = dateKey(now);
  const todayDate = useMemo(() => {
    const value = new Date(now);
    value.setHours(0, 0, 0, 0);
    return value;
  }, [todayKey]);
  const todayEvents = useMemo(() => timeline.filter((item) => dateKey(item.date) === todayKey), [timeline, todayKey]);
  const todayWeekday = new Intl.DateTimeFormat(locale, { weekday: 'long' }).format(todayDate);
  const todayDateLabel = new Intl.DateTimeFormat(locale, { day: '2-digit', month: 'long', year: 'numeric' }).format(todayDate);
"""
          if old_logic not in s:
            raise SystemExit('Could not locate calendar logic block')
          s = s.replace(old_logic, new_logic, 1)

          old_focus = """  const focusNearestEvent = () => {
    if (nextEvent?.date) setSelectedDay(dateKey(nextEvent.date));
    scrollToCalendar();
  };
  const focusToday = () => {
    setSelectedDay(todayKey);
    scrollToCalendar();
  };
"""
          new_focus = """  const focusNearestEvent = () => {
    if (nextEvent?.date && dateKey(nextEvent.date) !== todayKey) {
      openTtcm('schedule');
      return;
    }
    scrollToCalendar();
  };
  const focusToday = () => scrollToCalendar();
"""
          if old_focus not in s:
            raise SystemExit('Could not locate calendar focus handlers')
          s = s.replace(old_focus, new_focus, 1)

          pattern = re.compile(r'''      <article className="gd-calendar gd-calendar-split" id="dashboard-calendar">.*?      </article>\n      <DashboardNewsHub''', re.S)
          replacement = '''      <article className="gd-calendar gd-calendar-today" id="dashboard-calendar">
        <header className="gd-calendar-header"><div className="gd-calendar-title"><span><Icon name="calendar" size={22} /></span><div><h2>{t.calendar}</h2><p>{t.calendarSummary}</p></div></div><button type="button" className="gd-text-button" onClick={() => openTtcm('schedule')}>{t.openCalendar}<Icon name="arrow" size={18} /></button></header>
        <div className="gd-today-layout">
          <header className="gd-today-overview">
            <div className="gd-today-date-mark"><strong>{todayDate.getDate()}</strong><span>{new Intl.DateTimeFormat(locale, { month: 'short' }).format(todayDate)}</span></div>
            <div className="gd-today-heading"><span>{t.selectedDay}</span><h3>{todayWeekday}</h3><p>{todayDateLabel}</p></div>
            <span className="gd-count-chip">{todayEvents.length} {t.events}</span>
          </header>
          <div className="gd-agenda-list gd-agenda-list-today">{initialLoading ? <Empty>{t.refreshing}</Empty> : todayEvents.length ? todayEvents.map((item) => <CalendarEvent key={item.id} item={item} language={language} locale={locale} t={t} />) : <Empty>{t.emptyCalendar}</Empty>}</div>
        </div>
      </article>
      <DashboardNewsHub'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
            raise SystemExit(f'Calendar JSX replacement count={count}')
          page.write_text(s)

          Path('src/styles/teacher-dashboard-calendar-split.css').write_text(r'''/* Dashboard today-only calendar — compact editorial daily agenda. */
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-layout { background: #fff; }
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-overview {
  min-height: 108px; padding: 22px 30px; display: grid;
  grid-template-columns: 78px minmax(0, 1fr) auto; align-items: center; gap: 20px;
  border-bottom: 1px solid #dfe4ea; background: #fff;
}
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-date-mark {
  width: 78px; min-height: 70px; padding-right: 18px; display: grid;
  align-content: center; justify-items: start; border-right: 1px solid #dfe4ea;
}
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-date-mark strong {
  color: #1769e0; font-family: Georgia, 'Times New Roman', serif; font-size: 48px;
  font-weight: 700; line-height: .86; letter-spacing: -.055em;
}
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-date-mark span {
  margin-top: 8px; color: #8791a1; font-size: 9px; font-weight: 800;
  letter-spacing: .15em; text-transform: uppercase;
}
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-heading { min-width: 0; display: grid; gap: 3px; }
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-heading > span {
  color: #1769e0; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
}
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-heading h3 {
  margin: 0; color: #172033; font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(27px, 2.25vw, 34px); font-weight: 700; line-height: 1.05;
  letter-spacing: -.025em; text-transform: capitalize;
}
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-heading p {
  margin: 2px 0 0; color: #788395; font-size: 12px; line-height: 1.35; text-transform: capitalize;
}
.app-shell[data-route="dashboard"] .gd-agenda-list-today { padding: 0 30px 10px; background: #fff; }
.app-shell[data-route="dashboard"] .gd-agenda-list-today .gd-event {
  min-height: 72px; border: 0 !important; border-bottom: 1px solid #e4e8ed !important;
  border-radius: 0 !important; background: transparent !important; box-shadow: none !important;
}
.app-shell[data-route="dashboard"] .gd-agenda-list-today .gd-event:last-child { border-bottom: 0 !important; }
.app-shell[data-route="dashboard"] .gd-agenda-list-today .gd-event:hover { background: #f8fafc !important; }
.app-shell[data-route="dashboard"] .gd-calendar-today .gd-empty { min-height: 112px; border: 0 !important; background: #fff !important; }
@media (max-width: 720px) {
  .app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-overview {
    min-height: 0; padding: 20px; grid-template-columns: 62px minmax(0, 1fr); gap: 14px;
  }
  .app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-date-mark { width: 62px; min-height: 62px; padding-right: 12px; }
  .app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-date-mark strong { font-size: 40px; }
  .app-shell[data-route="dashboard"] .gd-calendar-today .gd-today-overview > .gd-count-chip { grid-column: 1 / -1; justify-self: start; }
  .app-shell[data-route="dashboard"] .gd-agenda-list-today { padding: 0 20px 8px; }
}
''')

          palette = Path('src/styles/teacher-dashboard-google-colorful.css')
          p = palette.read_text().replace('02 / THIS WEEK', '02 / TODAY').replace('WEEKLY SCHEDULE / BRIAN', 'DAILY SCHEDULE / BRIAN')
          palette.write_text(p)
          PY
      - name: Validate refactor
        run: |
          ! grep -q 'calendarDays.map' src/pages/WorkDashboard.jsx
          grep -q 'gd-calendar-today' src/pages/WorkDashboard.jsx
          grep -q "calendar: 'Lịch hôm nay'" src/pages/WorkDashboard.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          rm .github/workflows/compact-dashboard-today-calendar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: show only today schedule on dashboard'
          git push
