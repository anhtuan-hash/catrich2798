name: Brian UI Smoke Build

on:
  pull_request:
    paths:
      - 'src/components/ui/**'
      - 'src/theme/brianDesignTokens.css'
      - 'vite.ui-smoke.config.js'
      - '.github/workflows/brian-ui-smoke.yml'

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Brian UI library
        run: npx vite build --config vite.ui-smoke.config.js
