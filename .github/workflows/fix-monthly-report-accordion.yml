name: Fix monthly report review accordion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-monthly-report-accordion.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install monthly report accordion patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add review accordion behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          jsx_path = Path('src/pages/MonthlyReportsWorkspace.jsx')
          text = jsx_path.read_text()
          old = '''function SectionCard({ number, title, description, complete, children }) {
  return (
    <section className={`mr-section ${complete ? 'is-complete' : ''}`}>
      <header>
        <span className="mr-section-icon"><ClipboardList /></span>
        <div><small>PHẦN {number}</small><h2>{title}</h2><p>{description}</p></div>
        {complete && <CheckCircle2 className="mr-section-check" />}
      </header>
      <div className="mr-section-body">{children}</div>
    </section>
  );
}
'''
          new = '''function SectionCard({ number, title, description, complete, children }) {
  const [expanded, setExpanded] = useState(false);
  const toggle = () => setExpanded((current) => !current);
  return (
    <section className={`mr-section ${complete ? 'is-complete' : ''} ${expanded ? 'is-expanded' : ''}`}>
      <header>
        <span className="mr-section-icon"><ClipboardList /></span>
        <div><small>PHẦN {number}</small><h2>{title}</h2><p>{description}</p></div>
        <div className="mr-section-controls">
          {complete && <CheckCircle2 className="mr-section-check" />}
          <button
            type="button"
            className="mr-section-toggle"
            aria-expanded={expanded}
            aria-label={expanded ? `Thu gọn ${title}` : `Mở ${title}`}
            onClick={toggle}
          ><span aria-hidden="true">⌄</span></button>
        </div>
      </header>
      <div className="mr-section-body">{children}</div>
    </section>
  );
}
'''
          if old not in text:
              raise SystemExit('SectionCard source block was not found; refusing unsafe patch')
          jsx_path.write_text(text.replace(old, new, 1))

          css_path = Path('src/styles/MonthlyReportsEditorialV10.css')
          css = css_path.read_text()
          marker = '/* Review accordion behavior — approved/submitted reports remain locked but can be reopened for reading. */'
          if marker not in css:
              css += '''\n\n/* Review accordion behavior — approved/submitted reports remain locked but can be reopened for reading. */
html body .mr-teacher-shell .mr-section-controls {
  display:flex !important;
  align-items:center !important;
  justify-content:flex-end !important;
  gap:8px !important;
}
html body .mr-teacher-shell .mr-section-toggle {
  display:none !important;
  place-items:center !important;
  width:30px !important;
  min-width:30px !important;
  height:30px !important;
  min-height:30px !important;
  padding:0 !important;
  border:1px solid #ddd7d0 !important;
  border-radius:50% !important;
  background:#fff !important;
  color:#69635d !important;
  box-shadow:0 1px 3px rgba(58,45,35,.04) !important;
  cursor:pointer !important;
}
html body .mr-teacher-shell .mr-section-toggle span {
  display:block !important;
  margin-top:-3px !important;
  font:700 18px/1 Georgia,'Times New Roman',serif !important;
}
html body .mr-teacher-shell:has(.mr-status.is-approved) .mr-section-toggle,
html body .mr-teacher-shell:has(.mr-status.is-submitted) .mr-section-toggle {
  display:grid !important;
}
html body .mr-teacher-shell:has(.mr-status.is-approved) .mr-section.is-expanded .mr-section-body,
html body .mr-teacher-shell:has(.mr-status.is-submitted) .mr-section.is-expanded .mr-section-body {
  display:block !important;
}
html body .mr-teacher-shell:has(.mr-status.is-approved) .mr-section.is-expanded > header,
html body .mr-teacher-shell:has(.mr-status.is-submitted) .mr-section.is-expanded > header {
  min-height:68px !important;
  padding:11px 16px !important;
  border-bottom:1px solid #eee9e3 !important;
}
html body .mr-teacher-shell:has(.mr-status.is-approved) .mr-section.is-expanded > header p,
html body .mr-teacher-shell:has(.mr-status.is-submitted) .mr-section.is-expanded > header p {
  display:block !important;
}
html body .mr-teacher-shell .mr-section.is-expanded .mr-section-toggle span {
  transform:rotate(180deg) !important;
  margin-top:3px !important;
}
html body .mr-teacher-shell:has(.mr-status.is-approved) .mr-section > header,
html body .mr-teacher-shell:has(.mr-status.is-submitted) .mr-section > header {
  cursor:default !important;
}
html body .mr-teacher-shell:has(.mr-status.is-approved) .mr-section.is-expanded,
html body .mr-teacher-shell:has(.mr-status.is-submitted) .mr-section.is-expanded {
  box-shadow:0 8px 24px rgba(46,38,31,.065) !important;
}
'''
              css_path.write_text(css)
          PY

          git config user.name "Brian UI Bot"
          git config user.email "brian-ui-bot@users.noreply.github.com"
          git add src/pages/MonthlyReportsWorkspace.jsx src/styles/MonthlyReportsEditorialV10.css
          git commit -m "Fix approved monthly report accordion review"
          git push origin main
