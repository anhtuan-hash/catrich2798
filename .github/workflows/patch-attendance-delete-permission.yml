name: Patch Attendance Delete Permission

on:
  push:
    branches:
      - 'feature/attendance-archive'
    paths:
      - 'scripts/patch-attendance-delete-permission.mjs'
      - '.github/workflows/patch-attendance-delete-permission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attendance-archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/patch-attendance-delete-permission.mjs
      - name: Commit patched UI
        run: |
          if git diff --quiet -- src/components/GlobalAttendanceNavigationTab.jsx src/components/attendance/AttendanceArchivePanel.jsx; then
            echo "No UI patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/components/attendance/AttendanceArchivePanel.jsx
          git commit -m "feat: honor attendance delete permission in archive UI"
          git push origin HEAD:feature/attendance-archive
