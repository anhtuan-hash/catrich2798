name: Apply granular attendance permissions

on:
  push:
    branches:
      - feat/granular-attendance-tabs

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run granular attendance implementation patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/granular-attendance-tabs
          fetch-depth: 0

      - name: Apply bounded permission patch
        run: node scripts/apply-granular-attendance-permissions.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce granular attendance tab permissions"
          git push origin HEAD:feat/granular-attendance-tabs
