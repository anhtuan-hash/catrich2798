name: Apply Granular Attendance Permissions

on:
  push:
    branches: [feat/granular-attendance-tabs]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/granular-attendance-tabs
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/apply-granular-attendance-permissions.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce granular attendance tab permissions"
          git push origin HEAD:feat/granular-attendance-tabs
