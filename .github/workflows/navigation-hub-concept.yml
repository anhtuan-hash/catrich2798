name: Navigation Architecture Guard

on:
  pull_request:
    paths:
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/GlobalCompactNavigation.css'
      - 'src/components/mobile/MobileAppShell.jsx'
      - 'src/styles/mobile/mobile-shell.css'
      - 'scripts/test-navigation-hub-concept.mjs'
      - '.github/workflows/navigation-hub-concept.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-hub-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current desktop/mobile navigation architecture
        run: node scripts/test-navigation-hub-concept.mjs
