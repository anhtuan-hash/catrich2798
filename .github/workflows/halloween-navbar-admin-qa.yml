name: BRIAN Halloween Navbar Admin Toggle QA
on:
  pull_request:
    paths:
      - 'src/utils/halloweenNavbarTheme.js'
      - 'src/components/HalloweenNavigationSkin.css'
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalCompactNavigation.jsx'
      - 'src/components/mobile/MobileAppShell.jsx'
      - 'src/components/admin/HalloweenNavbarAdminPanel*'
      - 'src/pages/Settings.jsx'
      - 'src/components/settings/SettingsLauncherHome.jsx'
      - 'public/assets/navbar/halloween-navbar.svg'
      - 'supabase/migrations/*halloween_navbar*'
      - 'scripts/test-halloween-navbar*'
      - 'tests/fixtures/halloween-navbar-test.*'
      - '.github/workflows/halloween-navbar-admin-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seasonal-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Server authorization and scoped UI regression
        run: node scripts/test-halloween-navbar.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser toggle restores original desktop and mobile
        run: node scripts/test-halloween-navbar-browser.mjs
      - name: Production Vercel release build
        run: node scripts/build-brian-vercel-release.mjs
