name: Brian Focus YouTube Playlist
on:
  pull_request:
    paths:
      - 'src/components/BrianFocus/**'
      - 'scripts/test-brian-focus-youtube.mjs'
      - 'supabase/migrations/20261024174300_brian_focus_youtube_playlist.sql'
      - 'tests/e2e/brian-focus-youtube-playlist.spec.js'
      - '.github/workflows/brian-focus-youtube-playlist.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/BrianFocus/**'
      - 'scripts/test-brian-focus-youtube.mjs'
      - '.github/workflows/brian-focus-youtube-playlist.yml'
permissions:
  contents: read
jobs:
  playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: YouTube URL security and continuous playlist contracts
        run: node scripts/test-brian-focus-youtube.mjs && node scripts/test-brian-focus-v7.mjs && node scripts/test-brian-focus-workspace.mjs
      - name: Production Vite build
        run: npx vite build
