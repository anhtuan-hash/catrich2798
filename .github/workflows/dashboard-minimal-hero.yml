name: Dashboard Minimal Hero
on:
  pull_request:
    paths:
      - 'src/pages/WorkDashboard.jsx'
      - 'src/components/DashboardHeroEditor.jsx'
      - 'src/styles/dashboard-hero-minimal-20261023.css'
      - 'scripts/test-dashboard-minimal-hero.mjs'
      - 'scripts/test-dashboard-hero-name-lines.mjs'
      - 'src/utils/dashboardHeroName.js'
      - 'src/styles/dashboard-hero-typography.css'
      - 'tests/e2e/dashboard-hero-typography.spec.js'
      - '.github/workflows/dashboard-minimal-hero.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/WorkDashboard.jsx'
      - 'src/components/DashboardHeroEditor.jsx'
      - 'src/styles/dashboard-hero-minimal-20261023.css'
      - 'scripts/test-dashboard-minimal-hero.mjs'
      - 'scripts/test-dashboard-hero-name-lines.mjs'
      - 'src/utils/dashboardHeroName.js'
      - 'src/styles/dashboard-hero-typography.css'
      - 'tests/e2e/dashboard-hero-typography.spec.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/test-dashboard-minimal-hero.mjs
      - run: node scripts/test-dashboard-hero-name-lines.mjs
      - run: npm ci --no-audit --no-fund
      - name: Compile frontend without unrelated release audits
        run: npx vite build
      - name: Install visual regression browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify name typography and line count in Chrome and Safari
        run: npx playwright test tests/e2e/dashboard-hero-typography.spec.js --project=chromium-desktop --project=webkit-desktop
      - name: Verify the exact production build
        run: node scripts/test-editorial-app-heroes.mjs && npm run build
