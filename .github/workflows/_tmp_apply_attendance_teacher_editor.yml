name: Temporary apply attendance teacher editor

on:
  push:
    branches: [feat/attendance-edit-class-teachers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[attendance-teacher-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-edit-class-teachers
          fetch-depth: 0
      - name: Apply source-of-truth edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count} for {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          editor = 'src/components/attendance/AttendanceClassEditor.jsx'
          replace_once(editor,
          """function initialClassForm(classRow) {\n  return {\n    class_name: String(classRow?.class_name || ''),\n    subject: String(classRow?.subject || ''),\n    grade_level: String(classRow?.grade_level || ''),\n    room: roomForExtraClass(classRow),\n    time_range: String(classRow?.time_range || '').trim(),\n    weekdays: weekdaysForExtraClass(classRow),\n  };\n}\n""",
          """function normalizeTeacherNames(values = []) {\n  const result = [];\n  values.forEach((value) => {\n    const clean = String(value || '').trim();\n    if (!clean) return;\n    const key = clean.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();\n    if (!result.some((name) => name.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase() === key)) result.push(clean);\n  });\n  return result;\n}\n\nfunction initialClassForm(classRow, teacherNames = []) {\n  return {\n    class_name: String(classRow?.class_name || ''),\n    subject: String(classRow?.subject || ''),\n    grade_level: String(classRow?.grade_level || ''),\n    room: roomForExtraClass(classRow),\n    time_range: String(classRow?.time_range || '').trim(),\n    weekdays: weekdaysForExtraClass(classRow),\n    teacher_names: normalizeTeacherNames(teacherNames),\n  };\n}\n""")

          replace_once(editor,
          """  selectedClass,\n  members = [],\n  canManageMembers = false,\n""",
          """  selectedClass,\n  members = [],\n  teacherNames = [],\n  canManageMembers = false,\n""")

          replace_once(editor,
          """  const [internalEditingClass, setInternalEditingClass] = useState(false);\n  const [classForm, setClassForm] = useState(() => initialClassForm(selectedClass));\n  const [editingMemberId, setEditingMemberId] = useState('');\n""",
          """  const [internalEditingClass, setInternalEditingClass] = useState(false);\n  const [classForm, setClassForm] = useState(() => initialClassForm(selectedClass, teacherNames));\n  const [newClassTeacherName, setNewClassTeacherName] = useState('');\n  const [editingMemberId, setEditingMemberId] = useState('');\n""")

          replace_once(editor,
          """  useEffect(() => {\n    setClassForm(initialClassForm(selectedClass));\n    setEditingClass(false);\n    setEditingMemberId('');\n    setMemberForm(initialMemberForm(null));\n    setOpenMemberMenuId('');\n  }, [selectedClass?.id, selectedClass?.updated_at]);\n""",
          """  const teacherNamesKey = normalizeTeacherNames(teacherNames).join('\\u0001');\n\n  useEffect(() => {\n    setClassForm(initialClassForm(selectedClass, teacherNames));\n    setNewClassTeacherName('');\n    setEditingClass(false);\n    setEditingMemberId('');\n    setMemberForm(initialMemberForm(null));\n    setOpenMemberMenuId('');\n  }, [selectedClass?.id, selectedClass?.updated_at, teacherNamesKey]);\n""")

          replace_once(editor,
          """  function cancelClassEdit() {\n    setClassForm(initialClassForm(selectedClass));\n    setEditingClass(false);\n    onError?.('');\n  }\n\n  async function saveClassInfo(event) {\n""",
          """  function cancelClassEdit() {\n    setClassForm(initialClassForm(selectedClass, teacherNames));\n    setNewClassTeacherName('');\n    setEditingClass(false);\n    onError?.('');\n  }\n\n  function addClassTeacher() {\n    const teacherName = newClassTeacherName.trim();\n    if (!teacherName) return;\n    const nextNames = normalizeTeacherNames([...classForm.teacher_names, teacherName]);\n    if (nextNames.length === classForm.teacher_names.length) {\n      onError?.(`${teacherName} đã có trong danh sách giáo viên của lớp.`);\n      return;\n    }\n    setClassForm((current) => ({ ...current, teacher_names: nextNames }));\n    setNewClassTeacherName('');\n    onError?.('');\n  }\n\n  function removeClassTeacher(teacherName) {\n    if (locked) return;\n    setClassForm((current) => ({\n      ...current,\n      teacher_names: current.teacher_names.filter((name) => name !== teacherName),\n    }));\n    onError?.('');\n  }\n\n  async function saveClassInfo(event) {\n""")

          replace_once(editor,
          """    if (!classForm.weekdays.length) {\n      onError?.('Vui lòng chọn ít nhất một ngày học trong tuần.');\n      return;\n    }\n\n    setSaving('class');\n""",
          """    if (!classForm.weekdays.length) {\n      onError?.('Vui lòng chọn ít nhất một ngày học trong tuần.');\n      return;\n    }\n    if (classForm.teacher_names.length === 0) {\n      onError?.('Lớp phải có ít nhất một giáo viên.');\n      return;\n    }\n\n    setSaving('class');\n""")

          replace_once(editor,
          """        p_time_range: classForm.time_range.trim(),\n        p_weekdays: classForm.weekdays,\n      });\n""",
          """        p_time_range: classForm.time_range.trim(),\n        p_weekdays: classForm.weekdays,\n        p_teacher_names: classForm.teacher_names,\n      });\n""")

          replace_once(editor,
          """          </div>\n          <div className=\"attendance-weekday-editor\">\n            <span>Ngày học trong tuần *</span>\n""",
          """          </div>\n          <div className=\"attendance-class-teacher-editor\">\n            <span>Giáo viên dạy lớp *</span>\n            <div className=\"attendance-class-teacher-chips\">\n              {classForm.teacher_names.length ? classForm.teacher_names.map((teacherName) => (\n                <span key={teacherName} className=\"attendance-class-teacher-chip\">\n                  <b>{teacherName}</b>\n                  <button type=\"button\" disabled={locked} aria-label={`Xóa ${teacherName} khỏi lớp`} onClick={() => removeClassTeacher(teacherName)}>×</button>\n                </span>\n              )) : <em>Chưa có giáo viên. Thêm ít nhất một giáo viên để lưu.</em>}\n            </div>\n            <div className=\"attendance-class-teacher-add\">\n              <input\n                value={newClassTeacherName}\n                onChange={(event) => setNewClassTeacherName(event.target.value)}\n                onKeyDown={(event) => {\n                  if (event.key === 'Enter') {\n                    event.preventDefault();\n                    addClassTeacher();\n                  }\n                }}\n                placeholder=\"Nhập họ tên giáo viên\"\n                aria-label=\"Họ tên giáo viên cần thêm\"\n              />\n              <button type=\"button\" disabled={locked || !newClassTeacherName.trim()} onClick={addClassTeacher}>+ Thêm giáo viên</button>\n            </div>\n            <small>Danh sách này sẽ được dùng cho các buổi điểm danh chưa chốt. Lịch sử đã xác nhận không thay đổi.</small>\n          </div>\n          <div className=\"attendance-weekday-editor\">\n            <span>Ngày học trong tuần *</span>\n""")

          replace_once(editor,
          """          <footer><button type=\"button\" disabled={locked} onClick={cancelClassEdit}>Hủy</button><button className=\"is-primary\" type=\"submit\" disabled={locked || !classForm.class_name.trim() || !classForm.weekdays.length}>{saving === 'class' ? 'Đang lưu…' : 'Lưu thông tin lớp'}</button></footer>\n""",
          """          <footer><button type=\"button\" disabled={locked} onClick={cancelClassEdit}>Hủy</button><button className=\"is-primary\" type=\"submit\" disabled={locked || !classForm.class_name.trim() || !classForm.weekdays.length || classForm.teacher_names.length === 0}>{saving === 'class' ? 'Đang lưu…' : 'Lưu thông tin lớp'}</button></footer>\n""")

          replace_once(editor,
          """          <article><span>Thời gian học</span><b>{selectedClass.time_range || 'Chưa ghi'}</b></article>\n          <article className=\"is-wide\"><span>Ngày học</span><b>{weekdayLabel(currentWeekdays)}</b></article>\n""",
          """          <article><span>Thời gian học</span><b>{selectedClass.time_range || 'Chưa ghi'}</b></article>\n          <article className=\"is-wide\"><span>Giáo viên dạy lớp</span><b>{normalizeTeacherNames(teacherNames).join(', ') || 'Chưa phân công'}</b></article>\n          <article className=\"is-wide\"><span>Ngày học</span><b>{weekdayLabel(currentWeekdays)}</b></article>\n""")

          workspace = 'src/components/attendance/AttendanceClassManagementWorkspace.jsx'
          replace_once(workspace,
          """  const teacher = teachersForClass?.(selectedClass) || 'Chưa phân công GV';\n  const teacherCount = countTeachers(teacher);\n""",
          """  const teacher = teachersForClass?.(selectedClass) || 'Chưa phân công GV';\n  const selectedAssignedTeachers = teacher === 'Chưa phân công GV'\n    ? []\n    : teacher.split(',').map((name) => name.trim()).filter(Boolean);\n  const teacherCount = countTeachers(teacher);\n""")

          replace_once(workspace,
          """            selectedClass={selectedClass}\n            members={filteredManagementMembers}\n            isAdmin={isAdmin}\n""",
          """            selectedClass={selectedClass}\n            members={filteredManagementMembers}\n            teacherNames={selectedAssignedTeachers}\n            isAdmin={isAdmin}\n""")

          global_file = 'src/components/GlobalAttendanceNavigationTab.jsx'
          replace_once(global_file,
          """  function assignedTeachersForClass(classRow) {\n    const authoritative = teachersForGiftedAssignment({\n      sourceKey: classRow?.source_key,\n      subject: classRow?.subject,\n      gradeLevel: classRow?.grade_level,\n      className: classRow?.class_name,\n    });\n    const normalized = classTeacherNames.get(String(classRow?.id)) || [];\n    const fallback = String(classRow?.teacher_name || '').split(/\\s*,\\s*/).map((name) => name.trim()).filter(Boolean);\n    const merged = [];\n    [...authoritative, ...normalized, ...fallback].forEach((name) => {\n""",
          """  function assignedTeachersForClass(classRow) {\n    const normalized = classTeacherNames.get(String(classRow?.id)) || [];\n    const authoritative = normalized.length ? [] : teachersForGiftedAssignment({\n      sourceKey: classRow?.source_key,\n      subject: classRow?.subject,\n      gradeLevel: classRow?.grade_level,\n      className: classRow?.class_name,\n    });\n    const fallback = normalized.length ? [] : String(classRow?.teacher_name || '').split(/\\s*,\\s*/).map((name) => name.trim()).filter(Boolean);\n    const merged = [];\n    [...normalized, ...authoritative, ...fallback].forEach((name) => {\n""")

          css = 'src/components/attendance/AttendanceClassEditor.css'
          replace_once(css,
          """.attendance-class-info-head span,\n.attendance-class-edit-form label > span,\n.attendance-weekday-editor > span,\n""",
          """.attendance-class-info-head span,\n.attendance-class-edit-form label > span,\n.attendance-class-teacher-editor > span,\n.attendance-weekday-editor > span,\n""")

          replace_once(css,
          """.attendance-class-edit-grid input,\n.attendance-class-edit-grid select,\n.attendance-member-edit-row input,\n""",
          """.attendance-class-edit-grid input,\n.attendance-class-edit-grid select,\n.attendance-class-teacher-add input,\n.attendance-member-edit-row input,\n""")

          replace_once(css,
          """.attendance-class-edit-grid input:focus,\n.attendance-class-edit-grid select:focus,\n.attendance-member-edit-row input:focus,\n""",
          """.attendance-class-edit-grid input:focus,\n.attendance-class-edit-grid select:focus,\n.attendance-class-teacher-add input:focus,\n.attendance-member-edit-row input:focus,\n""")

          replace_once(css,
          """.attendance-weekday-editor {\n  padding: 11px 12px 12px;\n""",
          """.attendance-class-teacher-editor {\n  padding: 11px 12px 12px;\n  border: 1px solid color-mix(in srgb, var(--att-m3-primary, #3f5f90) 16%, transparent);\n  border-radius: 14px;\n  background: color-mix(in srgb, var(--att-m3-primary-container, #d6e3ff) 24%, var(--att-m3-surface, #fbf8ff));\n}\n\n.attendance-class-teacher-chips {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 7px;\n  min-height: 31px;\n  align-items: center;\n}\n\n.attendance-class-teacher-chips > em {\n  color: var(--att-m3-on-variant, #45464f);\n  font-size: 10.5px;\n  font-style: normal;\n}\n\n.attendance-class-teacher-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  max-width: 100%;\n  min-height: 30px;\n  padding: 0 4px 0 10px;\n  border-radius: 999px;\n  background: var(--att-m3-primary-container, #d6e3ff);\n  color: var(--att-m3-on-primary-container, #0b1b33);\n}\n\n.attendance-class-teacher-chip b {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 10.5px;\n}\n\n.attendance-class-teacher-chip button {\n  width: 25px;\n  height: 25px;\n  border: 0;\n  border-radius: 50%;\n  background: transparent;\n  color: inherit;\n  font: inherit;\n  font-size: 17px;\n  line-height: 1;\n  cursor: pointer;\n}\n\n.attendance-class-teacher-chip button:hover:not(:disabled),\n.attendance-class-teacher-chip button:focus-visible {\n  background: color-mix(in srgb, var(--att-m3-primary, #3f5f90) 14%, transparent);\n}\n\n.attendance-class-teacher-add {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  gap: 7px;\n  margin-top: 8px;\n}\n\n.attendance-class-teacher-add input {\n  height: 36px;\n}\n\n.attendance-class-teacher-add button {\n  min-height: 36px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: 11px;\n  background: var(--att-m3-secondary-container, #dae2f9);\n  color: var(--att-m3-on-primary-container, #0b1b33);\n  font: inherit;\n  font-size: 10px;\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.attendance-class-teacher-add button:disabled,\n.attendance-class-teacher-chip button:disabled {\n  cursor: default;\n  opacity: .5;\n}\n\n.attendance-class-teacher-editor > small {\n  display: block;\n  margin-top: 7px;\n  color: var(--att-m3-on-variant, #45464f);\n  font-size: 10px;\n  line-height: 1.4;\n}\n\n.attendance-weekday-editor {\n  padding: 11px 12px 12px;\n""")

          replace_once(css,
          """  .attendance-member-edit-fields {\n    grid-template-columns: 1fr;\n  }\n}\n""",
          """  .attendance-class-teacher-add {\n    grid-template-columns: 1fr;\n  }\n\n  .attendance-class-teacher-add button {\n    width: 100%;\n  }\n\n  .attendance-member-edit-fields {\n    grid-template-columns: 1fr;\n  }\n}\n""")
          PY
      - name: Verify regression contract before commit
        run: node scripts/test-attendance-edit-class-teachers.mjs
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx \
                  src/components/attendance/AttendanceClassEditor.jsx \
                  src/components/attendance/AttendanceClassManagementWorkspace.jsx \
                  src/components/attendance/AttendanceClassEditor.css
          git commit -m "feat: edit class teacher assignments [attendance-teacher-auto]"
          git push origin HEAD:feat/attendance-edit-class-teachers
