name: Assessment 5.0 Release Gate
on:
  pull_request:
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/components/lessonCheck/Assessment5*'
      - 'src/components/lessonCheck/Assessment4Workbench.jsx'
      - 'src/utils/lessonCheckTeaching.js'
      - 'supabase/migrations/20261014060000_assessment_5_teaching_queue.sql'
      - 'tests/assessment-5-contract.test.mjs'
      - 'tests/assessment-5-1-reliability.test.mjs'
      - 'src/utils/lessonCheckWorkbench.js'
      - 'tests/e2e/assessment-5-ui.spec.js'
      - '.github/workflows/assessment-5-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/LessonCheckStudio.jsx'
      - 'src/components/lessonCheck/Assessment5*'
      - 'src/utils/lessonCheckTeaching.js'
      - 'supabase/migrations/20261014060000_assessment_5_teaching_queue.sql'
jobs:
  contract-and-build:
    name: Assessment 5 contracts & production build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/assessment-5-contract.test.mjs
      - run: node --test tests/assessment-5-1-reliability.test.mjs
      - run: node --test tests/assessment-4-workbench.test.mjs
      - run: node --test tests/lesson-check-approved-mockup-1.test.mjs
      - run: node --test tests/lesson-check-inline-favorites.test.mjs
      - run: node scripts/test-lesson-check-studio.mjs
      - run: npm run build
  browser-smoke:
    name: Assessment 5 browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/assessment-5-ui.spec.js --project=chromium-desktop
