name: Apply Attendance History Date Filter

on:
  push:
    branches:
      - fix/history-v3-legacy-isolation
    paths:
      - '.github/workflows/apply-attendance-history-date-filter.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/history-v3-legacy-isolation
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply History date filter UI and integration
        run: node scripts/apply-attendance-history-date-filter.mjs

      - name: Verify History date filter contract
        run: node scripts/test-attendance-history-date-filter.mjs

      - name: Commit implementation and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx src/components/attendance/AttendanceHistoryV2.css
          git rm scripts/apply-attendance-history-date-filter.mjs .github/workflows/apply-attendance-history-date-filter.yml
          git commit -m "feat(attendance): add History date filtering and sorting"
          git push origin HEAD:fix/history-v3-legacy-isolation
