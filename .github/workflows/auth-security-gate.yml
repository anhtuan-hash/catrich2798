name: BRIAN Auth Security Gate
on:
  pull_request:
    paths:
      - "src/utils/auth.js"
      - "src/pages/AuthPage.jsx"
      - "api/teacher-accounts.js"
      - "server/api/_security.js"
      - "supabase/functions/teacher-accounts/index.ts"
      - "supabase/migrations/**"
      - "scripts/test-auth-security-hardening.mjs"
      - "package.json"
      - ".github/workflows/auth-security-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/utils/auth.js"
      - "api/teacher-accounts.js"
      - "server/api/_security.js"
      - "supabase/functions/teacher-accounts/index.ts"
      - "supabase/migrations/**"
      - "scripts/test-auth-security-hardening.mjs"
      - "package.json"
jobs:
  verify-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:auth-security
      # The legacy smoke suite has pre-existing imports of retired modules;
      # it remains reported by the repository's broader CI workflow.
      - run: npm run build
