name: Navigation Option 3 Guard

on:
  pull_request:
    paths:
      - 'src/components/GlobalFlatNavigation.jsx'
      - 'src/components/GlobalNavigationOption3.css'
      - 'scripts/test-navigation-option-3.mjs'
      - '.github/workflows/navigation-option-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-option-3-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify navigation-only scope, performance, and egress contracts
        run: node scripts/test-navigation-option-3.mjs
