name: TTCM response viewer once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ttcm-response-viewer-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply TTCM response viewer
        run: python .github/scripts/ttcm_response_viewer_once.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit verified completion
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add src/main.jsx src/components/GlobalTtcmNavigationTab.jsx src/components/GlobalTtcmNavigationTab.css
          git diff --cached --quiet && exit 0
          git commit -m "feat(ttcm): surface teacher responses inside TTCM"
          git push origin HEAD:main
