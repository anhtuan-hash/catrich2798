name: Frontend Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'server/**'
      - 'supabase/**'
      - 'public/**'
      - 'scripts/test-font-upload-live-preview.mjs'
      - 'scripts/test-hero-theme-studio.mjs'
      - 'scripts/test-hero-theme-studio-settings-route.mjs'
      - 'scripts/test-no-first-visit-welcome.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify font upload and live preview contract
        run: node scripts/test-font-upload-live-preview.mjs

      - name: Verify Hero Theme Studio contract
        run: node scripts/test-hero-theme-studio.mjs

      - name: Verify Hero Theme Studio settings route
        run: node scripts/test-hero-theme-studio-settings-route.mjs

      - name: Verify first-visit welcome is retired
        run: node scripts/test-no-first-visit-welcome.mjs

      - name: Build production bundle
        run: npm run build
