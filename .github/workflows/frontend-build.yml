name: Frontend Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify font upload and live preview contract
        run: node scripts/test-font-upload-live-preview.mjs

      - name: Verify global Brian Newswire contract
        run: node scripts/test-global-brian-newswire.mjs

      - name: Verify Hero Theme Studio contract
        run: node scripts/test-hero-theme-studio.mjs

      - name: Verify Hero Theme Studio settings route
        run: node scripts/test-hero-theme-studio-settings-route.mjs

      - name: Verify Hero Theme registry/runtime matrix
        run: node scripts/test-hero-theme-registry-matrix.mjs

      - name: Verify first-visit welcome is retired
        run: node scripts/test-no-first-visit-welcome.mjs

      - name: Verify dashboard focused reader has no loading bars
        run: node scripts/test-dashboard-news-reader-no-loading-bars.mjs

      - name: Verify approved Dashboard Colorful V2
        run: node scripts/test-dashboard-colorful-v2.mjs

      - name: Verify Dashboard mockup parity V3
        run: node scripts/test-dashboard-mockup-parity-v3.mjs

      - name: Verify Dashboard mockup parity V4
        run: node scripts/test-dashboard-mockup-parity-v4.mjs

      - name: Verify Dashboard mockup parity V5
        run: node scripts/test-dashboard-mockup-parity-v5.mjs

      - name: Verify Dashboard mockup parity V6
        run: node scripts/test-dashboard-mockup-parity-v6.mjs

      - name: Verify Dashboard mockup parity V7
        run: node scripts/test-dashboard-mockup-parity-v7.mjs

      - name: Verify Dashboard mockup parity V8
        run: node scripts/test-dashboard-mockup-parity-v8.mjs

      - name: Verify Dashboard mockup parity V9
        run: node scripts/test-dashboard-mockup-parity-v9.mjs

      - name: Verify Dashboard mockup parity V10
        run: node scripts/test-dashboard-mockup-parity-v10.mjs

      - name: Verify Dashboard mockup parity V11
        run: node scripts/test-dashboard-mockup-parity-v11.mjs

      - name: Verify Dashboard footer V12
