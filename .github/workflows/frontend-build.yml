name: Frontend Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify font upload and live preview contract
        run: node scripts/test-font-upload-live-preview.mjs

      - name: Verify Hero Theme Studio contract
        run: node scripts/test-hero-theme-studio.mjs

      - name: Verify Hero Theme Studio settings route
        run: node scripts/test-hero-theme-studio-settings-route.mjs

      - name: Verify Hero Theme registry/runtime matrix
        run: node scripts/test-hero-theme-registry-matrix.mjs

      - name: Verify first-visit welcome is retired
        run: node scripts/test-no-first-visit-welcome.mjs

      - name: Verify dashboard focused reader has no loading bars
        run: node scripts/test-dashboard-news-reader-no-loading-bars.mjs

      - name: Verify global 10-bar Wave Loader is retired
        run: node scripts/test-no-global-wave-loader.mjs

      - name: Verify footer is always expanded
        run: node scripts/test-footer-always-expanded.mjs

      - name: Verify TTCM receives own communications
        run: node scripts/test-ttcm-self-recipient.mjs

      - name: Verify conduct export uses active Homeroom class
        run: node scripts/test-conduct-export-active-class.mjs

      - name: Verify TTCM response attachment limits
        run: node scripts/test-ttcm-response-multi-attachments.mjs

      - name: Verify TTCM Drive resumable CORS origin
        run: node scripts/test-ttcm-drive-resumable-cors.mjs

      - name: Verify extra-class attendance contract
        run: node scripts/test-extra-class-attendance.mjs

      - name: Verify manual attendance class teacher persistence
        run: node scripts/test-attendance-manual-class-teacher-persistence.mjs

      - name: Verify manual attendance teacher addition
        run: node scripts/test-attendance-manual-teacher-add.mjs

      - name: Verify attendance Material 3 reporting contract
        run: node scripts/test-attendance-material3-reporting.mjs

      - name: Verify attendance monthly aggregation
        run: node scripts/test-attendance-report-aggregation.mjs

      - name: Verify attendance report export
        run: node scripts/test-attendance-report-export.mjs

      - name: Verify attendance audit actors
        run: node scripts/test-attendance-audit-actors.mjs

      - name: Verify attendance Material 3 UI
        run: node scripts/test-attendance-material3-ui.mjs

      - name: Verify iPhone Dashboard and Attendance readability
        run: node scripts/test-iphone-dashboard-attendance-mobile.mjs

      - name: Verify attendance Windows 8 launch is always on
        run: node scripts/test-attendance-windows8-always-on.mjs

      - name: Verify attendance history bulk delete
        run: node scripts/test-attendance-history-bulk-delete.mjs

      - name: Verify attendance teacher/day lock
        run: node scripts/test-attendance-teacher-day-lock.mjs

      - name: Verify attendance schedule dimming
        run: node scripts/test-attendance-schedule-dimming.mjs

      - name: Verify attendance room chip
        run: node scripts/test-attendance-room-chip.mjs

      - name: Verify attendance class edit sync
        run: node scripts/test-attendance-class-edit-sync.mjs

      - name: Verify attendance monthly report UI
        run: node scripts/test-attendance-monthly-report-ui.mjs

      - name: Verify attendance absence room/time contract
        run: node scripts/test-attendance-absence-room-time.mjs

      - name: Verify attendance hub and absence UI
        run: node scripts/test-attendance-hub-absence-ui.mjs

      - name: Verify visible A-Z attendance room filter
        run: node scripts/test-attendance-visible-room-filter.mjs

      - name: Verify collapsible quick attendance class list
        run: node scripts/test-attendance-collapsible-class-list.mjs

      - name: Verify granular attendance permissions
        run: node scripts/test-attendance-granular-permissions.mjs

      - name: Verify attendance time access control
        run: node scripts/test-attendance-time-access-control.mjs

      - name: Verify post-confirm attendance edit window
        run: node scripts/test-attendance-post-confirm-edit-window.mjs

      - name: Verify calendar-first attendance entry
        run: node scripts/test-attendance-calendar-direct-entry.mjs

      - name: Verify report override quick attendance entry
        run: node scripts/test-attendance-report-override-quick.mjs

      - name: Verify Vercel Hobby function budget
        run: node scripts/test-vercel-hobby-function-budget.mjs

      - name: Verify critical browser smoke gate
        run: node scripts/test-critical-e2e-contract.mjs

      - name: Verify browser error telemetry
        run: node scripts/test-client-error-telemetry.mjs

      - name: Verify Admin teacher account creator
        run: node scripts/test-admin-teacher-account-creator.mjs

      - name: Verify Admin teacher account open contract
        run: node scripts/test-admin-teacher-account-open-contract.mjs

      - name: Verify Admin teacher account visible entry
        run: node scripts/test-admin-teacher-account-visible-entry.mjs

      - name: Verify Settings-merged Admin teacher account entry
        run: node scripts/test-settings-admin-teacher-account-entry.mjs

      - name: Verify Settings account center
        run: node scripts/test-settings-account-center.mjs

      - name: Build production bundle
        run: npm run build
