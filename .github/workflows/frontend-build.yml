name: Frontend Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify font upload and live preview contract
        run: node scripts/test-font-upload-live-preview.mjs

      - name: Verify Hero Theme Studio contract
        run: node scripts/test-hero-theme-studio.mjs

      - name: Verify Hero Theme Studio settings route
        run: node scripts/test-hero-theme-studio-settings-route.mjs

      - name: Verify Hero Theme registry/runtime matrix
        run: node scripts/test-hero-theme-registry-matrix.mjs

      - name: Verify first-visit welcome is retired
        run: node scripts/test-no-first-visit-welcome.mjs

      - name: Verify dashboard focused reader has no loading bars
        run: node scripts/test-dashboard-news-reader-no-loading-bars.mjs

      - name: Verify global 10-bar Wave Loader is retired
        run: node scripts/test-no-global-wave-loader.mjs

      - name: Verify TTCM receives own communications
        run: node scripts/test-ttcm-self-recipient.mjs

      - name: Verify conduct export uses active Homeroom class
        run: node scripts/test-conduct-export-active-class.mjs

      - name: Verify TTCM response attachment limits
        run: node scripts/test-ttcm-response-multi-attachments.mjs

      - name: Verify TTCM Drive resumable CORS origin
        run: node scripts/test-ttcm-drive-resumable-cors.mjs

      - name: Verify critical browser smoke gate
        run: node scripts/test-critical-e2e-contract.mjs

      - name: Verify browser error telemetry
        run: node scripts/test-client-error-telemetry.mjs

      - name: Build production bundle
        run: npm run build
