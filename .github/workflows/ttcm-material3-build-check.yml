name: TTCM Material 3 Build Check

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/GlobalTtcmNavigationTab.jsx'
      - 'src/components/GlobalTtcmNavigationTab.css'
      - 'src/components/GlobalFlatNavigation.jsx'
      - '.github/workflows/ttcm-material3-build-check.yml'

permissions:
  contents: read

concurrency:
  group: ttcm-material3-build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build production bundle
        run: npm run build
