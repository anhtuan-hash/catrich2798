name: Retire seven Brian applications once

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  retire:
    if: ${{ github.event.issue.title == '[Brian] Retire seven applications permanently' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create cleanup branch
        run: git checkout -B agent/remove-seven-apps-20260807

      - name: Apply permanent cleanup
        run: python3 scripts/retire-seven-apps-once.py

      - name: Verify retired apps are absent
        run: |
          set -euo pipefail
          markers='activity-graph|word-orbit|word2graph|exam-studio|lesson-plan-ai|reading-studio|student-practice|ActivityGraphStudio|WordOrbitGame|WordGraphStudio|ExamStudioUploadPage|LessonArchitect|ReadingStudio|StudentPractice'
          if git grep -n -E "$markers" -- src ':!src/utils/retiredFeatureCleanup.js' ':!src/styles/v1131.css' ':!src/styles/v1132.css'; then
            echo 'Active source references to retired apps remain.' >&2
            exit 1
          fi
          npm run audit:removed-apps

      - name: Build cleaned application
        run: |
          npm ci
          npm run build

      - name: Commit cleanup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: permanently remove seven retired applications'
          git push --force origin HEAD:agent/remove-seven-apps-20260807

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Cleanup branch created and verified: agent/remove-seven-apps-20260807"
