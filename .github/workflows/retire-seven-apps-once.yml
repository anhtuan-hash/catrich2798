name: Remove requested Brian applications once

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/remove-requested-apps-20260807

      - name: Apply permanent cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remove-requested-apps-once.py

      - name: Verify retired apps are absent
        shell: bash
        run: |
          set -euo pipefail
          markers='lesson-plan-ai|exam-studio|word2graph|student-practice|reading-studio|assessment-core|flying-words|classroom-screen|content-ecosystem|automation-center|collaboration-hub|knowledge-train|word-orbit|activity-graph|crossword-trial|random-group|group-maker|LessonArchitect|ExamStudioUploadPage|WordGraphStudio|StudentPractice|ReadingStudio|AssessmentCore|FlyingWords|RandomGroup|ClassroomScreen|ContentEcosystem|AutomationCenter|CollaborationHub|KnowledgeTrain|WordOrbit|ActivityGraph|CrosswordTrial'
          if git grep -n -E "$markers" -- src ':!src/utils/retiredFeatureCleanup.js' ':!src/styles/v1131.css' ':!src/styles/v1132.css'; then
            echo 'Active source references to requested retired apps remain.' >&2
            exit 1
          fi
          npm run audit:removed-apps

      - name: Build cleaned application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: permanently remove requested applications'
          git push --force origin HEAD:agent/remove-requested-apps-20260807
