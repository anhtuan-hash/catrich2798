name: Gradebook Roster Toolbar Layout Regression
on:
  push:
    branches: [main, 'fix/gradebook-roster-toolbar-layout-20261012']
    paths:
      - 'src/styles/GradebookRosterLayoutHotfix.css'
      - 'src/pages/GradebookStudio.jsx'
      - 'tests/gradebook-roster-layout-hotfix.test.mjs'
      - 'tests/e2e/gradebook-roster-toolbar-layout.spec.js'
      - '.github/workflows/gradebook-roster-layout.yml'
  pull_request:
    paths:
      - 'src/styles/GradebookRosterLayoutHotfix.css'
      - 'src/pages/GradebookStudio.jsx'
      - 'tests/gradebook-roster-layout-hotfix.test.mjs'
      - 'tests/e2e/gradebook-roster-toolbar-layout.spec.js'
jobs:
  layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/gradebook-roster-layout-hotfix.test.mjs
      - run: node --test tests/gradebook-spectrum-v4.test.mjs tests/gradebook-workbench-two.test.mjs
      - run: npm run build
  chromium-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/gradebook-roster-toolbar-layout.spec.js --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradebook-roster-layout-artifacts
          path: |
            test-results/
            reports/playwright/
