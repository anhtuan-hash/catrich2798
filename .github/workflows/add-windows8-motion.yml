name: Add Windows 8 motion experience

on:
  push:
    paths:
      - '.github/workflows/add-windows8-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Windows 8 motion profile
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          js_path = Path('src/utils/globalMotionSystem.js')
          js = js_path.read_text()
          js = js.replace(
              "const VALID_PRESETS = new Set(['off', 'subtle', 'balanced', 'expressive']);",
              "const VALID_PRESETS = new Set(['off', 'subtle', 'balanced', 'windows8', 'expressive']);"
          )
          marker = "  {\n    id: 'expressive',\n"
          windows8_preset = """  {
            id: 'windows8',
            labelVi: 'Windows 8',
            label: 'Windows 8',
            descriptionVi: 'Metro chuyển ngang rõ nét, loader 5 chấm chạy và indicator phẳng kiểu Windows 8.',
            description: 'Metro horizontal page motion with five-dot loading progress and a flat Windows 8 indicator.',
            speedVi: '170–520 ms · Metro dots',
            tone: 'windows8',
          },
          """
          if "id: 'windows8'" not in js:
              js = js.replace(marker, windows8_preset + marker)

          globals_marker = "let mutationFrame = 0;\nconst tabMotionTimestamps = new WeakMap();"
          globals_replacement = "let mutationFrame = 0;\nlet windows8LoaderTimer = 0;\nlet windows8HideTimer = 0;\nconst tabMotionTimestamps = new WeakMap();"
          js = js.replace(globals_marker, globals_replacement)

          loader_marker = "function installRealtimeSync() {"
          loader_code = r'''function windows8MotionActive() {
            if (typeof window === 'undefined' || typeof document === 'undefined') return false;
            if (document.documentElement?.dataset?.motionMode !== 'windows8') return false;
            if (document.documentElement?.dataset?.motionEnabled !== 'true') return false;
            return !window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
          }

          function ensureWindows8RouteLoader() {
            if (typeof document === 'undefined' || !document.body) return null;
            let loader = document.getElementById('bes-windows8-route-loader');
            if (loader) return loader;
            loader = document.createElement('div');
            loader.id = 'bes-windows8-route-loader';
            loader.className = 'gm-w8-route-loader';
            loader.setAttribute('role', 'status');
            loader.setAttribute('aria-live', 'polite');
            loader.setAttribute('aria-label', 'Đang mở trang');
            loader.innerHTML = `
              <div class="gm-w8-loader-inner">
                <div class="gm-w8-progress" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
                <strong>BRIAN ENGLISH</strong>
                <small>Đang mở trang…</small>
              </div>`;
            document.body.appendChild(loader);
            return loader;
          }

          function hideWindows8RouteLoader({ immediate = false } = {}) {
            if (typeof window === 'undefined' || typeof document === 'undefined') return;
            window.clearTimeout(windows8LoaderTimer);
            window.clearTimeout(windows8HideTimer);
            const loader = document.getElementById('bes-windows8-route-loader');
            delete document.documentElement.dataset.windows8Loading;
            if (!loader) return;
            if (immediate) {
              loader.classList.remove('is-visible', 'is-running', 'is-leaving');
              loader.setAttribute('aria-hidden', 'true');
              return;
            }
            loader.classList.add('is-leaving');
            loader.classList.remove('is-running');
            windows8HideTimer = window.setTimeout(() => {
              loader.classList.remove('is-visible', 'is-leaving');
              loader.setAttribute('aria-hidden', 'true');
            }, 150);
          }

          function showWindows8RouteLoader() {
            if (!windows8MotionActive()) return;
            const loader = ensureWindows8RouteLoader();
            if (!loader) return;
            window.clearTimeout(windows8LoaderTimer);
            window.clearTimeout(windows8HideTimer);
            loader.classList.remove('is-leaving');
            loader.classList.add('is-visible');
            loader.setAttribute('aria-hidden', 'false');
            document.documentElement.dataset.windows8Loading = 'true';
            void loader.offsetWidth;
            loader.classList.add('is-running');
            windows8LoaderTimer = window.setTimeout(() => hideWindows8RouteLoader(), 620);
          }

          function installWindows8RouteExperience() {
            if (typeof window === 'undefined' || typeof document === 'undefined') return;
            const onNavigate = () => showWindows8RouteLoader();
            window.addEventListener('bes-navigation-start', onNavigate);
            window.addEventListener('hashchange', onNavigate);
            window.addEventListener('popstate', onNavigate);
            const showInitial = () => {
              if (windows8MotionActive()) window.setTimeout(showWindows8RouteLoader, 30);
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showInitial, { once: true });
            else showInitial();
          }

          '''
          if 'function windows8MotionActive()' not in js:
              js = js.replace(loader_marker, loader_code + loader_marker)

          apply_marker = "    root.dataset.motionSource = source;\n  }\n  if (persist) writeStoredPreset(normalized);"
          apply_replacement = "    root.dataset.motionSource = source;\n  }\n  if (normalized !== 'windows8') hideWindows8RouteLoader({ immediate: true });\n  if (persist) writeStoredPreset(normalized);"
          js = js.replace(apply_marker, apply_replacement)

          install_marker = "  scheduleRuntimeSync();\n}"
          install_replacement = "  installWindows8RouteExperience();\n  scheduleRuntimeSync();\n}"
          if 'installWindows8RouteExperience();\n  scheduleRuntimeSync();' not in js:
              js = js.replace(install_marker, install_replacement)
          js_path.write_text(js)

          nav_path = Path('src/utils/navigation.js')
          nav = nav_path.read_text()
          old = "  if (window.location.hash !== target) go();"
          new = """  if (window.location.hash !== target) {
            window.dispatchEvent(new CustomEvent('bes-navigation-start', { detail: { target } }));
            go();
          }"""
          nav = nav.replace(old, new)
          nav_path.write_text(nav)

          css_path = Path('src/styles/GlobalMotionSystem.css')
          css = css_path.read_text()
          balanced_block = '''html[data-motion-mode="balanced"] {
            --gm-fast: 130ms;
            --gm-base: 230ms;
            --gm-slow: 360ms;
            --gm-distance: 14px;
            --gm-scale-press: .978;
            --gm-scale-enter: .985;
          }
          '''
          windows8_vars = '''
          html[data-motion-mode="windows8"] {
            --gm-fast: 120ms;
            --gm-base: 210ms;
            --gm-slow: 420ms;
            --gm-distance: 56px;
            --gm-scale-press: .985;
            --gm-scale-enter: 1;
            --gm-ease: cubic-bezier(.1, .9, .2, 1);
            --gm-ease-emphasized: cubic-bezier(.1, .9, .2, 1);
          }
          '''
          if 'html[data-motion-mode="windows8"]' not in css:
              css = css.replace(balanced_block, balanced_block + windows8_vars)

          fluent_marker = '/* Fluent Dynamic: slightly stronger depth, still compositor-only. */'
          windows8_page = r'''
          /* Windows 8 Metro: flat horizontal content transition, no zoom/glow. */
          html[data-motion-mode="windows8"][data-motion-enabled="true"] body #bes-main-content:not(#gm-profile-a#gm-profile-b#gm-profile-c),
          html[data-motion-mode="windows8"][data-motion-enabled="true"] body [data-bes-main-content]:not(#gm-profile-a#gm-profile-b#gm-profile-c)[data-global-page-enter="true"] {
            animation-name: gm-page-windows8 !important;
            animation-duration: 420ms !important;
            animation-timing-function: cubic-bezier(.1,.9,.2,1) !important;
            transform-origin: center left !important;
          }
          @keyframes gm-page-windows8 {
            0% { opacity: .01; translate: 72px 0; }
            38% { opacity: .72; }
            100% { opacity: 1; translate: 0 0; }
          }

          html[data-motion-mode="windows8"][data-motion-enabled="true"] body :not(#gm-profile-a#gm-profile-b#gm-profile-c):is(
            [role="tabpanel"], [data-tab-panel], .tab-panel, .tab-content,
            [class*="tab-panel"], [class*="tab-content"]
          )[data-global-tab-enter="true"] {
            animation-name: gm-tab-windows8 !important;
            animation-duration: 300ms !important;
            animation-timing-function: cubic-bezier(.1,.9,.2,1) !important;
          }
          @keyframes gm-tab-windows8 {
            from { opacity: .01; translate: 44px 0; }
            to { opacity: 1; translate: 0 0; }
          }

          /* Windows 8 page loader: five Metro dots travelling across a flat track. */
          .gm-w8-route-loader {
            position: fixed;
            z-index: 2147482400;
            inset: 72px 0 0;
            display: grid;
            place-items: center;
            pointer-events: none;
            visibility: hidden;
            opacity: 0;
            background: rgba(248,250,252,.94);
          }
          .gm-w8-route-loader.is-visible {
            visibility: visible;
            opacity: 1;
          }
          .gm-w8-route-loader.is-leaving { opacity: 0; }
          .gm-w8-loader-inner {
            width: min(360px, calc(100vw - 48px));
            display: grid;
            justify-items: center;
            gap: 8px;
            color: #1f1f1f;
            font-family: "Segoe UI", system-ui, sans-serif;
            text-align: center;
          }
          .gm-w8-loader-inner strong {
            margin-top: 6px;
            color: #0078d7;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .13em;
          }
          .gm-w8-loader-inner small { color: #5d6166; font-size: 12px; font-weight: 400; }
          .gm-w8-progress {
            position: relative;
            width: 238px;
            height: 28px;
            overflow: hidden;
          }
          .gm-w8-progress span {
            position: absolute;
            top: 10px;
            left: -18px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #0078d7;
            opacity: 0;
          }
          .gm-w8-route-loader.is-running .gm-w8-progress span { animation: gm-w8-progress-dot 1.18s cubic-bezier(.1,.85,.25,1) infinite; }
          .gm-w8-progress span:nth-child(1) { animation-delay: 0ms !important; }
          .gm-w8-progress span:nth-child(2) { animation-delay: 95ms !important; }
          .gm-w8-progress span:nth-child(3) { animation-delay: 190ms !important; }
          .gm-w8-progress span:nth-child(4) { animation-delay: 285ms !important; }
          .gm-w8-progress span:nth-child(5) { animation-delay: 380ms !important; }
          @keyframes gm-w8-progress-dot {
            0% { left: -18px; opacity: 0; }
            10% { opacity: 1; }
            45% { left: 96px; opacity: 1; }
            74% { left: 184px; opacity: 1; }
            100% { left: 252px; opacity: 0; }
          }
          '''
          if '@keyframes gm-page-windows8' not in css:
              css = css.replace(fluent_marker, windows8_page + '\n' + fluent_marker)

          indicator_marker = '/* Fluent Dynamic glow indicator. */'
          windows8_indicator = r'''
          /* Windows 8 active route: flat Metro accent bar, intentionally no pill/glow. */
          html[data-motion-mode="windows8"][data-motion-enabled="true"] body .brian-nav__primary :is(
            button.active, button.is-active, button[aria-current="page"],
            a.active, a.is-active, a[aria-current="page"]
          ) {
            box-shadow: none !important;
          }
          html[data-motion-mode="windows8"][data-motion-enabled="true"] body .brian-nav__primary :is(
            button.active, button.is-active, button[aria-current="page"],
            a.active, a.is-active, a[aria-current="page"]
          )::after {
            content: "" !important;
            position: absolute !important;
            z-index: 5 !important;
            left: 8% !important;
            right: 8% !important;
            bottom: 0 !important;
            height: 4px !important;
            border-radius: 0 !important;
            background: #0078d7 !important;
            box-shadow: none !important;
            opacity: 1 !important;
            transform-origin: left center !important;
            animation: gm-indicator-windows8 240ms cubic-bezier(.1,.9,.2,1) both !important;
          }
          @keyframes gm-indicator-windows8 {
            from { opacity: .01; scale: .12 1; }
            to { opacity: 1; scale: 1 1; }
          }
          '''
          if '@keyframes gm-indicator-windows8' not in css:
              css = css.replace(indicator_marker, windows8_indicator + '\n' + indicator_marker)
          css_path.write_text(css)

          admin_css_path = Path('src/components/admin/GlobalMotionAdminPanel.css')
          admin_css = admin_css_path.read_text()
          admin_css = admin_css.replace('grid-template-columns: repeat(4, minmax(0, 1fr));', 'grid-template-columns: repeat(5, minmax(0, 1fr));', 1)
          preview_marker = '.admin-motion-preview-window {'
          preview_css = r'''
          .admin-motion-preview.is-windows8 {
            border-radius: 0;
            background: #0078d7;
          }
          .admin-motion-preview.is-windows8 .admin-motion-preview-window {
            border-radius: 0;
            box-shadow: none;
          }
          .admin-motion-preview.is-windows8 .admin-motion-preview-row > i,
          .admin-motion-preview.is-windows8 .admin-motion-preview-cards span {
            border-radius: 0;
          }
          '''
          if '.admin-motion-preview.is-windows8' not in admin_css:
              admin_css = admin_css.replace(preview_marker, preview_css + '\n' + preview_marker)
          admin_css_path.write_text(admin_css)

          sql_path = Path('supabase/brian_global_motion_settings.sql')
          sql = sql_path.read_text().replace(
              "check (preset in ('off', 'subtle', 'balanced', 'expressive'))",
              "check (preset in ('off', 'subtle', 'balanced', 'windows8', 'expressive'))"
          )
          sql_path.write_text(sql)

          migration = Path('supabase/migrations/20260826_add_windows8_motion_preset.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Allow the Windows 8 Metro motion profile on an existing production table.\nDO $$\nDECLARE\n  r record;\nBEGIN\n  IF to_regclass('public.brian_global_motion_settings') IS NULL THEN\n    RETURN;\n  END IF;\n  FOR r IN\n    SELECT conname\n    FROM pg_constraint\n    WHERE conrelid = 'public.brian_global_motion_settings'::regclass\n      AND contype = 'c'\n      AND pg_get_constraintdef(oid) ILIKE '%preset%'\n  LOOP\n    EXECUTE format('ALTER TABLE public.brian_global_motion_settings DROP CONSTRAINT %I', r.conname);\n  END LOOP;\n  ALTER TABLE public.brian_global_motion_settings\n    ADD CONSTRAINT brian_global_motion_settings_preset_check\n    CHECK (preset IN ('off', 'subtle', 'balanced', 'windows8', 'expressive'));\nEND $$;\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit Windows 8 experience
        shell: bash
        run: |
          git config user.name "Brian Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/globalMotionSystem.js src/utils/navigation.js src/styles/GlobalMotionSystem.css src/components/admin/GlobalMotionAdminPanel.css supabase/brian_global_motion_settings.sql supabase/migrations/20260826_add_windows8_motion_preset.sql
          git commit -m "Add Windows 8 Metro page motion loader and indicator" || true
          git rm .github/workflows/add-windows8-motion.yml
          git commit -m "Remove one-time Windows 8 migration workflow" || true
          git push origin HEAD:main
