name: Fix TTCM DOCX preview once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-ttcm-docx-preview-once.py'
      - '.github/workflows/fix-ttcm-docx-preview-once.yml'

permissions:
  contents: write

jobs:
  patch-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply DOCX preview fix
        run: python scripts/fix-ttcm-docx-preview-once.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify JSZip async API
        run: |
          node --input-type=module - <<'NODE'
          import JSZip from 'jszip';
          const zip = new JSZip();
          zip.file('word/document.xml', '<w:document/>');
          const bytes = await zip.generateAsync({ type: 'uint8array' });
          const opened = await JSZip.loadAsync(bytes);
          const entry = opened.file('word/document.xml');
          if (!entry || typeof entry.async !== 'function') throw new Error('JSZip async API unavailable');
          const xml = await entry.async('string');
          if (!xml.includes('document')) throw new Error('JSZip roundtrip failed');
          console.log('JSZip async API OK');
          NODE
      - name: Build production bundle
        run: npm run build
      - name: Commit verified source and remove one-time migration
        run: |
          rm -f scripts/fix-ttcm-docx-preview-once.py .github/workflows/fix-ttcm-docx-preview-once.yml
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(ttcm): make DOCX preview reliable"
            git push origin HEAD:main
          fi
