name: Apply Extra Class Archive UI

on:
  push:
    branches:
      - 'feat/extra-class-archive-governance'
    paths:
      - 'scripts/apply-extra-class-archive-ui.mjs'
      - '.github/workflows/apply-extra-class-archive-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/extra-class-archive-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved archive UI changes
        run: node scripts/apply-extra-class-archive-ui.mjs
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobalAttendanceNavigationTab.jsx \
            src/components/attendance/AttendanceClassManagementWorkspace.jsx \
            src/components/attendance/AttendanceArchivePanel.jsx \
            src/components/attendance/AttendanceArchive.css \
            scripts/test-extra-class-attendance.mjs \
            .github/workflows/frontend-build.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate extra class archive UI"
          git push origin HEAD:feat/extra-class-archive-governance
