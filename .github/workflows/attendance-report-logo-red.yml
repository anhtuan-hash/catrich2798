name: Attendance Report Logo RED

on:
  push:
    branches:
      - fix/attendance-report-logo-print-safe

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-report-logo-print-safe
      - name: Run cross-browser PDF regression contract
        run: node scripts/test-attendance-report-export.mjs
