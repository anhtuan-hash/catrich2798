name: Gradebook Material 3 Final Polish Safety
on:
  pull_request:
    paths:
      - 'src/pages/GradebookStudio.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookProductivityPanel.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'src/components/gradebook/GradebookProductivityPanel.css'
      - 'tests/gradebook-material3-finish.test.mjs'
      - 'tests/gradebook-usability-material3.test.mjs'
      - '.github/workflows/gradebook-material3-finish.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/GradebookStudio.jsx'
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/components/gradebook/GradebookProductivityPanel.jsx'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'src/components/gradebook/GradebookProductivityPanel.css'
jobs:
  gradebook-finishing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Gradebook UI and behavior contracts
        run: |
          node --test tests/gradebook-material3-finish.test.mjs tests/gradebook-usability-material3.test.mjs tests/gradebook-material3-colorful.test.mjs tests/gradebook-academic-workspace.test.mjs tests/gradebook-visual-defects.test.mjs tests/gradebook-approved-v2.test.mjs tests/gradebook-approved-mockup-4.test.mjs tests/gradebook-productivity.test.mjs tests/gradebook-phase2.test.mjs tests/gradebook-phase3.test.mjs
      - name: Vite production build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Grade table, navigation, mobile and dense data geometry
        run: npx playwright test tests/e2e/gradebook-academic-geometry.spec.js tests/e2e/gradebook-permanent-palette.spec.js tests/e2e/gradebook-visual-defects.spec.js tests/e2e/gradebook-usability-material3.spec.js --project=chromium-desktop
