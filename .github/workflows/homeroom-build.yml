name: Homeroom Build Verification

on:
  pull_request:
    paths:
      - 'src/pages/HomeroomWorkspace.jsx'
      - 'src/styles/homeroom-4-tokens.css'
      - 'scripts/test-homeroom-4-phase-1.mjs'
      - 'src/styles/homeroom-4-expressive.css'
      - 'scripts/test-homeroom-4-phase-2.mjs'
      - 'src/utils/homeroom4Dashboard.js'
      - 'src/components/homeroom/HomeroomCommandCenter.css'
      - 'scripts/test-homeroom-4-phase-3.mjs'
      - 'src/utils/homeroom4StudentHub.js'
      - 'scripts/test-homeroom-4-phase-4.mjs'
      - 'src/utils/homeroom4RecordsReview.js'
      - 'scripts/test-homeroom-4-phase-5.mjs'
      - 'src/utils/homeroom4Engagement.js'
      - 'scripts/test-homeroom-4-phase-6.mjs'
      - 'docs/homeroom-4/**'
      - 'src/utils/homeroomFastEntry.js'
      - 'scripts/test-homeroom-instant-entry.mjs'
      - 'src/preferredHomeroomEntry.js'
      - 'src/applicationBootstrap.jsx'
      - 'src/utils/homeroomAssignmentSelection.js'
      - 'supabase/migrations/*fast_assigned_homeroom_entry.sql'
      - 'scripts/test-homeroom-assignment-entry.mjs'
      - 'src/components/Homeroom*.jsx'
      - 'src/components/homeroom/**'
      - 'src/utils/homeroom*.js'
      - 'src/utils/gradebookWorkspaceStore.js'
      - 'src/data/homeroom*.js'
      - 'src/styles/homeroom*.css'
      - 'scripts/test-homeroom-production-safety.mjs'
      - 'scripts/test-homeroom-legacy-cleanup.mjs'
      - 'scripts/test-gradebook-migration-state.mjs'
      - '.github/workflows/homeroom-build.yml'
      - 'public/templates/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Homeroom 4.0 Phase 6 attendance and conduct analytics
        run: node scripts/test-homeroom-4-phase-6.mjs
      - name: Verify Homeroom 4.0 Phase 5 three-source Records Review
        run: node scripts/test-homeroom-4-phase-5.mjs
      - name: Verify Homeroom 4.0 Phase 4 Student Hub and lifecycle safety
        run: node scripts/test-homeroom-4-phase-4.mjs
      - name: Verify Homeroom 4.0 Phase 3 real-data Command Center
        run: node scripts/test-homeroom-4-phase-3.mjs
      - name: Verify Homeroom 4.0 Phase 2 expressive UI regression
        run: node scripts/test-homeroom-4-phase-2.mjs
      - name: Verify Homeroom 4.0 Phase 1 design and safety contract
        run: node scripts/test-homeroom-4-phase-1.mjs
      - name: Verify instant cached GVCN entry and account isolation
        run: node scripts/test-homeroom-instant-entry.mjs
      - name: Verify admin-assigned homeroom opens by default
        run: node scripts/test-homeroom-assignment-entry.mjs
      - name: Run homeroom production-safety contract
        run: node scripts/test-homeroom-production-safety.mjs
      - name: Run homeroom legacy-cleanup contract
        run: node scripts/test-homeroom-legacy-cleanup.mjs
      - name: Run gradebook migration-state contract
        run: node scripts/test-gradebook-migration-state.mjs
      - name: Build application
        id: app_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build > build.log 2>&1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeroom-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail when build failed
        if: steps.app_build.outcome == 'failure'
        run: |
          tail -n 120 build.log
          exit 1
