name: Sync History Redesign With Main V2

on:
  push:
    branches:
      - feat/attendance-history-detail-redesign

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[history-sync-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/attendance-history-detail-redesign
          fetch-depth: 0

      - name: Merge latest main and restore only redesigned history block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/GlobalAttendanceNavigationTab.jsx')
          text = path.read_text()
          start_marker = "          {!loading && view === 'history' ? ("
          start = text.find(start_marker)
          if start < 0:
              start_marker = "          {!loading && canAccessAttendanceView('history') && view === 'history' ? ("
              start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Cannot locate redesigned history block start')
          end_marker = "          ) : null}\n        </main>"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Cannot locate redesigned history block end')
          end += len("          ) : null}")
          Path('/tmp/redesigned-history-block.txt').write_text(text[start:end])
          print(f'Saved redesigned history block: {end-start} chars')
          PY

          git fetch origin main
          set +e
          git merge origin/main --no-ff --no-commit
          merge_code=$?
          set -e

          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            echo "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(src/components/GlobalAttendanceNavigationTab\.jsx|scripts/test-attendance-material3-ui\.mjs)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts detected:"
              echo "$unexpected"
              exit 1
            fi

            if printf '%s\n' "$conflicts" | grep -qx 'src/components/GlobalAttendanceNavigationTab.jsx'; then
              git checkout --theirs src/components/GlobalAttendanceNavigationTab.jsx
              python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/GlobalAttendanceNavigationTab.jsx')
          text = path.read_text()
          block = Path('/tmp/redesigned-history-block.txt').read_text()

          block = block.replace(
              "{!loading && view === 'history' ? (",
              "{!loading && canAccessAttendanceView('history') && view === 'history' ? (",
              1,
          )

          actions = """<div className="attendance-history-actions">{canAccessAttendanceView('report') ? <button type="button" className="attendance-history-report-button" onClick={() => { if (selectedSession.attendance_date) setReportMonth(selectedSession.attendance_date.slice(0, 7)); setView('report'); }}>Xem báo cáo tháng</button> : null}{canAccessAttendanceView('quick') ? <button type="button" className="attendance-history-delete-button" disabled={busy} onClick={() => deleteAttendanceSession(selectedSession)}><Icon name="trash" size={17} />Xóa buổi điểm danh</button> : null}</div>"""
          block, count = re.subn(r'<div className="attendance-history-actions">.*?</div>', actions, block, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not apply history action permission guards')

          start_marker = "          {!loading && canAccessAttendanceView('history') && view === 'history' ? ("
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Cannot locate main history block start')
          end_marker = "          ) : null}\n        </main>"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Cannot locate main history block end')
          end += len("          ) : null}")
          path.write_text(text[:start] + block + text[end:])
          print('Restored redesigned history block onto latest permission-aware main JSX')
          PY
              git add src/components/GlobalAttendanceNavigationTab.jsx
            fi

            if printf '%s\n' "$conflicts" | grep -qx 'scripts/test-attendance-material3-ui.mjs'; then
              git checkout --ours scripts/test-attendance-material3-ui.mjs
              git add scripts/test-attendance-material3-ui.mjs
            fi
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          node scripts/test-attendance-material3-ui.mjs
          node scripts/test-attendance-granular-permissions.mjs
          npm ci --ignore-scripts
          npm run build

          git add -A
          git commit -m "merge: sync permission-aware main with history redesign [history-sync-v2]"
          git push origin HEAD:feat/attendance-history-detail-redesign
