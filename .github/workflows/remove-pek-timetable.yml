name: Remove PEK Timetable App

on:
  push:
    branches:
      - agent/remove-pek-timetable
    paths:
      - .github/workflows/remove-pek-timetable.yml

permissions:
  contents: write

jobs:
  remove-pek-timetable:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove PEK timetable app and backend
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          apps_path = Path('src/data/apps.js')
          apps = apps_path.read_text(encoding='utf-8')
          apps_pattern = re.compile(
              r"\n  \{\n    slug: 'pek-timetable',[\s\S]*?status: 'PEK live sync · Teachers · Classes', statusVi: 'Đồng bộ PEK · Giáo viên · Lớp học', api: true, featured: true\},\n",
              re.MULTILINE,
          )
          apps, count = apps_pattern.subn('\n', apps, count=1)
          if count != 1:
              raise SystemExit(f'Expected one PEK app catalog block, removed {count}')
          apps_path.write_text(apps, encoding='utf-8')

          tool_path = Path('src/pages/ToolPage.jsx')
          tool = tool_path.read_text(encoding='utf-8')
          import_line = "const PEKTimetable = lazy(() => import('./PEKTimetable.jsx'));\n"
          if import_line not in tool:
              raise SystemExit('PEKTimetable lazy import not found')
          tool = tool.replace(import_line, '', 1)
          route_block = "\n  if (tool?.slug === 'pek-timetable') {\n    return renderLazy(PEKTimetable, props);\n  }\n"
          if route_block not in tool:
              raise SystemExit('PEK timetable ToolPage route block not found')
          tool = tool.replace(route_block, '', 1)
          tool_path.write_text(tool, encoding='utf-8')

          files = [
              'src/pages/PEKTimetable.jsx',
              'src/pages/PEKTimetable.css',
              'src/pages/PEKTimetableDiagnostics.css',
              'api/pek-timetable.js',
              'api/pek-timetable-v2.js',
              'api/pek-timetable-v3.js',
              'api/_pek-core.js',
              'api/_pek-resources.js',
              'api/_vietschool-source.js',
              '.github/workflows/remove-pek-timetable.yml',
          ]
          for filename in files:
              path = Path(filename)
              if path.exists():
                  path.unlink()
          PY

      - name: Verify PEK references are gone
        shell: bash
        run: |
          if grep -RInE "pek-timetable|PEKTimetable|_pek-core|_pek-resources|_vietschool-source" src api --exclude-dir=node_modules; then
            echo "PEK references remain" >&2
            exit 1
          fi

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove PEK timetable app"
          git push origin HEAD:agent/remove-pek-timetable
