name: Gradebook Workbench 2 Safety
on:
  pull_request:
    paths:
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/utils/gradebookStudentView.js'
      - 'src/styles/GradebookAcademicWorkspace.css'
      - 'tests/gradebook-workbench-two.test.mjs'
      - 'tests/e2e/gradebook-workbench-two.spec.js'
      - '.github/workflows/gradebook-workbench-two.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/gradebook/GradebookEngine.jsx'
      - 'src/utils/gradebookStudentView.js'
      - 'src/styles/GradebookAcademicWorkspace.css'
jobs:
  workbench-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Roster sort, missing navigation, zero scores and regression checks
        run: |
          node --test tests/gradebook-workbench-two.test.mjs tests/gradebook-student-workbench.test.mjs tests/gradebook-studio-edition.test.mjs tests/gradebook-colorful-mockup.test.mjs tests/gradebook-material3-finish.test.mjs tests/gradebook-usability-material3.test.mjs tests/gradebook-productivity.test.mjs tests/gradebook-phase2.test.mjs tests/gradebook-phase3.test.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Workbench and 42 score columns in browser
        run: npx playwright test tests/e2e/gradebook-workbench-two.spec.js tests/e2e/gradebook-student-workbench.spec.js tests/e2e/gradebook-academic-geometry.spec.js tests/e2e/gradebook-usability-material3.spec.js --project=chromium-desktop
