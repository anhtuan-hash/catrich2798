name: Install global motion system once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-global-motion-system-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch motion system into app shell and Admin
        run: python scripts/install-global-motion-system-once.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Commit verified motion system
        run: |
          git config user.name "anhtuan-hash"
          git config user.email "anhtuan@pek.edu.vn"
          git add src/main.jsx src/pages/AdminPage.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(motion): enable admin-controlled site-wide motion"
          git push origin HEAD:main
